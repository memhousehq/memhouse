# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "memhouse-lite"
description = "MemHouse Lite embedded in a Python process: the REST API in process, with the same governance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/memhousehq/memhouse"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "memhouse_lite._lite"
# Not `release`: see [profile.bindings] in the workspace's Cargo.toml (LTO breaks the module on macOS).
profile = "bindings"

[tool.pytest.ini_options]
testpaths = ["tests"]
