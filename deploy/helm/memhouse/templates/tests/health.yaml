# SPDX-License-Identifier: Apache-2.0
# `helm test`: the service answers /health. The image has no shell; its own `memhouse health`
# is the client.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "memhouse.fullname" . }}-test-health
  labels:
    {{- include "memhouse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: health
      image: {{ include "memhouse.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: ["health", "--url", "http://{{ include "memhouse.fullname" . }}:{{ .Values.service.port }}"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
