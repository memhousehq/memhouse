[workspace]
resolver = "2"
members = ["crates/*", "xtask", "bindings/python", "bindings/node"]

[workspace.package]
version = "2.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/memhousehq/memhouse"
homepage = "https://github.com/memhousehq/memhouse"
readme = "README.md"
keywords = ["memory", "agents", "llm", "governance", "mcp"]
categories = ["database", "web-programming::http-server"]
# The lowest any locked dependency accepts: sqlx 0.9 asks for 1.94 (ort 2.0.0-rc.15 for 1.92).
rust-version = "1.94"

[workspace.dependencies]
memhouse-core = { path = "crates/memhouse-core", version = "2.0.0-rc.1" }
memhouse-store-postgres = { path = "crates/memhouse-store-postgres", version = "2.0.0-rc.1" }
memhouse-store-sqlite = { path = "crates/memhouse-store-sqlite", version = "2.0.0-rc.1" }
memhouse-models = { path = "crates/memhouse-models", version = "2.0.0-rc.1" }
memhouse-server = { path = "crates/memhouse-server", version = "2.0.0-rc.1" }
memhouse-bench = { path = "crates/memhouse-bench", version = "2.0.0-rc.1" }
memhouse-conformance = { path = "crates/memhouse-conformance", version = "2.0.0-rc.1" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1"
once_cell = "1"
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4"
futures = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
rand = "0.10"
serde_yaml_ng = "0.10"
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = "0.34"

[profile.release]
lto = "thin"
codegen-units = 4

# The embedded bindings (bindings/python, bindings/node) are built for distribution with this
# profile, not `release`. With LTO, the Apple build of a cdylib loses a runtime symbol of the
# standard library (`__isPlatformVersionAtLeast`) that the bundled ONNX Runtime calls; an
# extension module is linked with `-undefined dynamic_lookup`, so the linker does not notice and
# the module fails when it is loaded.
[profile.bindings]
inherits = "release"
lto = "off"
