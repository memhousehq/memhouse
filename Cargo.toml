[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/memhousehq/memhouse"
rust-version = "1.85"

[workspace.dependencies]
memhouse-core = { path = "crates/memhouse-core", version = "2.0.0" }
memhouse-store-postgres = { path = "crates/memhouse-store-postgres", version = "2.0.0" }
memhouse-models = { path = "crates/memhouse-models", version = "2.0.0" }
memhouse-server = { path = "crates/memhouse-server", version = "2.0.0" }
memhouse-bench = { path = "crates/memhouse-bench", version = "2.0.0" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1"
once_cell = "1"
sha2 = "0.11"
hex = "0.4"
futures = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
rand = "0.8"
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = "0.34"

[profile.release]
lto = "thin"
codegen-units = 4
