[package]
name = "memhouse-models"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["local"]
local = ["dep:fastembed", "dep:ort"]

[dependencies]
memhouse-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tracing.workspace = true
fastembed = { workspace = true, optional = true }
# Same version fastembed uses; needed to pin the CPU execution provider.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
fastembed = { workspace = true }
tokio = { workspace = true }
