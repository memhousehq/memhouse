[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Development tasks: `cargo xtask ci`, `spdx`, `links`, `version`, `site`, `secrets`, `sdk`, `install-hooks`.
[dependencies]
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The documentation site (`cargo xtask site`) and the heading anchors `cargo xtask links`
# checks links against: Markdown read once, the same way, by both.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
