# SPDX-License-Identifier: MemHouse-Sustainable-Use-1.0
#
# Publish only the exact version that reached main through a release PR. The
# release workflow then certifies and attaches platform artifacts.
name: Publish merged release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Tag and publish the merged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          tag="${RELEASE_BRANCH#release/}"
          repair=false

          if [[ "$tag" == *-repair ]]; then
            tag="${tag%-repair}"
            repair=true
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release branch must name a semantic tag, got $RELEASE_BRANCH"
            exit 1
          fi

          version=$(sed -n 's/.*version: "\([^"]*\)".*/\1/p' mix.exs)
          if [[ "$tag" != "v$version" ]]; then
            echo "Merged version $version does not match release tag $tag"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$repair" != true ]]; then
              echo "GitHub Release $tag already exists. Use an explicit repair release PR."
              exit 1
            fi
            gh release delete "$tag" --yes --cleanup-tag
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [[ "$repair" != true ]]; then
              echo "Git tag $tag already exists. Use an explicit repair release PR."
              exit 1
            fi
            git push origin ":refs/tags/$tag"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --title "MemHouse $tag" --generate-notes
          gh workflow run release.yml --ref main -f "tag=$tag"
          echo "Release published: $(gh release view "$tag" --json url --jq .url)"
