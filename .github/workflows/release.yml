# SPDX-License-Identifier: MemHouse-Sustainable-Use-1.0
#
# Release: the gate and publisher for a tagged version.
#
# Purpose
#   Repeat every blocking check against the exact tagged commit, confirm that the tag, the
#   declared version, the changelog, the shipped documentation, and the evaluation evidence
#   all describe the same release, then build verified Linux and macOS packages
#   with their checksums and rebuild the container image.
#
# Why the checks are repeated rather than trusted from the merge gate
#   The merge gate ran on a pull request's merge preview, not on the tagged commit. A tag
#   can point anywhere. Everything that must be true of the released bytes is therefore
#   re-established here from the tag itself.
#
# Trigger
#   Publishing a GitHub Release for an existing semantic tag, or a maintainer's manual retry
#   for one. GitHub owns the release notes; this workflow validates the selected tag and
#   attaches every generated artifact to that release.
#
# Outputs
#   A GitHub Release holding Linux x86_64, Linux ARM64, and macOS Apple Silicon
#   packages, their SHA-256 files, and the evaluation report; plus the tagged
#   production container in this repository's GHCR package.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Retries for the same GitHub Release share its tag-specific publication lock.
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Establish every release guardrail once on Linux, verify and retain that package, and
  # publish the container. The macOS builds wait for this job so scarce runner time is not
  # spent on a tag that fails metadata, evaluation, parity, or security checks.
  linux:
    name: Validate and build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: timescale/timescaledb-ha:pg18-all-oss@sha256:0aaf407844b3cc9adc4e86b326a16de5dbe26a087f09560837f9343c279a6dd5
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIX_ENV: test
      MEMHOUSE_DATABASE_MODE: external
      # Own database name so this workflow cannot collide with a concurrent lane. The
      # embedded historical tag is only part of the name and means nothing here.
      MEMHOUSE_TEST_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/memhouse_f11_release
    steps:
      # Explicit ref: the event workflow itself may be read from the default branch, while
      # the release checks must certify the commit selected by this GitHub Release's tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # No dependency cache anywhere in this workflow. A release is built from a clean
      # fetch so nothing carried over from an earlier run can end up in a shipped artifact.
      - run: mix deps.get
      # The same blocking checks the merge gate runs, in the same order, now against the
      # tagged commit. Type analysis is inline here rather than in a parallel job, since
      # there is no cached lookup table to justify separating it.
      - run: mix ash.codegen --check
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix sobelow --config
      - run: mix hex.audit
      # Deterministic evaluation, no models and no network, asserting the committed
      # correctness and citation floors. The report it writes is both an input to the next
      # step and a shipped artifact, so the published numbers are the ones actually gated.
      - run: >-
          mix memhouse.eval.release
          --no-model
          --assert-thresholds
          --run-id release-${{ github.run_id }}-${{ github.run_attempt }}
          --output /tmp/memhouse-f11-release.json
      # The release-specific check, and the one thing the merge gate cannot do: with the
      # tag supplied, it requires the tag to be exactly `v` followed by the version
      # declared in the project file, a dated changelog entry for that same version, the
      # release documentation to still describe this gate, and every report in the
      # evaluation evidence to name that same version. Stale evidence from a previous
      # version is rejected rather than accepted as good enough.
      - name: Validate tag, changelog, and eval guardrails
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          mix memhouse.release.check --tag "$tag" --eval-report /tmp/memhouse-f11-release.json
      # Dual purpose, and the ordering matters. This packages the release with the pinned,
      # checksum-verified embedded PostgreSQL, boots it from an empty data root, waits for
      # readiness, and reruns the whole suite against that self-started database — the
      # parity evidence. It also leaves the built release on disk, which is exactly what
      # the archive step below picks up. Shipping the artifact this lane just booted, and
      # not a separately built one, is what makes the verification meaningful.
      - name: Verify packaged pg0 lane and build platform release
        run: ./scripts/ci-pg0-lane
      - run: tar -C _build/prod/rel -czf /tmp/memhouse-linux-x86_64.tar.gz memhouse
      # The digest is published with the archive so a downloader can verify the bytes they
      # received are the bytes this run produced.
      - run: cd /tmp && shasum -a 256 memhouse-linux-x86_64.tar.gz > memhouse-linux-x86_64.tar.gz.sha256
      # Build once, then publish that exact local image under semantic-version and source-tag
      # names. Stable releases also advance `latest`; prereleases never do.
      - name: Build and publish production container
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision=$(git rev-parse HEAD)

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image:$version" \
            --tag "$image:$tag" \
            .
          docker push "$image:$version"
          docker push "$image:$tag"

          if [[ "$version" != *-* ]]; then
            docker tag "$image:$version" "$image:latest"
            docker push "$image:latest"
          fi
      # Keep a workflow-run copy for debugging and make the durable, versioned copies GitHub
      # Release assets in the final step below.
      - uses: actions/upload-artifact@v7
        with:
          name: memhouse-release-linux-x86_64-${{ github.run_id }}
          path: |
            /tmp/memhouse-linux-x86_64.tar.gz
            /tmp/memhouse-linux-x86_64.tar.gz.sha256
            /tmp/memhouse-f11-release.json
          retention-days: 90

  # Build and boot-test the glibc Linux ARM64 package on a native runner.
  linux-arm64:
    name: Build Linux ARM64
    needs: linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Confirm native runner architecture
        run: test "$(uname -m)" = "aarch64"
      - run: mix deps.get
      - name: Verify packaged pg0 lane and build platform release
        run: ./scripts/ci-pg0-lane
      - run: tar -C _build/prod/rel -czf /tmp/memhouse-linux-arm64.tar.gz memhouse
      - run: cd /tmp && shasum -a 256 memhouse-linux-arm64.tar.gz > memhouse-linux-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: memhouse-release-linux-arm64-${{ github.run_id }}
          path: |
            /tmp/memhouse-linux-arm64.tar.gz
            /tmp/memhouse-linux-arm64.tar.gz.sha256
          retention-days: 90

  # Build and boot-test the Apple Silicon package on its matching native runner.
  macos:
    name: Build macOS ${{ matrix.asset_arch }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            machine_arch: arm64
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Confirm native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine_arch }}"
      - run: mix deps.get
      # This builds the package, boots its embedded pg0 from an empty data root, waits for
      # readiness, and runs the full test suite against that database. The archive below is
      # made from the exact release that passed this platform check.
      - name: Verify packaged pg0 lane and build platform release
        run: ./scripts/ci-pg0-lane
      - name: Archive macOS release
        shell: bash
        run: |
          archive="memhouse-macos-${{ matrix.asset_arch }}.tar.gz"
          tar -C _build/prod/rel -czf "/tmp/$archive" memhouse
          cd /tmp
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: memhouse-release-macos-${{ matrix.asset_arch }}-${{ github.run_id }}
          path: |
            /tmp/memhouse-macos-${{ matrix.asset_arch }}.tar.gz
            /tmp/memhouse-macos-${{ matrix.asset_arch }}.tar.gz.sha256
          retention-days: 90

  # Fan in all platform outputs only after every package has booted and passed its checks,
  # then add them to the GitHub Release the maintainer published to start this workflow.
  publish:
    name: Publish release artifacts
    needs: [linux, linux-arm64, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MEMHOUSE_RELEASE_SIGNING_KEY: ${{ secrets.MEMHOUSE_RELEASE_SIGNING_KEY }}
    steps:
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/memhouse-release
          pattern: memhouse-release-*-${{ github.run_id }}
          merge-multiple: true
      - name: Sign update manifest and upload generated artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          version="${tag#v}"
          test -n "$MEMHOUSE_RELEASE_SIGNING_KEY"
          cd /tmp/memhouse-release
          jq -n \
            --arg version "$version" \
            --arg linux "$(cut -d' ' -f1 memhouse-linux-x86_64.tar.gz.sha256)" \
            --arg linux_arm "$(cut -d' ' -f1 memhouse-linux-arm64.tar.gz.sha256)" \
            --arg mac_arm "$(cut -d' ' -f1 memhouse-macos-arm64.tar.gz.sha256)" \
            '{schema: "memhouse-release-1", version: $version, automatic_eligible: true, assets: [
              {platform: "linux-x86_64", name: "memhouse-linux-x86_64.tar.gz", sha256: $linux},
              {platform: "linux-arm64", name: "memhouse-linux-arm64.tar.gz", sha256: $linux_arm},
              {platform: "macos-arm64", name: "memhouse-macos-arm64.tar.gz", sha256: $mac_arm}
            ]}' > release-manifest-v1.json
          elixir -e '
            key = System.fetch_env!("MEMHOUSE_RELEASE_SIGNING_KEY") |> Base.decode64!()
            bytes = File.read!("release-manifest-v1.json")
            :crypto.sign(:eddsa, :none, bytes, [key, :ed25519]) |> Base.encode64() |> IO.write()
          ' > release-manifest-v1.json.sig
          assets=(
            /tmp/memhouse-release/memhouse-linux-x86_64.tar.gz
            /tmp/memhouse-release/memhouse-linux-x86_64.tar.gz.sha256
            /tmp/memhouse-release/memhouse-linux-arm64.tar.gz
            /tmp/memhouse-release/memhouse-linux-arm64.tar.gz.sha256
            /tmp/memhouse-release/memhouse-macos-arm64.tar.gz
            /tmp/memhouse-release/memhouse-macos-arm64.tar.gz.sha256
            /tmp/memhouse-release/memhouse-f11-release.json
            /tmp/memhouse-release/release-manifest-v1.json
            /tmp/memhouse-release/release-manifest-v1.json.sig
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          gh release upload "$tag" "${assets[@]}" --clobber
