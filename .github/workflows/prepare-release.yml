# SPDX-License-Identifier: MemHouse-Sustainable-Use-1.0
#
# Prepare a versioned release PR from main. publish-release.yml finishes the
# tag and GitHub Release only after a human merges that PR.
name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 0.3.1
        required: true
        type: string
      replace_existing_release:
        description: Repair an already-published failed release with this version
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    # A release is always prepared from the protected default branch. Selecting
    # another ref in the Actions UI is intentionally a no-op.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: timescale/timescaledb-ha:pg18-all-oss@sha256:0aaf407844b3cc9adc4e86b326a16de5dbe26a087f09560837f9343c279a6dd5
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIX_ENV: test
      MEMHOUSE_DATABASE_MODE: external
      MEMHOUSE_TEST_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/memhouse_release_prepare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Validate version and update release metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"version {version!r} is not Semantic Versioning")

          def replace_all(path, old, new):
              body = Path(path).read_text()
              if old not in body:
                  raise SystemExit(f"expected {old!r} in {path}")
              Path(path).write_text(body.replace(old, new))

          current_match = re.search(r'version:\s*"([^"]+)"', Path("mix.exs").read_text())
          if current_match is None:
              raise SystemExit("mix.exs must declare a literal version")
          current = current_match.group(1)
          if current == version:
              raise SystemExit(f"{version} is already the declared application version")

          replace_all("mix.exs", f'version: "{current}"', f'version: "{version}"')

          changelog = Path("CHANGELOG.md")
          body = changelog.read_text()
          marker = "## [Unreleased]\n"
          if body.count(marker) != 1:
              raise SystemExit("CHANGELOG.md must contain exactly one Unreleased heading")
          changelog.write_text(body.replace(marker, f"{marker}\n## [{version}] - {date.today().isoformat()}\n", 1))

          for path in [
              "README.md",
              "AGENTS.md",
              "docs/index.md",
              "docs/reference/limitations.md",
              "docs/reference/contract-versions.md",
              "docs/reference/mix-tasks.md",
              "docs/getting-started/install-release.md",
              "specs/eval/surface-contract-inventory.json",
              "test/memhouse/f11_evaluation_ci_release_readiness_test.exs",
          ]:
              replace_all(path, current, version)
          PY
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check release metadata
        shell: bash
        run: |
          mix deps.get
          mix format --check-formatted
          mix test test/memhouse/f11_evaluation_ci_release_readiness_test.exs
          mix memhouse.release.check --tag "${{ steps.metadata.outputs.tag }}" --allow-missing-eval

      - name: Refuse an existing release unless repairing it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          REPLACE: ${{ inputs.replace_existing_release }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1 && [[ "$REPLACE" != "true" ]]; then
            echo "GitHub Release $TAG already exists. Use a new version, or explicitly select repair."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && [[ "$REPLACE" != "true" ]]; then
            echo "Git tag $TAG already exists. Use a new version, or explicitly select repair."
            exit 1
          fi

      - name: Commit and open release PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          REPLACE: ${{ inputs.replace_existing_release }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/${TAG}"

          if [[ "$REPLACE" == "true" ]]; then
            branch="${branch}-repair"
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Release-preparation branch $branch already exists."
            exit 1
          fi

          git switch -c "$branch"
          git add AGENTS.md CHANGELOG.md README.md docs mix.exs specs test
          git commit -m "Release ${TAG}"
          git push origin "HEAD:refs/heads/$branch"

          title="Release ${TAG}"
          [[ "$REPLACE" == "true" ]] && title="${title} repair"
          pr_url=$(gh pr create --base main --head "$branch" --title "$title" --body "Prepared by the release workflow. Merging this PR creates $TAG and dispatches the artifact release workflow.")
          echo "Release-preparation PR: $pr_url"
