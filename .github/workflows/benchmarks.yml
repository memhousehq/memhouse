# SPDX-License-Identifier: Apache-2.0
# Paid benchmark tiers (T2: cached enrichment; T3: LoCoMo QA), by manual dispatch only. The job
# runs in the `benchmarks` environment, which requires a maintainer's approval and is the only
# place the LLM key exists. Every run is capped with --max-cost-usd (docs/security/secrets.md).
name: benchmarks

on:
  workflow_dispatch:
    inputs:
      run:
        description: "t2 = guard with cached enrichment (~$0.01 when cached); t3 = LoCoMo QA (~$0.70)"
        type: choice
        options: [t2, t3]
        default: t2
      max_cost_usd:
        description: "Spend cap for the run, in US dollars"
        type: string
        default: "1.5"

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  paid:
    name: paid benchmark (${{ inputs.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: benchmarks
    env:
      MEMHOUSE_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - name: check the inputs
        env:
          CAP: ${{ inputs.max_cost_usd }}
        run: |
          echo "$CAP" | grep -Eq '^[0-9]+(\.[0-9]+)?$' || { echo "::error::max_cost_usd must be a number"; exit 1; }
          awk -v c="$CAP" 'BEGIN { exit !(c > 0 && c <= 5) }' || { echo "::error::max_cost_usd must be above 0 and at most 5"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
            .ci-home/models
            .ci-home/bench-data
          key: benchmarks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: benchmarks-${{ runner.os }}-
      - run: cargo build --release -p memhouse-cli
      - run: ./target/release/memhouse up
      - name: T2 guard
        if: inputs.run == 't2'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAP: ${{ inputs.max_cost_usd }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: ./target/release/memhouse bench guard --tier 2 --skip-latency -- --enrich-max-cost-usd "$CAP" ${LLM_BASE_URL:+--llm-base-url "$LLM_BASE_URL"}
      - name: T3 LoCoMo QA
        if: inputs.run == 't3'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAP: ${{ inputs.max_cost_usd }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: ./target/release/memhouse bench run --dataset locomo --qa --enrich --answer-model gpt-4o-mini --max-cost-usd "$CAP" --enrich-max-cost-usd "$CAP" ${LLM_BASE_URL:+--llm-base-url "$LLM_BASE_URL"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-${{ inputs.run }}
          path: |
            bench-results/**/report.md
            bench-results/**/summary.json
          if-no-files-found: ignore
