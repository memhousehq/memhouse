# SPDX-License-Identifier: Apache-2.0
# Checks on every push to main and every pull request, forks included (roadmap G09).
# Fork-safe by construction: `pull_request` (never `pull_request_target`), a read-only token, no
# secrets, no paid calls, credentials never persisted in the checkout. No benchmarks run here:
# they need public datasets with their own licence terms and, for paid tiers, an LLM key, so they
# run on a maintainer's machine on demand (docs/benchmarks.md). Actions are pinned to commit SHAs;
# Dependabot updates them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-${{ runner.os }}-
      - name: DCO sign-off on every commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=""
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::commits without a Signed-off-by line:$missing (see CONTRIBUTING.md)"
            exit 1
          fi
      - name: fmt, SPDX headers, links, secret scan, dependency policy, clippy, unit tests, release build
        run: cargo xtask ci --skip-e2e --skip-guard
      - name: secret scan of the whole history
        run: cargo xtask secrets --history

  e2e:
    name: end-to-end and governance suite
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-
      # The embedding model (MIT), downloaded once from Hugging Face.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/models
          key: models-${{ hashFiles('crates/memhouse-models/src/lib.rs') }}
      - name: build
        run: cargo build --release -p memhouse-cli
      # e2e.sh starts its own Postgres + pgvector, runs the CLI, server and MCP round trips, and
      # the governance suite (redaction, quarantine, isolation, deletion, audit, access): tests on
      # synthetic data, no datasets and no paid calls.
      - name: end-to-end and governance suite
        env:
          BIN: ./target/release/memhouse
          MEMHOUSE_MODEL_CACHE: ${{ runner.temp }}/models
        run: MEMHOUSE_HOME="$RUNNER_TEMP/e2e-home" bash scripts/e2e.sh
      # PROF-05: the README's quickstart, as written, in a clean container: from nothing to the
      # first recall within ten minutes. The binary just built is packed as a release archive
      # and installed by install.sh from a mirror beside the container; the model download is real.
      - name: quickstart in a clean container
        run: |
          scripts/release/package.sh target/release/memhouse x86_64-unknown-linux-gnu "$RUNNER_TEMP/quickstart"
          QUICKSTART_IMAGE=ubuntu:24.04 scripts/quickstart-test.sh "$RUNNER_TEMP"/quickstart/memhouse-*-x86_64-unknown-linux-gnu.tar.gz

  # Packaging (roadmap G21): the scripts, the workflows, the Helm chart, the install script and
  # the documentation site. The tools come at fixed versions with checked downloads
  # (scripts/release/tools.sh): the repository allows no third-party setup actions.
  packaging:
    name: packaging checks
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: pinned tools
        run: |
          scripts/release/tools.sh "$RUNNER_TEMP/tools" shellcheck actionlint helm
          echo "$RUNNER_TEMP/tools" >>"$GITHUB_PATH"
      - name: shellcheck
        run: |
          shellcheck -x install.sh scripts/release/*.sh scripts/container-test.sh scripts/helm-check.sh scripts/install-test.sh scripts/quickstart-test.sh scripts/release-dry-run.sh
          shellcheck --severity=warning scripts/e2e.sh scripts/sdk-conformance.sh scripts/ci.sh scripts/publish/*.sh bindings/python/test.sh
      - name: actionlint
        run: actionlint
      - name: Helm chart (lint, render, schema)
        run: scripts/helm-check.sh
      - name: install script against a made-up release
        run: |
          scripts/install-test.sh sh
          scripts/install-test.sh bash
      - name: release tag verification, on a throwaway repository
        run: scripts/release/verify-tag-test.sh
      - name: documentation site
        run: cargo xtask site --out "$RUNNER_TEMP/site"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 7

  # The Python and TypeScript SDKs, the embedded bindings they can run on, and the two framework
  # adapters (roadmap G18). Needs uv, pnpm and Node, which the two jobs above do not. No model is
  # called and no key is needed: the adapters' tests use a stand-in model.
  sdk:
    name: SDKs, embedded bindings and adapters
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # A cache of its own: beside the release build this job compiles the bindings and the
      # scenario's test, which the end-to-end job does not.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: sdk-${{ runner.os }}-
      # The embedding model (MIT), downloaded once from Hugging Face.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/models
          key: models-${{ hashFiles('crates/memhouse-models/src/lib.rs') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      # uv and pnpm are installed at fixed versions from their registries, with the installers the
      # runner already has: the repository allows only GitHub's own actions and the two used
      # above, so their setup actions cannot run here. uv fetches Python 3.12 for the adapters
      # when the runner does not have it.
      - name: uv and pnpm
        run: |
          pipx install uv==0.13.8
          npm install --global pnpm@12.18.0
          uv --version && pnpm --version
      - name: build
        run: cargo build --release -p memhouse-cli
      - name: embedded binding for Python (build and tests)
        run: bindings/python/test.sh
      - name: embedded binding for Node.js (build and tests)
        working-directory: bindings/node
        run: pnpm install --frozen-lockfile && pnpm build && pnpm test
      # sdk-conformance.sh starts its own Lite deployment (one SQLite file), runs the profile
      # scenario through REST, both SDKs and both adapters, each SDK's tests, and the scenario
      # once more over the embedded bindings built above.
      - name: SDK conformance, over HTTP and embedded
        env:
          BIN: ./target/release/memhouse
          MEMHOUSE_MODEL_CACHE: ${{ runner.temp }}/models
        run: MEMHOUSE_HOME="$RUNNER_TEMP/sdk-home" bash scripts/sdk-conformance.sh --embedded
