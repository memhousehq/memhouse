# SPDX-License-Identifier: MemHouse-Sustainable-Use-1.0
#
# Continuous integration: the gate every change passes before it can reach the default
# branch.
#
# Purpose
#   Prove three things on a clean machine: the code is correct and clean against an
#   operator-run PostgreSQL, it behaves identically when run from the packaged release
#   that brings its own PostgreSQL, and the deployable artifacts still build.
#
# Triggers
#   Pull requests, pushes to the default branch, and merge queue entries.
#
# Inputs
#   None. No secrets and no repository variables are used, so a fork pull request runs
#   exactly the same lanes with exactly the same result. Anything needing a credential
#   belongs in the nightly evaluation workflow instead.
#
# Outputs
#   One artifact: the deterministic evaluation report produced by the first job.
#
# Release blockers
#   All four jobs below are intended to be required checks. Their `name:` values are the
#   strings a maintainer selects in the repository's branch protection settings, which is
#   why they are written out in full rather than left to default from the job id. Renaming
#   a job silently detaches it from that protection, so treat these names as fixed.
#
# Every lane runs on PostgreSQL, and there must never be a lane on an embedded file-based
# engine. Jobs, vector search, and full-text search all depend on PostgreSQL in both
# deployment modes; a lane on a different engine would be testing software nobody ships.
# A regression test asserts that this file never names such an engine, so do not mention
# one even in a comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Read-only by default. No job here writes to the repository, publishes a package, or
# pushes an image; those require an explicit human decision and separate permissions.
permissions:
  contents: read

# One run per pull request or branch. A new push supersedes the previous run, since the
# older result can no longer gate anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  # Lane 1 of 2 that runs the test suite. This one uses a PostgreSQL that somebody else
  # started, which is the deployment shape most operators use, and additionally carries
  # every static check and the deterministic quality floors. A failure here blocks merge.
  external-postgres:
    name: Deterministic gate (external Postgres)
    runs-on: ubuntu-24.04
    # Generous but bounded: the suite plus the evaluation matrix takes a while, and a hung
    # database connection would otherwise occupy a runner until the platform's own, far
    # longer, default job limit.
    timeout-minutes: 40
    services:
      # PostgreSQL with pgvector and pgvectorscale — the same image as Compose.
      postgres:
        image: timescale/timescaledb-ha:pg18-all-oss@sha256:0aaf407844b3cc9adc4e86b326a16de5dbe26a087f09560837f9343c279a6dd5
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Steps do not start until this reports healthy, so the first migration cannot race
        # cluster initialisation. Up to 20 tries, 5 seconds apart, 3-second probe timeout.
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MEMHOUSE_DATABASE_MODE: external
      # A lane-specific database name keeps this job from colliding with the other lanes
      # and workflows that use the same runner image. The name embeds a historical tag and
      # carries no meaning beyond uniqueness. The test environment reads its connection
      # string from this variable rather than DATABASE_URL, so an ambient DATABASE_URL can
      # never point the suite at a real database.
      MEMHOUSE_TEST_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/memhouse_f11_external
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # Cache keyed on the dependency lock file only, because that is what decides which
      # dependencies get compiled. A source change reuses the restored build directory and
      # lets the compiler's own change tracking recompile what actually moved.
      #
      # `restore-keys` matches the same prefix without the hash, so a changed lock file
      # restores the previous entry instead of starting from nothing. Mix then recompiles
      # only the dependencies whose lock entry moved. Without the fallback every dependency
      # bump rebuilt all of them, and a dependency that fetches a precompiled native binary
      # during compilation fetched it again, so an upstream outage failed the run for a
      # reason unrelated to the change under test.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-test-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-beam-test-
      - run: mix deps.get
      # Fails when the declared data model and the committed migrations plus schema
      # snapshots disagree. Catching that here matters because a missing migration would
      # otherwise be discovered as a runtime error on somebody's live database.
      - run: mix ash.codegen --check
      - run: mix format --check-formatted
      # Warnings are failures. An unused variable is trivial, but the same mechanism
      # catches an unreachable clause or a call to a function that no longer exists.
      - run: mix compile --warnings-as-errors
      # The whole suite: unit, property, and the focused contract tests that pin tenancy
      # isolation, governed writes, and the frozen HTTP behaviour.
      - run: mix test
      - run: mix credo --strict
      # Security-focused static analysis, reading the reviewed exception list from its own
      # configuration file rather than accepting flags here.
      - run: mix sobelow --config
      # Fails when a dependency version in use has been retired upstream, for example
      # because it was withdrawn for a security problem.
      - run: mix hex.audit
      # Runs the evaluation matrix and fails if answer correctness or citation grounding
      # has fallen below the committed floors. `--no-model` forces the deterministic local
      # extractor and answerer, which is what makes this reproducible and free of network
      # calls or credentials; the run id ties the report back to this exact workflow run.
      # Quality, latency, and token efficiency beyond those two floors are reported for
      # comparison but deliberately do not gate, so ordinary variance cannot block a merge.
      - name: Deterministic release evaluation
        env:
          MIX_ENV: test
        run: >-
          mix memhouse.eval.release
          --no-model
          --assert-thresholds
          --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          --output /tmp/memhouse-f11-eval.json
      # Provenance check: the report must name the application version, dataset identity
      # and hash, retrieval profile, deadline, all four model roles, and the judge. A
      # number without those cannot be reproduced or compared, so it must not be published.
      - run: mix memhouse.eval.verify /tmp/memhouse-f11-eval.json
      # Runs the release gate on every change, not only at tag time, so version, changelog,
      # documentation, and evaluation evidence never drift far enough apart to be awkward
      # to reconcile. No tag is passed here; the tag check applies only at release.
      - run: >-
          mix memhouse.release.check
          --eval-report /tmp/memhouse-f11-eval.json
      # Retained so a reviewer can inspect the exact scores behind a pass or a failure.
      - uses: actions/upload-artifact@v7
        with:
          name: deterministic-eval-${{ github.run_id }}
          path: /tmp/memhouse-f11-eval.json

  # Type analysis, on its own job because it needs no database and its lookup table is
  # expensive to build. Separating it means a type error is reported even while the test
  # lanes are still running. A failure here blocks merge.
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # The persistent lookup table under priv/plts is cached alongside the build. Building
      # it from the standard library and every dependency takes minutes; checking against a
      # cached one takes seconds. Its own cache key prefix keeps this entry, which covers
      # priv/plts, from being displaced by the test lane's entry, which does not.
      #
      # The key carries the resolved OTP and Elixir versions, not just `mix.lock`. A PLT
      # records the OTP that built it, and Erlang rejects a foreign one outright with
      # "Old PLT file" rather than rebuilding it. Since `otp-version: "27"` resolves to
      # whatever 27.x the runner image ships, a patch bump would otherwise restore a PLT
      # the new OTP refuses, and an unchanged lockfile would keep restoring it forever.
      #
      # The fallback prefix keeps both versions for that same reason. Truncating it to
      # `-dialyzer-` would restore a PLT built by a different OTP, which is the failure the
      # key was written to prevent.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      - run: mix dialyzer

  # Lane 2 of 2 that runs the test suite, and the parity evidence for the claim that the
  # two deployment modes behave identically. It builds the downloadable release with the
  # pinned embedded PostgreSQL staged inside it, boots it the way an end user would with no
  # database installed, waits for the readiness endpoint, then runs the entire suite
  # against that self-started database. If a behaviour only holds when a human set up
  # PostgreSQL by hand, this job fails. It blocks merge.
  pg0:
    name: Deterministic gate (packaged pg0)
    runs-on: ubuntu-24.04
    # The longest of the three parallel lanes: it packages a release, downloads and
    # verifies the database asset, boots it, and only then starts the suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # Prefix fallback for the reason given in the external PostgreSQL lane: a changed lock
      # file must not force every dependency to be fetched and rebuilt.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-pg0-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-beam-pg0-
      - run: mix deps.get
      # Needs network access: the database asset is downloaded from upstream and checked
      # against a digest pinned in the repository. Every other setting the release needs is
      # supplied by the script itself, so nothing on the runner can influence the outcome.
      - run: ./scripts/ci-pg0-lane

  # Artifact build, last because it is pointless to build a release from code that has not
  # passed. Both artifacts are built and thrown away: the point is to prove they still
  # build, which fails for reasons the test lanes cannot see — a native dependency that
  # will not compile for production, a missing file in the container context, or a base
  # image that has moved. This job blocks merge.
  builds:
    name: Release and container builds
    needs: [external-postgres, dialyzer, pg0]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # Separate cache key from the test lanes: production build output is not
      # interchangeable with test build output and sharing a key would poison both. The
      # prefix fallback stays inside that separation.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-prod-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-beam-prod-
      # Production dependencies only, which also proves that nothing on a production path
      # has picked up an accidental dependency on a development or test package.
      - run: mix deps.get --only prod
      # `--overwrite` because the cached build directory may already hold a release from a
      # previous run of this job.
      - run: mix release --overwrite
      # The image is built and discarded. Nothing is pushed: publishing is a deliberate
      # human action, and this workflow has read-only permissions on purpose. Note that
      # this image contains no embedded database; it is the operator-run-PostgreSQL shape.
      # Builds an ordinary image and an attested image, then reads the public revision seam
      # from each built release. The attested image keeps the standard CI tag.
      - run: ./scripts/ci-campaign-build-revision
