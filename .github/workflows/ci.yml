# SPDX-License-Identifier: Apache-2.0
# Checks on every push to main and every pull request, forks included (roadmap G09).
# Fork-safe by construction: `pull_request` (never `pull_request_target`), a read-only token, no
# secrets, no paid calls, credentials never persisted in the checkout. No benchmarks run here:
# they need public datasets with their own licence terms and, for paid tiers, an LLM key, so they
# run on a maintainer's machine on demand (docs/benchmarks.md). Actions are pinned to commit SHAs;
# Dependabot updates them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-${{ runner.os }}-
      - name: DCO sign-off on every commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=""
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::commits without a Signed-off-by line:$missing (see CONTRIBUTING.md)"
            exit 1
          fi
      - name: fmt, SPDX headers, links, secret scan, dependency policy, clippy, unit tests, release build
        run: cargo xtask ci --skip-e2e --skip-guard
      - name: secret scan of the whole history
        run: cargo xtask secrets --history

  e2e:
    name: end-to-end and governance suite
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-
      # The embedding model (MIT), downloaded once from Hugging Face.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/models
          key: models-${{ hashFiles('crates/memhouse-models/src/lib.rs') }}
      - name: build
        run: cargo build --release -p memhouse-cli
      # e2e.sh starts its own Postgres + pgvector, runs the CLI, server and MCP round trips, and
      # the governance suite (redaction, quarantine, isolation, deletion, audit, access): tests on
      # synthetic data, no datasets and no paid calls.
      - name: end-to-end and governance suite
        env:
          BIN: ./target/release/memhouse
          MEMHOUSE_MODEL_CACHE: ${{ runner.temp }}/models
        run: MEMHOUSE_HOME="$RUNNER_TEMP/e2e-home" bash scripts/e2e.sh
