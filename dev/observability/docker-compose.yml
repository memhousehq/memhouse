# SPDX-License-Identifier: MemHouse-Sustainable-Use-1.0
#
# Local trace and metric stack for development only. Nothing here ships in a
# release or in the production container.
#
# Start it with:
#   docker compose -f dev/observability/docker-compose.yml up
#
# Then point the application at the collector by setting, in .env:
#   MEMHOUSE_OTEL_ENABLED=true
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:14318
#
# The application exports OTLP to the collector, the collector fans traces out
# to Jaeger and exposes metrics for Prometheus to scrape. Browse traces at
# http://localhost:16686 and Prometheus at http://localhost:9090.
#
# MemHouse spans are content-safe by construction: they carry ids, counts,
# profile and model names, timings, token counts, and error classes, never raw
# messages, prompts, answers, or secrets. Keep it that way — this stack has no
# redaction of its own.

services:
  # Single ingestion point for the application's OTLP exporter. The contrib
  # image is required because the Prometheus exporter is not in the core build.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      # Host 14318 rather than the usual 4318: developers commonly already have
      # something bound to 4318. Override with MEMHOUSE_OTEL_HTTP_PORT.
      - "${MEMHOUSE_OTEL_HTTP_PORT:-14318}:4318"
      # 8888 is the collector's own health/telemetry metrics; 8889 is the
      # pipeline metrics exporter that Prometheus scrapes.
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - jaeger

  # Trace UI. all-in-one keeps everything in memory, so traces are lost on
  # restart. That is fine for development and deliberate: no trace data is
  # persisted to disk.
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  # Scrapes the collector so you can see export throughput and drop counts.
  # 24h retention keeps the local volume small; this is not a metrics archive.
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
