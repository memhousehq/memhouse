# SPDX-License-Identifier: MemHouse-Sustainable-Use-1.0
#
# Build definition for the published MemHouse user documentation.
#
# Purpose: turn the Markdown under `docs/` into the static site served at
# https://memhousehq.github.io/memhouse/ by the `docs.yml` GitHub Actions
# workflow.
#
# Inputs:  every file under `docs/`, plus this file's `nav` ordering.
# Outputs: a static site in `site/` (git-ignored), uploaded as a Pages artifact.
#
# Assumptions and rules:
#   * `docs/` holds user-facing documentation only — installation, usage,
#     operations, and explanations of how the system behaves. Design documents,
#     specifications, ADRs, roadmaps, and evaluation evidence live in `specs/`
#     and are deliberately NOT part of this site.
#   * `strict: true` turns a broken internal link or a page missing from `nav`
#     into a build failure, so the published site cannot silently rot. Links
#     that point at `specs/` or at repository source must therefore be absolute
#     GitHub URLs, not relative paths — MkDocs cannot resolve anything outside
#     `docs/`.
#   * Diagrams are Mermaid fenced blocks. The `pymdownx.superfences` custom
#     fence below hands them to Material's bundled Mermaid renderer; no extra
#     JavaScript include is needed.
site_name: MemHouse
site_description: Governed agent memory — setup, usage, and how it works.
site_url: https://memhousehq.github.io/memhouse/
repo_url: https://github.com/memhousehq/memhouse
repo_name: memhousehq/memhouse
edit_uri: edit/main/docs/
copyright: >-
  MemHouse is source-available fair-code under the MemHouse Sustainable Use
  License 1.0.

# Fail the build on a broken internal link or an orphaned page rather than
# publishing a site with dead navigation.
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Resolves `:material-...:` shortcodes to inline SVG icons; without it those
  # shortcodes would render as literal text on the home page card grid.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # Renders ```mermaid blocks as diagrams instead of code listings.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/memhousehq/memhouse

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Install a release: getting-started/install-release.md
      - Run with Docker: getting-started/install-docker.md
      - Run from source: getting-started/install-source.md
      - Quickstart tutorial: getting-started/quickstart.md
  - How it works:
      - System overview: concepts/index.md
      - Memory model: concepts/memory-model.md
      - Ingest pipeline: concepts/ingest-pipeline.md
      - Governance gates: concepts/governance.md
      - Retrieval and context: concepts/retrieval.md
      - Documents and connectors: concepts/documents.md
      - Skill readiness: concepts/skills.md
      - Isolation and access control: concepts/security-model.md
      - Deployment modes: concepts/deployment-modes.md
  - Guides:
      - Authentication: guides/authentication.md
      - Exploring memory in the web console: guides/web-console.md
      - Recording observations: guides/ingesting-observations.md
      - Search and ask: guides/search-and-ask.md
      - Assembling context: guides/context.md
      - Checking skill readiness: guides/skill-readiness.md
      - Curating memory: guides/governance-console.md
      - Acting on your own data: guides/self-governance.md
      - Connecting an MCP client: guides/mcp.md
      - SDK helpers: guides/sdk-helpers.md
  - Operations:
      - Overview: operations/index.md
      - Upgrades: operations/upgrades.md
      - Health and cost: operations/health-and-costs.md
      - Observability: operations/observability.md
      - Simplified memory rollout: operations/simplified-memory-rollout.md
      - Backup and restore: operations/backup-restore.md
      - Export and import: operations/portability.md
  - Reference:
      - HTTP API: reference/http-api.md
      - Configuration: reference/configuration.md
      - Mix tasks: reference/mix-tasks.md
      - Contract versions: reference/contract-versions.md
      - Glossary: reference/glossary.md
      - Limitations: reference/limitations.md
