# Starter evaluation suite for the sales template: synthetic timelines with ground truth at
# checkpoints (docs/evaluation.md). `memhouse bench run --suite bench/suites/sales` replays it;
# `memhouse eval add bench/suites/sales/starter.yaml` makes it gate a tenant's policy changes.
name: sales-starter
description: 20 synthetic sales conversations (facts, corrections, plans carried out or dropped, guesses, small talk).
generate: { profile: sales, seed: 7, conversations: 20 }
