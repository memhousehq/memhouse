# SPDX-License-Identifier: Apache-2.0
# The Danish language pack. Draft: it passes its test set (languages/tests/da.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "da"
name = "Danish"
status = "draft"
text_search = "danish"

[detect]
words = [
  "og", "i", "at", "det", "er", "en", "et", "den", "til", "på", "de", "med", "for", "af", "ikke",
  "der", "som", "har", "han", "hun", "jeg", "vi", "du", "var", "sig", "men", "om", "fra", "eller",
  "hvad", "hvem", "hvor", "hvornår", "når", "kan", "skal", "vil", "blev", "have", "min", "mit",
  "sin", "sit", "deres", "vores", "også", "efter", "ved", "så", "nu", "over", "da", "mange",
  "meget", "noget", "nogle", "denne", "dette", "hos", "brugeren", "kun", "selv",
]
letters = "æøå"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
speculation = [
  "måske",
  "muligvis",
  "eventuelt",
  "sandsynligvis",
  "formentlig",
  "formodentlig",
  "antagelig(?:t|vis)?",
  "kunne (?:godt )?(?:tænkes|være)",
  "kan være,? at",
  "kan tænkes",
  "jeg tror",
  "jeg tænker",
  "jeg formoder",
  "jeg gætter på",
  "gad vide",
  "ikke sikker",
  "usikker på",
  "rygte(?:r|t|rne)?",
  "rygtes",
  "angiveligt",
  "efter sigende",
  "tilsyneladende",
  "åbenbart",
  "øjensynlig(?:t)?",
  "hypotetisk",
  "i teorien",
  "teoretisk",
  "overvejer",
  "overveje",
  "overvejede",
  "tænker på at",
  "leger med tanken",
  "hvis (?:vi|jeg|de|han|hun|du) (?:\\w+ ){0,6}(?:ville|havde|kunne|var)",
]
# A change to something stored before.
# "nu" (now) is a marker, as "jetzt" is in the German pack.
correction = [
  "faktisk",
  "rettelse",
  "korrektion",
  "berigtigelse",
  "jeg tog fejl",
  "tog fejl",
  "passer ikke længere",
  "ikke længere",
  "ikke mere",
  "i stedet",
  "har ændret sig",
  "ændret",
  "ændrede",
  "skiftet",
  "skiftede",
  "flyttet",
  "flyttede",
  "nu",
  "nu om dage",
  "i mellemtiden",
  "opdateret",
  "erstattet (?:af|med)",
  "tidligere",
  "før i tiden",
  "plejede at",
]
# An intention not yet carried out.
# "på fredag" is the coming Friday ("i fredags" is the last one). "skal" alone is left out: it is
# also "must" ("skal altid").
plan = [
  "planlægger",
  "planlægge",
  "planlagt",
  "har planer om",
  "plan(?:en|er) om",
  "har tænkt sig",
  "har i sinde",
  "har til hensigt",
  "hensigten er",
  "agter",
  "vil",
  "ville gerne",
  "ønsker at",
  "håber",
  "kommer til at",
  "næste (?:uge|måned|år|kvartal|mandag|tirsdag|onsdag|torsdag|fredag|lørdag|søndag|weekend|forår|sommer|efterår|vinter)",
  "(?:den |det )?kommende (?:uge|måned|år|kvartal|mandag|tirsdag|onsdag|torsdag|fredag|lørdag|søndag|weekend|forår|sommer|efterår|vinter)",
  "på (?:mandag|tirsdag|onsdag|torsdag|fredag|lørdag|søndag)",
  "i morgen",
  "i overmorgen",
  "snart",
  "senere (?:i denne uge|på ugen|i denne måned|på måneden|i år|på året)",
  "husk at",
  "mangler (?:stadig )?at",
  "skal (?:stadig|lige|snart)",
  "målet er",
]
preference = [
  "foretrækker",
  "foretrak",
  "foretrukne?",
  "præference",
  "kan (?:\\w+ ){0,2}godt lide",
  "kan lide",
  "ikke lide",
  "holder (?:(?:meget|rigtig|virkelig) ){0,2}af",
  "elsker",
  "nyder",
  "hader",
  "yndlings\\w+",
  "favorit\\w*",
  "hellere",
  "helst",
  "gerne",
  "ikke (?:fordrage|udstå|tåle)",
  "allergisk over ?for",
  "vild med",
  "glad for",
]
# Only at the start of the statement.
# Danish puts the verb second, so "altid", "aldrig" or "ikke" as the second word means the first
# word is an imperative ("Kør altid …", "Send ikke …").
instruction_start = [
  "altid",
  "aldrig",
  "sørg for",
  "undgå",
  "undlad",
  "brug",
  "benyt",
  "kør",
  "tjek",
  "vær sikker på",
  "\\w+ (?:altid|aldrig|ikke)",
]
instruction = [
  "skal altid",
  "bør altid",
  "skal aldrig",
  "bør aldrig",
  "må aldrig",
]
# Past events: a dated reference or a completed action.
# "tog" alone is also the noun (a train); "ansat" alone is also a state ("er ansat hos").
event = [
  "i ?går",
  "i forgårs",
  "i (?:mandags|tirsdags|onsdags|torsdags|fredags|lørdags|søndags)",
  "(?:sidste|forrige) (?:uge|måned|år|nat|weekend|mandag|tirsdag|onsdag|torsdag|fredag|lørdag|søndag|forår|sommer|efterår|vinter)",
  "for (?:\\w+ ){1,3}siden",
  "købte",
  "købt",
  "solgte",
  "solgt",
  "besøgte",
  "besøgt",
  "tog (?:til|på|hen|af sted)",
  "adopterede",
  "adopteret",
  "startede",
  "startet",
  "begyndte",
  "begyndt",
  "afsluttede",
  "afsluttet",
  "færdiggjorde",
  "færdiggjort",
  "færdiguddannet",
  "dimitterede",
  "dimitteret",
  "underskrev",
  "underskrevet",
  "skrev under",
  "skrevet under",
  "tiltrådte",
  "forlod",
