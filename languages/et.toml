# SPDX-License-Identifier: Apache-2.0
# The Estonian language pack. Draft: it passes its test set (languages/tests/et.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
# Estonian inflects by suffix: markers are stems with a bounded class of endings, and the time
# templates take the unit, weekday and month in the case the phrase needs ("kaks nädalat tagasi",
# "eelmisel kuul", "laupäeval", "veebruaris"). Postgres has no Estonian stemmer: text search is
# "simple".
format = 1
language = "et"
name = "Estonian"
status = "draft"
text_search = "simple"

[detect]
words = [
  "ja", "on", "ei", "et", "kui", "ka", "see", "ta", "ma", "sa", "me", "te", "nad", "mis", "kes",
  "kus", "millal", "miks", "kuidas", "või", "aga", "ning", "oli", "ole", "olen", "oled", "olid",
  "selle", "tema", "minu", "sinu", "meie", "nende", "mida", "mille", "kas", "siis", "veel", "juba",
  "nüüd", "ainult", "väga", "nagu", "sest", "kuid", "vaid", "koos", "ilma", "pärast", "enne",
  "kuni", "üle", "kohta", "oma", "seda", "need", "neid", "mul", "tal", "pole", "kasutaja",
  "kasutajal",
]
letters = "äöõüšž"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# "võib" alone (may, is allowed to) is left out: only "võib-olla" and "võib juhtuda" are hedges.
speculation = [
  "võib[- ]olla",
  "võib juhtuda",
  "võimalik,? et",
  "vist",
  "vististi",
  "ilmselt",
  "tõenäoliselt",
  "arvatavasti",
  "oletatavasti",
  "eeldatavasti",
  "küllap",
  "arvan",
  "ma usun",
  "usun,? et",
  "kahtlustan",
  "ma pakun",
  "mulle tundub",
  "tundub,? et",
  "paistab,? et",
  "näib,? et",
  "(?:ei ole|pole) kindel",
  "ei tea,? kas",
  "kuuluju(?:tt|tu|tud|ttu|ttude|tte)",
  "kuuldavasti",
  "kuulu järgi",
  "väidetavalt",
  "nähtavasti",
  "hüpoteetiliselt",
  "teoreetiliselt",
  "kaalu(?:b|vad|n|me) (?:\\w+ ){0,3}\\w+mist",
  "mõtle(?:b|vad|n|me) (?:\\w+ ){0,3}\\w+mise(?:le|st)",
  "kui (?:\\w+ ){0,4}(?:oleks|saaks|võiks|peaks|tahaks|läheks|teeks|tuleks)(?:in|id|ime|ite)?",
]
# A change to something stored before.
correction = [
  "tegelikult",
  "õigupoolest",
  "parandus",
  "täpsustus",
  "eksisin",
  "(?:ei|pole|ega) (?:\\w+ ){0,3}enam",
  "enam (?:ei|pole)",
  "asemel",
  "on muutunud",
  "muutus",
  "muutusid",
  "muutis",
  "vaheta(?:s|sid|nud)",
  "läks(?:id)? üle",
  "üle läinud",
  "läinud üle",
  "koli(?:s|sid|sin|sime|nud)",
  "nüüd",
  "nüüdsest",
  "praeguseks",
  "vahepeal",
  "uuendatud",
  "asendatud",
  "asendati",
  "varem",
  "varemalt",
  "vanasti",
  "enne (?:elas|töötas|oli|kasutas)",
]
# An intention not yet carried out.
plan = [
  "plaani(?:b|vad|n|me|s|sid)",
  "plaanis",
  "kavatse(?:b|vad|n|me|s|sid)",
  "kavas",
  "kavatsus",
  "taha(?:b|vad|n|me)",
  "tahaks(?:in|id|ime)?",
  "soovi(?:b|vad|n|me)",
  "sooviks(?:in|id|ime)?",
  "looda(?:b|vad|n|me)",
  "hakka(?:b|vad|n|me)",
  "eesmärk on",
  "järgmi(?:sel|ses|se|ne) (?:nädalal|nädala|nädal|kuul|kuu|aastal|aasta|kvartalis|kvartal|esmaspäeval|teisipäeval|kolmapäeval|neljapäeval|reedel|laupäeval|pühapäeval|nädalavahetusel|kevadel|suvel|sügisel|talvel)",
  "tuleva(?:l)? (?:nädalal|nädala|kuul|kuu|aastal|aasta|esmaspäeval|teisipäeval|kolmapäeval|neljapäeval|reedel|laupäeval|pühapäeval|nädalavahetusel)",
  "homme",
  "ülehomme",
  "hiljem (?:sel nädalal|sel kuul|sel aastal)",
  "lähiajal",
  "(?:peab|peavad|tuleb) veel",
  "on vaja",
  "vaja on",
  "pea(?:ge)? meeles",
  "ära unusta",
  "ärge unustage",
]
preference = [
  "eelista(?:b|vad|n|me|s|sid)",
  "eelistus\\w*",
  "meeldi(?:b|vad|s|sid)",
  "armasta(?:b|vad|n|me)",
  "naudi(?:b|vad|n|me)",
  "vihka(?:b|vad|n|me)",
  "ei (?:talu|salli|kannata|seedi)",
  "lemmik\\w*",
  "pigem",
  "meelsasti",
  "kõige meelsamini",
  "allergili(?:ne|sed)",
]
# Only at the start of the statement.
instruction_start = [
  "alati", "mitte kunagi", "ära", "ärge", "palun", "veendu(?:ge)?", "hoolitse(?:ge)?", "väldi",
  "vältige", "kasuta(?:ge)?", "käivita(?:ge)?", "jälgi(?:ge)?", "kontrolli(?:ge)?", "eelista(?:ge)?",
]
instruction = [
  "(?:peab|peavad|tuleb) alati",
  "alati (?:peab|peavad|tuleb)",
  "ei (?:tohi|või) (?:mitte )?kunagi",
  "kunagi ei (?:tohi|või)",
]
# Past events: a dated reference or a completed action.
event = [
  "eile",
  "üleeile",
  "(?:eelmi(?:sel|ses|ne)|möödunud|läinud) (?:nädalal|kuul|aastal|ööl|nädalavahetusel|esmaspäeval|teisipäeval|kolmapäeval|neljapäeval|reedel|laupäeval|pühapäeval|kevadel|suvel|sügisel|talvel)",
  "\\d+ (?:päeva|nädalat|kuud|aastat) tagasi",
  "(?:paar|kaks|kolm|neli|viis|kuus|mõni|mitu) (?:päeva|nädalat|kuud|aastat) tagasi",
  "(?:päev|nädal|kuu|aasta) tagasi",
  "ost(?:is|sid|sin|sime|nud)",
  "müü(?:s|sid|sin|sime|nud)",
  "külasta(?:s|sid|sin|sime|nud)",
  "käi(?:s|sid|sin|sime|nud)",
  "läks(?:id|in|ime)?",
  "läinud",
  "adopteeri(?:s|sid|sin|sime|nud)",
  "võt(?:tis|sid|sin|sime|nud)",
  "alusta(?:s|sid|sin|sime|nud)",
  "lõpeta(?:s|sid|sin|sime|nud)",
  "allkirjasta(?:s|sid|sin|sime|nud)",
  "liitu(?:s|sid|sin|sime|nud)",
  "lahku(?:s|sid|sin|sime|nud)",
  "kohtu(?:s|sid|sin|sime|nud)",
  "osale(?:s|sid|sin|sime|nud)",
  "abiellu(?:s|sid|sin|sime|nud)",
  "sai(?:d|n|me)?",
  "saanud",
  "and(?:is|sid|sin|sime|nud)",
  "teg(?:i|id|in|ime)",
  "teinud",
  "tarni(?:s|sid|nud)",
  "pikenda(?:s|sid|sin|sime|nud)",
  "tühista(?:s|sid|sin|sime|nud)",
  "maks(?:is|id|in|ime|nud)",
  "broneeri(?:s|sid|sin|sime|nud)",
  "telli(?:s|sid|sin|sime|nud)",
  "tagasta(?:s|sid|sin|sime|nud)",
  "reisi(?:s|sid|sin|sime|nud)",
  "sõit(?:is|sid|sin|sime|nud)",
  "võit(?:is|sid|sin|sime|nud)",
  "kaota(?:s|sid|sin|sime|nud)",
  "sündi(?:s|sid|nud)",
  "sur(?:i|id|nud)",
  "tähista(?:s|sid|sin|sime|nud)",
  "palka(?:s|sid|sin|sime|nud)",
  "vallanda(?:s|sid|ti|tud)",
  "jäi(?:d)? pensionile",
  "soeta(?:s|sid|sin|sime|nud)",
  "uuenda(?:s|sid|sin|sime|nud)",
  "avalda(?:s|sid|sin|sime|nud)",
  # The impersonal past, verb by verb ("leping allkirjastati").
  "(?:osteti|müüdi|allkirjastati|avaldati|tarniti|tühistati|pikendati|broneeriti|telliti|tagastati|lõpetati|alustati|uuendati|maksti|tehti|anti|võeti|palgati|asutati)",
]

[relations]
# The possessor comes first, in the genitive (which has no ending of its own): "Dana on Bobi juht".
relationship = [
  "\\b(?:on|oli|olid|sai) (?:nüüd )?\\p{L}+[aeiouõäöü] (?:uus )?(?:juht|ülemus|kolleeg|töökaaslane|naine|abikaasa|mees|elukaaslane|partner|tüdruksõber|poiss-sõber|vend|õde|ema|isa|poeg|tütar|sõber|nõbu|onu|tädi|naaber|mentor|klient|tarnija|omanik|asutaja|tegevjuht|kontaktisik|sponsor)\\b",
  "\\b(?:allub \\p{L}+|töötab \\p{L}+ (?:heaks|juures|alluvuses)|on abielus|on kihlatud|on sugulane)\\b",
]
people = [
  "õde", "õe", "vend", "venna", "ema", "isa", "vanem", "vanemad", "naine", "naise", "abikaasa",
  "mees", "mehe", "elukaaslane", "partner", "poeg", "poja", "tütar", "tütre", "laps", "lapse",
  "lapsed", "sõber", "sõbra", "sõbrad", "sõbranna", "kolleeg", "töökaaslane", "ülemus", "juht",
  "meeskond", "tiim", "naaber", "nõbu", "onu", "tädi", "vanaema", "vanaisa", "tüdruksõber",
  "poiss-sõber", "koer", "koera", "kass", "kassi", "lemmikloom",
]

[values]
stop = [
  "kasutaja", "kasutajal", "kasutajale", "kasutajat", "selle", "seda", "need", "neid", "koos",
  "olid", "olnud", "olema", "nende", "neil", "tema", "temal", "seal", "siin", "siis", "millal",
  "mille", "mida", "milline", "samuti", "ainult", "väga", "mõned", "rohkem", "enamik", "teised",
  "teie", "meie", "sinu", "minu", "enam", "tegelikult", "asemel", "kolis", "kolinud", "vahetas",
  "muutis", "muutus", "uuendatud", "varem", "nüüd", "praegu", "parandus", "kuid", "sest", "nagu",
  "pole",
]
value_stop = [
  "kasutaja", "kasutajal", "kasutajale", "ta", "tema", "tal", "nad", "nende", "neil", "see",
  "selle", "seda", "need", "koos", "on", "oli", "olid", "olnud", "sai", "saab", "nüüd", "praegu",
  "hiljuti", "äsja", "kokku", "korda", "kord", "aeg", "ja", "ning", "umbes", "ligikaudu",
  "peaaegu", "üle", "alla", "rohkem", "kui", "ka", "ainult", "veel", "juba", "uus", "uue", "uut",
  "oma", "meie", "sinu", "minu", "ei", "et",
]
identifier = [
  "arve", "arvega", "arvele", "tellimus", "tellimuse", "tellimusega", "pilet", "pileti",
  "pöördumine", "pöördumise", "pöördumisega", "juhtum", "juhtumi", "konto", "id", "nr", "number",
  "viide", "viite", "versioon", "versiooni", "tuba", "toa", "ruum", "ruumi", "lend", "lennu", "laud",
  "koht", "värav", "perroon", "marsruut", "buss", "liin", "mudel", "seerianumber", "toode",
  "artikkel", "sku", "probleem", "viga", "korter", "hoone", "korrus", "sihtnumber", "postiindeks",
  "kood",
]
quantity = [
  "null", "üks", "kaks", "kolm", "neli", "viis", "kuus", "seitse", "kaheksa", "üheksa", "kümme",
  "üksteist", "kaksteist", "kolmteist", "neliteist", "viisteist", "kuusteist", "seitseteist",
  "kaheksateist", "üheksateist", "kakskümmend", "kolmkümmend", "nelikümmend", "viiskümmend",
  "kuuskümmend", "seitsekümmend", "kaheksakümmend", "üheksakümmend", "sada", "tuhat", "miljon",
  "korra", "kord", "kahekordne", "kolmekordne", "pool", "tosin", "paar", "mitu", "mõni", "vähe",
]
dates = [
  "\\b\\d{1,2}\\.\\s*(?:jaan|veebr|märts|apr|mai|juun|juul|aug|sept|okt|nov|dets)\\w*\\.?",
  "\\b\\d{1,2}\\.\\d{1,2}\\.(?:\\d{2,4})?",
