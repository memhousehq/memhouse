# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# Amounts written onto a number: "5a" (years), "3tk" (pieces).
number_suffixes = ["a", "tk"]
# Stems: the templates add the case ending ("laupäeval", "reedel").
weekdays = [
  ["esmaspäev"], ["teisipäev"], ["kolmapäev"], ["neljapäev"], ["reede"], ["laupäev"], ["pühapäev"],
]
months = [
  ["jaanuar(?:i|is|il|ist|ini)?"], ["veebruar(?:i|is|il|ist|ini)?"], ["märts(?:i|is|il|ist|ini)?"],
  ["aprill(?:i|is|il|ist|ini)?"], ["mai(?:s|l|st|ni)?"], ["juuni(?:s|l|st|ni)?"],
  ["juuli(?:s|l|st|ni)?"], ["august(?:i|is|il|ist|ini)?"], ["septemb(?:er|ri|ris|ril|rist|rini)"],
  ["oktoob(?:er|ri|ris|ril|rist|rini)"], ["novemb(?:er|ri|ris|ril|rist|rini)"],
  ["detsemb(?:er|ri|ris|ril|rist|rini)"],
]
month_names = [
  "jaanuar", "jaanuari", "jaanuaris", "jaanuaril", "veebruar", "veebruari", "veebruaris",
  "veebruaril", "märts", "märtsi", "märtsis", "märtsil", "aprill", "aprilli", "aprillis",
  "aprillil", "mai", "mais", "mail", "juuni", "juunis", "juunil", "juuli", "juulis", "juulil",
  "august", "augusti", "augustis", "augustil", "september", "septembri", "septembris",
  "septembril", "oktoober", "oktoobri", "oktoobris", "oktoobril", "november", "novembri",
  "novembris", "novembril", "detsember", "detsembri", "detsembris", "detsembril",
]
# "kaks nädalat tagasi": the postposition follows.
ago = ["{num}\\s+{unit}\\s+(?:tagasi|eest)"]
# "viimase kolme kuu jooksul", "eelmisel nädalal"
past = ["(?:viimase|viimaste|viimasel|viimastel|eelmi(?:sel|se|ne)|möödunud|läinud)\\s+(?:{num}\\s+)?{unit}"]
# "eelmisel kuul" and "eelmisel aastal" are the previous calendar month and year; "viimase kuu
# jooksul" is the last thirty days.
calendar = ["^(?:eelmi|möödunud|läinud)"]
# "eelmisel laupäeval", "sel laupäeval", "laupäeval"
last_weekday = ["(?:eelmi(?:sel|se|ne)|möödunud|läinud|sel|sellel)\\s+{weekday}(?:al|l|a)?", "{weekday}(?:al|l)"]
strictly_before = ["^(?:eelmi|möödunud|läinud)"]
last_weekend = ["(?:eelmi(?:sel|se|ne)|möödunud|läinud)\\s+nädalavahetus(?:el|e)?"]
yesterday = ["eile", "eilne", "eilse", "eilsel"]
# "sel nädalal", "see kuu", "käesoleval aastal"
this = ["(?:sel|sellel|selle|see|käesoleva|käesoleval|jooksva|jooksval)\\s+{unit}"]
# "veebruaris", "3. juunil"
in_month = ["(?:{day}\\.\\s*)?{month}"]

[time.numbers]
"üks" = 1
"ühe" = 1
kaks = 2
kahe = 2
paar = 2
paari = 2
kolm = 3
kolme = 3
"mõni" = 3
"mõne" = 3
mitu = 3
mitme = 3
neli = 4
nelja = 4
viis = 5
viie = 5
kuus = 6
kuue = 6
seitse = 7
seitsme = 7
kaheksa = 8
"üheksa" = 9
"kümme" = 10
"kümne" = 10
"üksteist" = 11
kaksteist = 12

[time.units]
day = ["päev(?:a|al|ad|ade|adel)?"]
week = ["nädal(?:a|at|al|as|ad|ate|atel)?"]
month = ["kuu(?:d|l|s|de|del)?"]
year = ["aasta(?:t|l|s|d|te|tel)?"]

# The words that split a question about several things into sub-queries.
[query]
or = ["või"]
or_not = ["või mitte", "või ei"]
# "A ja B vahel": the postposition follows, so each side is one word.
between = ["(\\S+)\\s+ja\\s+(\\S+)\\s+vahel"]
clause = ["kui", "enne kui", "pärast seda,? kui", "pärast", "alates", "kuni", "sellal kui", "samal ajal kui"]
lead = [
  "mis", "mida", "mille", "millega", "millist?", "millised", "milliseid", "millistel", "kes",
  "keda", "kelle", "kellega", "millal", "kus", "kuhu", "kust",
  "kui\\s+(?:palju|kaua|vana|tihti|sageli)",
  "mitu\\s+\\w+", "kuidas", "kas", "miks",
]
article = ["minu", "mu", "meie", "see", "selle", "too", "need", "nende"]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  "\\b(?:eira(?:ke)?|ignoreeri(?:ge)?|unusta(?:ge)?|tühista(?:ge)?|ära (?:arvesta|järgi|pööra tähelepanu)|ärge (?:arvestage|järgige))\\b[^.\\n]{0,40}\\b(?:eelnev\\w*|varasem\\w*|eelmi\\w+|senis\\w+|kõik|kõiki|kõigi|ülaltoodud|oma|enda|sinu)\\b[^.\\n]{0,25}\\b(?:juhis\\w*|juhend\\w*|reegl\\w+|korraldus\\w*|käsk\\w*|käsu\\w*|viip\\w*|viiba\\w*|prompt\\w*)",
  "\\bjäta(?:ke)?\\b[^.\\n]{0,60}\\b(?:juhis\\w*|juhend\\w*|reegl\\w+|korraldus\\w*)\\b[^.\\n]{0,20}\\btähelepanuta\\b",
  "\\bjäta(?:ke)? tähelepanuta\\b[^.\\n]{0,40}\\b(?:juhis\\w*|juhend\\w*|reegl\\w+|korraldus\\w*)",
]
role_hijack = [
  "\\b(?:(?:sa )?oled nüüd|(?:nüüdsest|edaspidi|sellest hetkest)(?: peale| alates)?,? (?:sa )?(?:oled|vastad|räägid|pead|käitud|tegutsed)|käitu (?:nagu|kui) (?:piiranguteta|piiramatu|tsenseerimata)|teeskle,? et sul (?:ei ole|pole) (?:mingeid |ühtegi )?(?:reegleid|piiranguid))",
]
system_prompt = [
  "\\b(?:näita(?:ke)?|avalda(?:ge)?|paljasta(?:ge)?|prindi|printige|väljasta(?:ge)?|ütle|öelge|kirjuta(?:ge)?|lekita(?:ge)?)\\b[^.\\n]{0,40}\\b(?:süsteemi ?viip\\w*|süsteemi ?viiba\\w*|süsteemi ?prompt\\w*|system prompt\\w*|süsteemijuhis\\w*|(?:peidetud|varjatud) juhis\\w*|arendaja ?sõnum\\w*)",
]
memory_directive = [
  "\\b(?:alati|iga kord|millal iganes|kui tahes)\\b[^.\\n]{0,60}\\b(?:saada|saatke|edasta(?:ge)?|suuna(?:ke)?|laadi(?:ge)?|kanna|kandke|meili(?:ge)?)\\b[^.\\n]{0,80}(?:https?://|@|\\brahakot\\w+|\\bwallet\\b)",
]
tool_directive = [
  "\\b(?:käivita(?:ge)?|jooksuta(?:ge)?|täida|täitke|kutsu(?:ge)?)\\b[^.\\n]{0,30}\\b(?:käsk|käsu|käsklus\\w*|tööriist\\w*|funktsioon\\w*)\\b[^.\\n]{0,40}(?:rm -rf|curl [^ ]+\\s*\\|\\s*(?:ba)?sh|transfer_funds|delete_all)",
]
