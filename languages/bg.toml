# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  "\\b(?:игнорирай(?:те)?|пренебрегни|пренебрегнете|забрави|забравете|не обръщай(?:те)? внимание на|не спазвай(?:те)?|отмени|отменете|заобиколи|заобиколете)\\b[^.\\n]{0,40}\\b(?:предишн\\w{1,3}|предходн\\w{1,3}|досегашн\\w{1,3}|по-ранн\\w{1,3}|горн\\w{1,3}|всичк\\w{1,3}|(?:тво|сво)(?:й|я|ят|ята|ето|е|и|ите)|ваш(?:ия|ият|ата|ето|ите|и|а|е)?)\\b[^.\\n]{0,25}\\b(?:инструкци\\w{1,3}|указани\\w{1,3}|правил\\w{1,3}|насок\\w{1,3}|напътстви\\w{1,3}|команд\\w{1,3}|промпт\\w{0,4})",
]
# The verb after "ще" must be in the second person ("ще отговаряш"): "отсега нататък ще работи
# от вкъщи" is an ordinary statement.
role_hijack = [
  "\\b(?:(?:от ?сега нататък|от ?тук нататък|занапред|от този момент(?: нататък)?),? (?:ти |вие )?(?:ще|трябва да|да) (?:(?:се|си|ми|ни|му|им|го|я|ги) ){0,2}\\w{3,}(?:ш|те)\\b|ти (?:сега |вече |отсега )си\\b|ти си (?:сега|вече|отсега)\\b|вие (?:сега |вече )сте\\b|(?:дръж(?:те)? се|се дръж(?:те)?|действай(?:те)?) като (?:\\w+ )?(?:неограничен|нецензуриран)\\w{0,3}|преструвай(?:те)? се,? че (?:нямаш|нямате) (?:никакви )?(?:правила|ограничения))",
]
system_prompt = [
  "\\b(?:покажи|покажете|разкрий(?:те)?|изведи|изведете|отпечатай(?:те)?|напиши|напишете|изпиши|изпишете|кажи|кажете|дай(?:те)?|издай(?:те)?|сподели|споделете)\\b[^.\\n]{0,40}\\b(?:системн\\w{1,3}(?: си| ти| ви)? (?:промпт\\w{0,3}|инструкци\\w{1,3}|съобщени\\w{1,3}|подкан\\w{1,3})|system prompt|скрит\\w{1,3}(?: си| ти| ви)? инструкци\\w{1,3}|съобщени\\w{1,3} (?:на|от) разработчи\\w{1,4})",
]
memory_directive = [
  "\\b(?:винаги|всеки път|когато и да|щом)\\b[^.\\n]{0,60}\\b(?:изпращай(?:те)?|изпрати|изпратете|пращай(?:те)?|прати|пратете|препращай(?:те)?|препрати|препратете|качвай(?:те)?|качи|качете|прехвърляй(?:те)?|прехвърли|прехвърлете|копирай(?:те)?)\\b[^.\\n]{0,60}\\b(?:на|до|към|във|в)\\b[^.\\n]{0,40}(?:https?://|@|\\bпортфейл\\w{0,2}\\b|\\bwallet\\b)",
]
tool_directive = [
  "\\b(?:изпълни|изпълнете|изпълнявай(?:те)?|пусни|пуснете|стартирай(?:те)?|извикай(?:те)?)\\b[^.\\n]{0,30}\\b(?:команд\\w{1,3}|инструмент\\w{0,3}|функци\\w{1,3}|скрипт\\w{0,3}|tool)\\b[^.\\n]{0,40}(?:rm -rf|curl [^ ]+\\s*\\|\\s*(?:ba)?sh|transfer_funds|delete_all)",
]
