# The Bulgarian language pack. Draft: it passes its test set (languages/tests/bg.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "bg"
name = "Bulgarian"
status = "draft"
text_search = "simple"

[detect]
words = [
  "и", "в", "във", "на", "с", "със", "за", "от", "до", "по", "при", "към", "че", "да", "не", "е",
  "са", "се", "си", "съм", "сме", "сте", "беше", "бяха", "ще", "той", "тя", "то", "те", "ние", "вие",
  "аз", "ти", "този", "тази", "това", "тези", "който", "която", "което", "които", "как", "какво",
  "кой", "коя", "кога", "къде", "защо", "но", "а", "или", "ако", "като", "още", "само", "вече",
  "много", "през", "след", "преди", "между", "има", "няма", "му", "им", "го", "ги", "потребителят",
]
letters = "абвгдежзийклмнопрстуфхцчшщъьюя"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# "може да" (can / may) and the particle "май" (also the month) are left out: too ambiguous.
speculation = [
  "може би",
  "вероятно",
  "най-вероятно",
  "навярно",
  "евентуално",
  "възможно е",
  "има вероятност",
  "би (?:могъл|могла|могло)",
  "биха могли",
  "(?:могъл|могла|могло|могли) би",
  "мисля",
  "предполагам",
  "подозирам",
  "допускам",
  "струва (?:ми|ни) се",
  "чудя се",
  "не съм сигур(?:ен|на)",
  "не сме сигурни",
  "не е сигурно",
  "слух(?:ове|овете)?",
  "говори се",
  "твърди се",
  "уж",
  "изглежда,? че",
  "както изглежда",
  "като че ли",
  "сякаш",
  "хипотетично",
  "теоретично",
  "на теория",
  "обмисля(?:м|ш|ме|те|т)?",
  "мисл(?:я|и|иш|им|ите|ят) да",
  "колебае се",
  "се колебае",
  "чуди се",
  "се чуди",
]
# A change to something stored before.
