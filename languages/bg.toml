  "(?:вече|сега) (?:има|имат|живее|живеят|работи|работят|е|са|използва|използват|предпочита|предпочитат|кара|карат)",
  "(?:има|имат|живее|живеят|работи|работят) (?:вече|сега)",
  "отскоро",
