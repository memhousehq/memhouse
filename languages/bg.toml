# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# "3-ти", "1-ви", "15ч"
number_suffixes = ["-?(?:ви|ри|ти|ми|и|та|то|те)", "ч"]
weekdays = [
  ["понеделник(?:а|ът)?"], ["вторник(?:а|ът)?"], ["сряда(?:та)?"], ["четвъртък(?:а|ът)?"],
  ["петък(?:а|ът)?"], ["събота(?:та)?"], ["неделя(?:та)?"],
]
# "май" is also a particle ("май че", it seems): it is a month only with a preposition, "месец",
# a year or a day.
months = [
  ["януари"], ["февруари"], ["март"], ["април"],
  ["(?:през|от|до|на|за|в|преди|след|към)\\s+май", "май\\s+(?:месец|\\d{4})", "\\d{1,2}(?:-?(?:ви|ри|ти|ми|и))?\\s+май"],
  ["юни"], ["юли"], ["август"], ["септември"], ["октомври"], ["ноември"], ["декември"],
]
month_names = [
  "януари", "февруари", "март", "април", "май", "юни", "юли", "август", "септември", "октомври",
  "ноември", "декември",
]
# "преди две седмици"
ago = ["преди\\s+{num}\\s+{unit}"]
# "през последните три месеца", "миналата седмица"; "преди седмица" (no number) is read as the
# week up to now.
past = [
  "(?:последн|минал|изминал|предишн)(?:ия|ият|ата|ото|ите)\\s+(?:{num}\\s+)?{unit}",
  "преди\\s+{unit}",
]
# "миналия месец" and "миналата година" are the previous calendar month and year.
calendar = ["^(?:минал|предишн)"]
last_weekday = ["(?:(?:минал|изминал|предишн)(?:ия|ият|ата|ото)|тази|този|това|във|в)\\s+{weekday}"]
strictly_before = ["^(?:минал|изминал|предишн)"]
last_weekend = ["(?:минал|изминал|предишн)(?:ия|ият)\\s+уикенд"]
yesterday = ["вчера"]
this = ["(?:тази|този|това|тая|тоя)\\s+{unit}"]
# "през февруари", "на 3 юни", "на 3-ти юни"
in_month = ["(?:{day}(?:-?(?:ви|ри|ти|ми|и))?\\s+)?{month}"]

