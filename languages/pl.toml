# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# "3-go", "1-szy", "2-gi"
number_suffixes = ["-?(?:go|ego|tego|szy|szego|gi|ci|ty|ej|ym|ka|ki|ma)"]
# Nominative, accusative and genitive: "w sobotę", "do soboty".
weekdays = [
  ["poniedział(?:ek|ku)"], ["wtor(?:ek|ku)"], ["środ[aęy]"], ["czwart(?:ek|ku)"], ["piąt(?:ek|ku)"],
  ["sobot[aęy]"], ["niedziel[aęi]"],
]
# Nominative, genitive ("3 czerwca"), locative ("w lutym") and instrumental.
# "maja" is also the name Maja: it is May only after a day or a preposition, or before a year.
months = [
  ["stycz(?:eń|nia|niu|niem)"], ["lut(?:y|ego|ym)"], ["mar(?:zec|ca|cu|cem)"],
  ["kwie(?:cień|tnia|tniu|tniem)"],
  ["maj(?:u|em)?", "(?:\\d{1,2}\\.?|od|do|koniec|końca|końcu|początek|początku|połowie|połowy)\\s+maja", "maja\\s+(?:19|20)\\d{2}"],
  ["czerw(?:iec|ca|cu|cem)"], ["lip(?:iec|ca|cu|cem)"], ["sierp(?:ień|nia|niu|niem)"],
  ["wrze(?:sień|śnia|śniu|śniem)"], ["październik(?:a|u|iem)?"], ["listopad(?:a|zie|em)?"],
  ["grud(?:zień|nia|niu|niem)"],
]
month_names = [
  "styczeń", "stycznia", "styczniu", "luty", "lutego", "lutym", "marzec", "marca", "marcu",
  "kwiecień", "kwietnia", "kwietniu", "maj", "maja", "maju", "czerwiec", "czerwca", "czerwcu",
  "lipiec", "lipca", "lipcu", "sierpień", "sierpnia", "sierpniu", "wrzesień", "września",
  "wrześniu", "październik", "października", "październiku", "listopad", "listopada", "listopadzie",
  "grudzień", "grudnia", "grudniu",
]
# "dwa tygodnie temu", "przed dwoma tygodniami"
ago = ["{num}\\s+{unit}\\s+temu", "przed\\s+{num}\\s+{unit}"]
# "w ciągu ostatniego miesiąca", "w zeszłym tygodniu", "ostatnie trzy miesiące"; "przed tygodniem"
past = [
  "(?:ostatni(?:ch|ego|ej|m|mi|ą|e|a)?|zeszł(?:y|ym|ego|ą|a|ej)|ubiegł(?:y|ym|ego|ą|a|ej)|poprzedni(?:ch|ego|ej|m|ą|e|a)?|minion(?:y|ym|ego|ą|a|ej|ych))\\s+(?:{num}\\s+)?{unit}",
  "przed\\s+{unit}",
]
# "w zeszłym miesiącu" and "w ubiegłym roku" are the previous calendar month and year;
# "w ostatnim miesiącu" is the last thirty days.
calendar = ["^(?:zeszł|ubiegł|poprzedni|minion)"]
last_weekday = ["(?:zeszł(?:y|ą|ego|ej)|ubiegł(?:y|ą|ego|ej)|ostatni(?:ą|ego|ej)?|poprzedni(?:ą|ego|ej)?|minion(?:y|ą|ego|ej)|ten|tę|tą|w|we)\\s+{weekday}"]
strictly_before = ["^(?:zeszł|ubiegł|ostatni|poprzedni|minion)"]
last_weekend = ["(?:zeszł(?:y|ym|ego)|ubiegł(?:y|ym|ego)|ostatni(?:m|ego)?|poprzedni(?:m|ego)?|minion(?:y|ym|ego))\\s+weekend(?:u|zie)?"]
yesterday = ["wczoraj"]
this = ["(?:ten|tym|tego|tej|tę)\\s+{unit}"]
# "w lutym", "3 czerwca"
in_month = ["(?:{day}\\.?\\s+)?{month}"]

