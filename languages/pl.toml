# SPDX-License-Identifier: Apache-2.0
# The Polish language pack. Draft: it passes its test set (languages/tests/pl.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "pl"
name = "Polish"
status = "draft"
# Postgres has no Polish stemmer.
text_search = "simple"

[detect]
words = [
  "i", "w", "we", "z", "ze", "na", "do", "się", "nie", "to", "że", "jest", "są", "był", "była",
  "było", "być", "ma", "mam", "o", "od", "po", "za", "przez", "przy", "dla", "bez", "pod", "nad",
  "jak", "co", "kto", "gdzie", "kiedy", "czy", "ale", "lub", "albo", "oraz", "już", "tylko", "też",
  "także", "bardzo", "ten", "ta", "te", "tego", "tym", "tej", "ja", "ty", "on", "ona", "my", "oni",
  "mój", "moja", "jego", "jej", "ich", "nasz", "który", "która", "które", "tak", "jeszcze",
  "użytkownik",
]
letters = "ąćęłńóśźż"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# Bare "może" is left out: it is also "can / is allowed to" ("może pracować zdalnie").
speculation = [
  "być może",
  "może być",
  "możliwe,? że",
  "niewykluczone",
  "chyba",
  "pewnie",
  "zapewne",
  "prawdopodobnie",
  "przypuszczalnie",
  "podobno",
  "ponoć",
  "rzekomo",
  "najwyraźniej",
  "najwidoczniej",
  "wygląda na to",
  "zdaje się",
  "wydaje (?:mi |nam )?się",
  "myślę",
  "sądzę",
  "przypuszczam",
  "podejrzewam",
  "zgaduję",
  "zastanawia(?:m|my|ją)? się",
  "rozważa(?:m|my|ją)?",
  "nie (?:jestem|jesteśmy) pew(?:ien|ny|na|ni)",
  "nie wiem,? czy",
  "nie wiadomo,? czy",
  "mógłby",
  "mogł(?:a|o|y)by",
  "mogliby",
  "plotk(?:a|i|ę|ach|ami)",
  "pogłosk(?:a|i|ę|ach|ami)",
  "hipotetycznie",
  "teoretycznie",
  "gdyby\\w{0,4}",
]
# A change to something stored before.
correction = [
  "właściwie",
  "tak naprawdę",
  "w rzeczywistości",
  # "poprawka" is also an amendment or an alteration: only as a heading.
  "poprawka[:,]\\s+",
  "korekta",
  "sprostowanie",
  "pomyli(?:łem|łam|ł|ła|liśmy) się",
  "(?:byłem|byłam|byliśmy) w błędzie",
  "już nie",
  "nie \\w+ już",
  "zamiast",
  "zmieni(?:ł(?:[aoy]|em|am)?|li(?:śmy)?)",
  "uległ[aoy]? zmianie",
  "prze(?:szedł|szedłem|szła|szłam|szło|szli|szliśmy|szły) (?:na|do)",
  "przeni(?:ósł|osłem|osła|osłam|osło|eśli|eśliśmy|osły) się",
  "(?:prze|wy)prowadzi(?:ł(?:[aoy]|em|am)?|li(?:śmy)?) się",
  "teraz",
  "obecnie",
  "zaktualizowan(?:y|a|e|o)",
  "zastąpi(?:ony|ona|one|ono|eni|ł|ła|li)",
  "kiedyś",
  "dawniej",
  "niegdyś",
]
# An intention not yet carried out.
plan = [
  "planuj(?:e|ę|ą|emy|ecie|esz)",
  "planowa(?:ł|ła|li|ły|łem|łam|liśmy)",
  "zaplanowa(?:ł|ła|li|ły|łem|łam|liśmy|ny|na|ne|no)",
  "w planach",
  "(?:ma|mam|mamy|mają) w planie",
  "zamierza(?:m|my|ją|sz)?",
  "(?:ma|mam|mamy|mają) zamiar",
  "chc(?:e|ę|ą|emy|ecie|esz)",
  "chciał(?:a|o)?by(?:m)?",
  "chcieliby(?:śmy)?",
  "(?:ma|mam|mamy|mają) nadzieję",
  # The compound future: "będzie pracować", "będzie pracował".
  "będ(?:ę|zie|ziemy|ziecie|ą) (?:\\w+ ){0,2}\\w+(?:ć|ł|ła|li|ły)",
  # The simple future of common perfective verbs (as English "will visit, will start …").
  "zacz(?:nę|nie|niemy|ną)",
  "rozpocz(?:nę|nie|niemy|ną)",
  "pojed(?:ę|zie|ziemy|ą)",
  "polec(?:ę|i|imy|ą)",
  "kupi(?:ę|my|ą)?",
  "odwiedz(?:ę|i|imy|ą)",
  "sprzeda(?:m|my|dzą)?",
  "wyśl(?:ę|e|emy|ą)",
  "podpis(?:zę|ze|zemy|zą)",
  "(?:prze|wy)prowadz(?:ę|i|imy|ą) się",
  "przejd(?:ę|zie|ziemy|ą)",
  "zmieni(?:ę|my|ą)?",
  "wróc(?:ę|i|imy|ą)",
  "dołącz(?:ę|y|ymy|ą)",
  "odejd(?:ę|zie|ziemy|ą)",
  "zadzwoni(?:ę|my|ą)?",
  "zarezerwuj(?:ę|e|emy|ą)",
  "przedłuż(?:ę|y|ymy|ą)",
  "zdecyduj(?:ę|e|emy|ą)",
  "wdroż(?:ę|y|ymy|ą)",
  "przyszł(?:y|ym|ego|ą|a|ej) (?:tydzień|tygodniu|tygodnia|miesiąc|miesiącu|miesiąca|rok|roku|kwartał|kwartale|kwartału|poniedziałek|wtorek|środ[aęy]|czwartek|piątek|sobot[aęy]|niedziel[aęi]|weekend|wiosn[aęy]|lat[oa]|jesień|jesieni|zim[aęy])",
  "jutro",
  "pojutrze",
  "wkrótce",
  "niebawem",
  "niedługo",
  "za (?:\\d+|dwa|dwie|trzy|cztery|pięć|kilka|parę) (?:dni|tygodnie|tygodni|miesiące|miesięcy|lata|lat)",
  "za (?:tydzień|miesiąc|rok)",
  "pamiętaj(?:cie)?,? (?:żeby|aby|by|o)",
  "(?:muszę|musi|musimy|muszą|trzeba) jeszcze",
  "celem jest",
]
preference = [
  "wol(?:i|ę|ą|imy|isz)",
  "wolał(?:a|o)?by(?:m)?",
  "preferuj(?:e|ę|ą|emy)",
  "preferencj(?:a|e|ę|i)",
  "lubi(?:ę|my|ą|sz)?",
  "uwielbia(?:m|my|ją|sz)?",
  "kocha(?:m|my|ją)?",
  "przepada(?:m|my|ją)? za",
  "nienawidz(?:i|ę|ą|imy)",
  "nie znos(?:i|zę|zą|imy)",
  "nie cierpi(?:ę|my|ą)?",
  "ulubion(?:y|a|e|ego|ej|ą|ym|ych|ymi)",
  "najchętniej",
  "chętnie",
  "uczulon[yae] na",
  "alergi[ęai] na",
]
# Only at the start of the statement.
instruction_start = [
  "zawsze", "nigdy", "proszę", "upewnij(?:cie)? się", "unikaj(?:cie)?", "używaj(?:cie)?",
  "użyj(?:cie)?", "stosuj(?:cie)?", "uruchamiaj(?:cie)?", "uruchom(?:cie)?", "sprawdzaj(?:cie)?",
  "sprawdź(?:cie)?", "zadbaj(?:cie)?", "nie \\w+(?:aj|uj|ij|yj|ej)(?:cie)?",
  "nie (?:pisz|rób|mów|bierz|twórz|usuń|zmień)(?:cie)?", "nie wolno",
]
instruction = [
  "(?:powin(?:ien|na|no|ni|ny)|musi|muszą|musisz|należy|trzeba) (?:zawsze|nigdy)",
  "(?:zawsze|nigdy nie) (?:powin(?:ien|na|no|ni|ny)|musi|muszą|musisz|należy|trzeba|może|mogą|wolno)",
  "pod żadnym pozorem",
]
# Past events: a dated reference or a completed action. Past-tense forms by gender and number.
event = [
  "wczoraj",
  "przedwczoraj",
  "(?:zeszł|ubiegł|ostatni|poprzedni)\\w{0,3} (?:tydzień|tygodniu|tygodnia|miesiąc|miesiącu|miesiąca|rok|roku|noc|nocy|weekend|weekendu|poniedziałek|wtorek|środę|czwartek|piątek|sobotę|niedzielę|wiosny|wiosnę|lata|jesieni|zimy|zimę)",
  # Bare "temu" is left out: it is also the dative of "ten" ("dzięki temu").
  "(?:\\d+|dwa|dwie|trzy|cztery|pięć|sześć|kilka|parę|kilkanaście) (?:dni|tygodnie|tygodni|miesiące|miesięcy|lata|lat) temu",
  "(?:dzień|tydzień|miesiąc|rok|jakiś czas|dawno|niedawno) temu",
  "(?:kupi|sprzeda|odwiedzi|pojecha|wyjecha|przyjecha|polecia|adoptowa|zaadoptowa|skończy|ukończy|zakończy|podpisa|dołączy|opuści|spotka|pozna|uczestniczy|otrzyma|dosta|wyda|wdroży|wypuści|wysła|przedłuży|odnowi|anulowa|odwoła|zapłaci|opłaci|zarezerwowa|zamówi|zwróci|wróci|podróżowa|wygra|przegra|zgubi|straci|zrobi|urodzi|świętowa|obchodzi|zatrudni|zwolni|naby|zda|obroni|ożeni|uruchomi|wprowadzi|zainstalowa|odebra)(?:ł(?:[aoy]|em|am|yśmy)?|li(?:śmy)?)",
  "polecieli",
  "poszedł(?:em)?",
  "posz(?:ła|łam|li|liśmy|ły)",
  "odszedł(?:em)?",
  "odesz(?:ła|łam|li|liśmy|ły)",
  "(?:zacz|rozpocz|wzi|przygarn)(?:ął|ąłem|ęła|ęłam|ęli|ęliśmy|ęły)",
  "zmar(?:ł|ła|li)",
  "wyszła za mąż",
  "pobrali się",
]

[relations]
relationship = [
