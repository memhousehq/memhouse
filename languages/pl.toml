[query]
or = ["czy", "albo", "lub"]
or_not = ["czy nie", "albo nie", "lub nie"]
between = ["(?:po)?między\\s+(.+?)\\s+a\\s+(.+?)"]
clause = ["kiedy", "gdy", "zanim", "po tym,? jak", "odkąd", "podczas gdy", "dopóki"]
lead = [
  "któr(?:y|a|e|ego|ej|ą|ym|ych|ymi)", "jak(?:i|a|ie|iego|iej|ą|im|ich)", "co", "czego", "czym",
  "kto", "kogo", "komu", "kim", "czyj(?:a|e)?", "kiedy", "gdzie", "dokąd", "skąd",
  "ile\\s+(?:\\w+)?", "jak\\s+(?:długo|często|dużo|wiele|stary|stara)?",
  "czy", "był(?:em|am|a|o)?", "jest", "są", "miał(?:em|am|a)?",
]
article = [
  "ten", "ta", "to", "te", "tego", "tej", "tę", "mój", "moja", "moje", "mojego", "moją", "nasz",
  "nasza", "nasze", "tamten", "tamta", "tamte",
]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  "\\b(?:z?ignoruj(?:cie)?|z?ignorować|pomiń(?:cie)?|pominąć|zapomnij(?:cie)?|zapomnieć|odrzuć(?:cie)?|zlekceważ(?:cie)?|nie zważaj(?:cie)?|nie przestrzegaj(?:cie)?)\\b[^.\\n]{0,40}\\b(?:poprzedni\\w*|wcześniejsz\\w+|dotychczasow\\w+|powyższ\\w+|wszystki\\w+|wszelki\\w+|sw(?:oj|oi)\\w+|tw(?:oj|oi)\\w+|wasz\\w+)\\b[^.\\n]{0,25}\\b(?:instrukcj\\w+|polece\\w+|zasad\\w*|reguł\\w*|wytyczn\\w+|nakaz\\w*|prompt\\w*)",
]
role_hijack = [
  "\\b(?:jesteś teraz|teraz jesteś|(?:od teraz|odtąd|od tej chwili|od tej pory|od dziś),? (?:jesteś|będziesz|masz|musisz|odpowiadasz|odpowiadaj)|jest pan(?:i)? teraz|zachowuj(?:cie)? się jak (?:\\w+ ){0,2}(?:nieograniczon\\w+|niecenzurowan\\w+|bez (?:\\w+ )?(?:ograniczeń|zasad|reguł))|działaj jako (?:\\w+ ){0,2}(?:nieograniczon\\w+|niecenzurowan\\w+|bez (?:\\w+ )?(?:ograniczeń|zasad|reguł))|udawaj(?:cie)?,? że nie masz (?:żadnych )?(?:zasad|reguł|ograniczeń))",
]
system_prompt = [
  "\\b(?:pokaż(?:cie)?|pokazać|ujawnij(?:cie)?|ujawnić|wyświetl(?:cie)?|wyświetlić|wypisz(?:cie)?|wypisać|wydrukuj(?:cie)?|podaj(?:cie)?|podać|zdradź(?:cie)?|zdradzić)\\b[^.\\n]{0,40}\\b(?:prompt\\w* systemow\\w+|systemow\\w+ prompt\\w*|instrukcj\\w+ systemow\\w+|polece\\w+ systemow\\w+|ukryt\\w+ instrukcj\\w+|wiadomoś\\w+ (?:od )?(?:dewelopera|programisty))",
]
memory_directive = [
  "\\b(?:zawsze|za każdym razem|ilekroć|kiedy tylko|gdy tylko)\\b[^.\\n]{0,60}\\b(?:wyślij|wysyłaj|prześlij|przesyłaj|przekaż|przekazuj|wgraj|wgrywaj|przelej|przelewaj|udostępnij|udostępniaj)(?:cie)?\\b[^.\\n]{0,60}\\b(?:na|do|pod)\\b[^.\\n]{0,40}(?:https?://|@|\\bportfel\\w*\\b|\\bwallet\\b)",
]
tool_directive = [
  "\\b(?:uruchom(?:cie)?|uruchomić|wykonaj(?:cie)?|wykonać|wywołaj(?:cie)?|wywołać|odpal(?:cie)?)\\b[^.\\n]{0,30}\\b(?:polecenie|komend[ęay]|narzędzi[ea]|funkcj[ęai])\\b[^.\\n]{0,40}(?:rm -rf|curl [^ ]+\\s*\\|\\s*(?:ba)?sh|transfer_funds|delete_all)",
]
