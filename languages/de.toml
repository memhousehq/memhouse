[relations]
relationship = [
  "\\b(?:ist|war|sind|waren|wurde) (?:jetzt |nun )?(?:der |die |das |ein |eine |ihr |ihre |sein |seine |unser |unsere |mein |meine )?(?:neue[rs]? )?(?:manager(?:in)?|chef(?:in)?|vorgesetzte[rn]?|kolleg(?:e|in)|ehefrau|frau|ehemann|mann|partner(?:in)?|freund(?:in)?|bruder|schwester|mutter|vater|sohn|tochter|cousin|cousine|onkel|tante|nachbar(?:in)?|mentor(?:in)?|kund(?:e|in)|lieferant|eigentümer(?:in)?|gründer(?:in)?|geschäftsführer(?:in)?|ansprechpartner(?:in)?|sponsor) (?:von|für|bei|des|der)\\b",
  "\\b(?:berichtet an|arbeitet für|arbeitet mit|verheiratet mit|verlobt mit|ist verwandt mit|wird geleitet von)\\b",
]
people = [
  "schwester", "bruder", "mutter", "mama", "vater", "papa", "eltern", "frau", "ehefrau", "mann",
  "ehemann", "partner", "partnerin", "sohn", "tochter", "kind", "kinder", "freund", "freundin",
