"zwölf" = 12

[time.units]
day = ["tag(?:e|en|es)?"]
week = ["wochen?"]
month = ["monat(?:e|en|s)?"]
year = ["jahr(?:e|en|es)?"]

# The words that split a question about several things into sub-queries.
[query]
or = ["oder"]
or_not = ["oder nicht"]
between = ["zwischen\\s+(.+?)\\s+und\\s+(.+?)"]
clause = ["als", "bevor", "nachdem", "seit", "seitdem", "während", "bis"]
lead = [
  "welche[rsmn]?", "was", "wer", "wen", "wem", "wessen", "wann", "wo", "wohin", "woher",
  "wie\\s+(?:viele?\\s+\\w+|lange|alt|oft|viel)?",
  "hat", "habe", "haben", "hatte", "hatten", "war", "waren", "ist", "sind", "bin", "wurde",
]
article = [
  "der", "die", "das", "den", "dem", "ein", "eine", "einen", "einem", "einer", "mein", "meine",
  "meinen", "meinem", "meiner", "unser", "unsere", "jene[rsmn]?", "diese[rsmn]?",
]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  "\\b(?:ignorier(?:e|en|t)?|missachte[nt]?|vergiss|vergessen sie|vergesst|übergeh(?:e|en)?|überschreib(?:e|en)?)\\b[^.\\n]{0,40}\\b(?:vorherigen?|vorigen?|früheren?|bisherigen?|obigen?|alle[nr]?|sämtliche[nr]?|deine[nr]?|ihre[nr]?|eure[nr]?)\\b[^.\\n]{0,25}\\b(?:anweisung(?:en)?|instruktion(?:en)?|befehle?n?|regeln?|richtlinien?|vorgaben?|prompts?)",
]
role_hijack = [
  "\\b(?:du bist (?:jetzt|nun|ab sofort)|sie sind (?:jetzt|nun|ab sofort)|ab (?:jetzt|sofort),? (?:bist|wirst|musst|sollst|antwortest) du|von nun an (?:bist|wirst|musst|sollst|antwortest) du|verhalte dich wie (?:eine? )?(?:uneingeschränkte[rs]?|unzensierte[rs]?)|handle als (?:eine? )?(?:uneingeschränkte[rs]?|unzensierte[rs]?)|tu so,? als hättest du keine (?:regeln|einschränkungen|beschränkungen))",
]
system_prompt = [
  "\\b(?:zeig(?:e|en)?|verrat(?:e|en)?|gib|geben sie|drucke|nenne|offenbare|enthülle)\\b[^.\\n]{0,40}\\b(?:system-?prompt|systemanweisung(?:en)?|versteckten? anweisungen|entwickler-?nachricht)",
]
memory_directive = [
  "\\b(?:immer|jedes ?mal|wann immer|sobald)\\b[^.\\n]{0,60}\\b(?:send(?:e|en|est)|schick(?:e|en|st)|weiterleite[nt]?|leite[nt]?|mail(?:e|en)?|lade[nt]?|übertrag(?:e|en)?|übermittel[nt]?)\\b[^.\\n]{0,60}\\b(?:an|zu|nach|auf)\\b[^.\\n]{0,40}(?:https?://|@|\\bwallet\\b)",
]
tool_directive = [
  "\\b(?:führ(?:e|en)?|starte[nt]?|ruf(?:e|en)?)\\b[^.\\n]{0,30}\\b(?:befehl|kommando|tool|werkzeug|funktion)\\b[^.\\n]{0,40}(?:rm -rf|curl [^ ]+\\s*\\|\\s*(?:ba)?sh|transfer_funds|delete_all)",
]
