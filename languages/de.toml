# The German language pack. Draft: it passes its test set (languages/tests/de.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "de"
name = "German"
status = "draft"
text_search = "german"

[detect]
words = [
  "der", "die", "das", "und", "ist", "nicht", "ein", "eine", "einen", "dem", "den", "des", "mit",
  "auf", "für", "von", "zu", "im", "sich", "auch", "es", "ich", "er", "sie", "wir", "ihr", "hat",
  "haben", "war", "wird", "sind", "bei", "nach", "aus", "wie", "was", "wer", "wo", "wann", "oder",
  "aber", "wenn", "als", "noch", "nur", "schon", "sehr", "mein", "meine", "sein", "seine", "unser",
  "zum", "zur", "über", "am", "um", "dass", "kann", "wurde", "jetzt", "nutzer", "in", "an", "vom",
  "ihre", "diese", "dieser", "einer", "einem", "bin",
]
letters = "äöüß"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
speculation = [
  "vielleicht",
  "möglicherweise",
  "eventuell",
  "womöglich",
  "wahrscheinlich",
  "vermutlich",
  "voraussichtlich",
  "könnte[nt]?",
  "dürfte[nt]?",
  "ich glaube",
  "ich denke",
  "ich vermute",
  "ich schätze",
  "ich frage mich",
  "nicht sicher",
  "unsicher,? ob",
  "gerüchte?n?",
  "gerüchteweise",
  "angeblich",
  "anscheinend",
  "offenbar",
  "scheinbar",
  "hypothetisch",
  "theoretisch",
  "überlegt",
  "überlegen",
  "denkt darüber nach",
  "denken darüber nach",
  "spielt mit dem gedanken",
  "wenn (?:wir|ich|sie|er|du) (?:\\w+ ){0,6}(?:würde[nt]?|hätte[nt]?|könnte[nt]?|wäre[nt]?)",
]
# A change to something stored before.
correction = [
  "eigentlich",
  "korrektur",
  "berichtigung",
  "ich habe mich geirrt",
  "habe mich geirrt",
  "stimmt nicht mehr",
  "nicht mehr",
  "kein(?:e|en|em|er)? \\w+ mehr",
  "statt",
  "stattdessen",
  "anstatt",
  "anstelle",
  "hat sich geändert",
  "haben sich geändert",
  "geändert",
  "gewechselt",
  "wechselte",
  "umgezogen",
  "weggezogen",
  "ausgezogen",
  "zog (?:nach|um|weg|aus)",
  "jetzt",
  "inzwischen",
  "mittlerweile",
  "nunmehr",
  "aktualisiert",
  "ersetzt durch",
  "ersetzt (?:worden|wurde)",
  "früher",
]
# An intention not yet carried out.
plan = [
  "plant",
  "plane",
  "planen",
  "geplant",
  "hat vor",
  "haben vor",
  "habe vor",
  "vorhaben",
  "beabsichtigt",
