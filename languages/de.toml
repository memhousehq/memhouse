  "bevorzugt",
  "bevorzugen",
  "bevorzuge",
  "zieht (?:\\w+ ){1,6}vor",
  "präferenz",
  "vorliebe",
  "mag",
  "mögen",
  "liebt",
  "lieben",
  "liebe",
  "genießt",
  "genießen",
  "hasst",
  "hassen",
  "hasse",
  "lieblings\\w+",
  "am liebsten",
  "lieber",
  "gerne?",
  "nicht (?:leiden|ausstehen)",
  "allergisch (?:gegen|auf)",
]
# Only at the start of the statement.
instruction_start = [
  "immer", "nie", "niemals", "bitte", "stelle? sicher", "achte darauf", "vermeide", "verwende",
  "benutze", "nutze", "führe", "keine?",
]
instruction = ["sollten? immer", "muss immer", "müssen immer", "sollten? nie(?:mals)?", "darf nie(?:mals)?", "dürfen nie(?:mals)?"]
