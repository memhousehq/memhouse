  "sind", "inzwischen", "mittlerweile", "korrektur",
]
value_stop = [
  "der", "die", "das", "den", "dem", "des", "ein", "eine", "einen", "einem", "einer", "nutzer",
  "benutzer", "ihr", "ihre", "sie", "er", "es", "dies", "diese", "mit", "von", "vom", "hat", "haben",
