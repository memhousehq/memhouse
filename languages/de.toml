# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
number_suffixes = ["er", "ern", "te[nrs]?"]
weekdays = [["montag"], ["dienstag"], ["mittwoch"], ["donnerstag"], ["freitag"], ["samstag", "sonnabend"], ["sonntag"]]
months = [
  ["januar", "jänner"], ["februar"], ["märz"], ["april"], ["mai"], ["juni"], ["juli"], ["august"],
  ["september"], ["oktober"], ["november"], ["dezember"],
]
month_names = [
  "januar", "jänner", "februar", "märz", "april", "mai", "juni", "juli", "august", "september",
  "oktober", "november", "dezember",
]
# "vor zwei Wochen"
ago = ["vor\\s+{num}\\s+{unit}"]
# "in den letzten drei Monaten", "letzte Woche"
past = ["(?:letzte[nrsm]?|vergangene[nrsm]?|vorige[nrsm]?)\\s+(?:{num}\\s+)?{unit}"]
# "letzten Monat" and "letztes Jahr" are the previous calendar month and year.
calendar = ["^(?:letzte|vergangene|vorige)"]
last_weekday = ["(?:letzte[nrsm]?|vergangene[nrsm]?|diese[nrsm]?|am)\\s+{weekday}"]
strictly_before = ["^(?:letzte|vergangene)"]
last_weekend = ["(?:letzte[ns]?|vergangene[ns]?)\\s+wochenende"]
yesterday = ["gestern"]
this = ["diese[rsmn]?\\s+{unit}"]
# "im Februar", "am 3. Juni"
in_month = ["(?:{day}\\.\\s*)?{month}"]

[time.numbers]
ein = 1
eine = 1
einem = 1
einer = 1
einen = 1
zwei = 2
"ein paar" = 3
drei = 3
einigen = 3
einige = 3
mehreren = 3
