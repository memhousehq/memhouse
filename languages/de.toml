  "die absicht",
  "möchte[nt]?",
  "will",
  "wollen",
  "würde[nt]? gerne?",
  "hofft",
  "hoffen",
  "hoffe",
  "werde",
  "werden wir",
  "wird (?:\\w+ ){0,6}(?:besuchen|beginnen|anfangen|umziehen|reisen|fahren|fliegen|gehen|kaufen|unterschreiben|starten|liefern|beitreten|verlassen|anrufen|senden|schicken|treffen|teilnehmen|versuchen|nehmen|holen|buchen|verlängern|kündigen|wechseln|aktualisieren|prüfen|entscheiden|beenden|abschließen|ziehen)",
  "nächste[nrsm]? (?:woche|monat|jahr|quartal|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonnabend|sonntag|wochenende|frühjahr|frühling|sommer|herbst|winter)",
  "kommende[nrsm]? (?:woche|monat|jahr|quartal|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|wochenende)",
  "übermorgen",
