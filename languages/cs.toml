# Singular, the form after 2–4 ("dva týdny"), the form after 5+ ("pět týdnů") and the oblique
# cases ("před týdnem", "před dvěma týdny").
[time.units]
day = ["den", "dn(?:e|i|y|ů|í|em|ech)"]
week = ["týden", "týdn(?:e|u|y|ů|em|ech)"]
month = ["měsíc(?:e|i|ů|em|ích)?"]
year = ["rok(?:u|y|ů|em)?", "roce", "let(?:y|ech)?", "léta"]

