# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# "5krát", "3tí"
number_suffixes = ["-?(?:krát|ho|mu|tí|tý|té|ti)"]
# Nominative, accusative ("v sobotu") and genitive ("do soboty").
weekdays = [
  ["pondělí"], ["úterý"], ["střed[auy]"], ["čtvrt(?:ek|ka|ku)"], ["pát(?:ek|ku)"], ["sobot[auy]"],
  ["neděl[ei]"],
]
# Nominative, genitive ("3. června"), locative ("v únoru") and instrumental.
months = [
  ["leden", "ledn(?:a|u|em)"], ["únor(?:a|u|em)?"], ["březen", "březn(?:a|u|em)"],
  ["duben", "dubn(?:a|u|em)"], ["květen", "květn(?:a|u|em)"], ["červen", "červn(?:a|u|em)"],
  ["červen(?:ec|ce|ci|cem)"], ["srpen", "srpn(?:a|u|em)"], ["září"], ["říjen", "říjn(?:a|u|em)"],
  ["listopad(?:u|em)?"], ["prosin(?:ec|ce|ci|cem)"],
]
month_names = [
  "leden", "ledna", "lednu", "únor", "února", "únoru", "březen", "března", "březnu", "duben",
  "dubna", "dubnu", "květen", "května", "květnu", "červen", "června", "červnu", "červenec",
