  "před (?:týdnem|měsícem|rokem)",
  "(?:koupi|proda|navštívi|adoptova|pořídi|dokonči|skonči|ukonči|absolvova|vystudova|podepsa|připoji|opusti|potka|setka|zúčastni|oženi|vda|dosta|obdrže|získa|vyda|spusti|nasadi|odesla|posla|prodlouži|obnovi|zruši|zaplati|zarezervova|objedna|vráti|cestova|vyhrá|prohrá|ztrati|uděla|narodi|zemře|oslavi|zaměstna|propusti|aktualizova|upgradova|přije|odje|letě|zača|zaháji|založi|přija|naja)l[aoiy]?",
  "šel",
