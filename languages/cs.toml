  "listopadu", "prosinec", "prosince", "prosinci",
]
# "před dvěma týdny"
ago = ["před\\s+{num}\\s+{unit}"]
# "za poslední měsíc", "minulý týden", "během posledních tří měsíců"; "před týdnem"
past = [
  "(?:posledn(?:í|ího|ím|ích|ími)|minul(?:ý|ého|ém|ou|á|é|ých)|uplynul(?:ý|ého|ém|ou|á|é|ých)|předchoz(?:í|ího|ím|ích)|loňsk(?:ý|ého|ém))\\s+(?:{num}\\s+)?{unit}",
  "před\\s+{unit}",
]
# "minulý měsíc" and "minulý rok" are the previous calendar month and year; "poslední měsíc" is
