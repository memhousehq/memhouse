# SPDX-License-Identifier: Apache-2.0
# The Czech language pack. Draft: it passes its test set (languages/tests/cs.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "cs"
name = "Czech"
status = "draft"
# Postgres has no Czech stemmer.
text_search = "simple"

# Czech and Slovak share much of their vocabulary. The words that tell Czech from Slovak are
# listed too ("jsem", "jsou", "nebo", "když", "který", "při", "před", "teď", "uživatel"), and so
# are the letters ě, ř and ů, which Slovak does not have.
[detect]
words = [
  "a", "i", "v", "ve", "z", "ze", "s", "se", "k", "ke", "o", "u", "na", "do", "od", "po", "za",
  "pro", "při", "před", "mezi", "podle", "je", "jsem", "jsi", "jsme", "jste", "jsou", "byl", "byla",
  "bylo", "být", "není", "má", "mám", "si", "že", "ale", "nebo", "když", "jako", "jak", "co", "kdo",
  "kde", "kdy", "proč", "který", "která", "které", "ten", "ta", "to", "tento", "už", "jen", "ještě",
  "také", "velmi", "teď", "můj", "její", "jejich", "náš", "aby", "by", "bude", "uživatel",
]
letters = "áčďéěíňóřšťúůýž"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# "asi" and "třeba" are left out: they are also "about" ("asi 5 km") and "for example / needed".
speculation = [
  "možná",
  "možné,? že",
  "snad",
  "nejspíš(?:e)?",
  "pravděpodobně",
  "zřejmě",
  "patrně",
  "údajně",
  "prý",
  "podle všeho",
  "vypadá to",
  "zdá se",
  "myslím",
  "domnívám se",
  "tuším",
  "hádám",
  "předpokládám",
  "tipuji",
  "nejsem si jist(?:ý|á)?",
  "nevím,? (?:jestli|zda)",
  "není jisté",
  "mohl[aoiy]? by",
  "kdyby\\w{0,4}",
  "fám(?:a|y|u|ě|ou)",
  "zvěsti",
  "povídá se",
  "říká se",
  "hypoteticky",
  "teoreticky",
  "uvažuj(?:e|i|u|eme|í|ete)",
  "zvažuj(?:e|i|u|eme|í|ete)",
  "přemýšlí(?:m|me)? o",
]
# A change to something stored before.
correction = [
  "vlastně",
  "ve skutečnosti",
  # "oprava" is also a repair: only as a heading.
  "oprava[:,]\\s+",
  "korekce[:,]\\s+",
  "upřesnění",
  "spletl[ai]? (?:jsem|jsme) se",
  "mýlil[ai]? (?:jsem|jsme) se",
  # "už nepracuje": the verb is negated by its prefix.
  "(?:už|již) ne",
  "(?:už|již) není",
  "(?:už|již) (?:se |si )?ne\\w{3,}",
  "místo toho",
  "namísto",
  "změnil[aoiy]?",
  "změnil[aoiy]? se",
  "přeš(?:el|la|lo|li|ly) (?:na|do|k|ke)",
  "(?:pře|od|vy)stěhoval[aoiy]? se",
  "(?:pře|od|vy)stěhoval[aoiy]?",
  "teď",
  "nyní",
  "mezitím",
  "aktualizován[aoy]?",
  "nahrazen[aoy]?",
  "dříve?",
  "kdysi",
  "původně",
]
# An intention not yet carried out.
plan = [
  "plánuj(?:e|i|u|eme|í|ete|eš)",
  "plánoval[aoiy]?",
  "naplánoval[aoiy]?",
  "naplánován[aoy]?",
  "v plánu",
  "hodl(?:á|ám|áme|ají|áš)",
  "(?:má|mám|máme|mají) v úmyslu",
  "zamýšlí(?:m|me)?",
  "chyst(?:á|ám|áme|ají) se",
  "se chyst(?:á|ám|áme|ají)",
  "chc(?:e|i|u|eme|ete|ou|eš)",
  "chtěl[aoiy]? by(?:ch|chom)?",
  "rád[ai]? by(?:ch|chom)?",
  "doufá(?:m|me)?",
  "doufají",
  # The compound future: "bude pracovat".
  "bud(?:u|e|eme|ete|ou|eš) (?:\\w+ ){0,2}\\w+[aeěiíáýuo]t",
  # The simple future of common perfective verbs (as English "will visit, will start …").
  "(?:nastoupí|začn(?:e|u|eme|ou)|pojed(?:e|u|eme|ou)|polet(?:í|ím|íme)|koupí(?:m|me)?|navštíví(?:m|me)?|prodá(?:m|me)?|prodají|pošl(?:e|u|eme|ou)|podepíš(?:e|u|eme|ou)|(?:pře|od)stěhuj(?:e|i|u|eme|í) se|se (?:pře|od)stěhuj(?:e|i|u|eme|í)|přejd(?:e|u|eme|ou)|vrátí(?:m|me)? se|zavolá(?:m|me)?|zarezervuj(?:e|i|u|eme|í)|prodlouží(?:m|me)?|rozhodn(?:e|u|eme|ou) se|nasadí(?:m|me)?)",
  "příští(?:ho|m)? (?:týden|týdnu|týdne|měsíc|měsíci|měsíce|rok|roce|roku|čtvrtletí|pondělí|úterý|středu|čtvrtek|pátek|sobotu|neděli|víkend|víkendu|jaro|jaře|léto|létě|podzim|zimu|zimě)",
  "napřesrok",
  "zítra",
  "pozítří",
  # "brzy" alone is also "early" ("vstává brzy").
  "(?:už|již|velmi|co nej) ?brzy",
  "zanedlouho",
  "za (?:\\d+|dva|dvě|tři|čtyři|pět|několik|pár) (?:dny|dní|dnů|týdny|týdnů|měsíce|měsíců|roky|roků|let)",
  "za (?:týden|měsíc|rok)",
  "nezapomeň(?:te)?",
  "(?:musí|musím|musíme) ještě",
  "ještě (?:musí|musím|musíme)",
  "cílem je",
]
preference = [
  "dáv(?:á|ám|áme|ají) přednost",
  "preferuj(?:e|i|u|eme|í)",
  "upřednostňuj(?:e|i|u|eme|í)",
  "preferenc(?:e|i|í)",
  "miluj(?:e|i|u|eme|í)",
  "zbožňuj(?:e|i|u|eme|í)",
  "nesnáší(?:m|me)?",
  "nenávidí(?:m|me)?",
  "(?:nej)?oblíben(?:ý|á|é|ého|ou|ém|ým|ých|ými|í|ější|ějším|ějšího)",
  "rád",
  "ráda",
  "rádi",
  "rády",
  "nerad[aiy]?",
  "raději",
  "radši",
  "nejraději",
  "nejradši",
  "líbí se",
  "se líbí",
  "chutná",
  "nemůž(?:e|u|eme|ou) (?:vystát|snést|ani cítit)",
  "nemá(?:m|me)? v lásce",
  "alergick(?:ý|á|é|ou|ého) na",
  "alergi(?:e|i|í) na",
]
# Only at the start of the statement.
instruction_start = [
  "vždy", "vždycky", "nikdy", "prosím", "ujisti se", "ujistěte se", "dbej(?:te)?",
  "dej(?:te)? pozor", "dávej(?:te)? pozor", "vyhni(?:te)? se", "vyvaruj(?:te)? se",
  "používej(?:te)?", "použij(?:te)?", "spouštěj(?:te)?", "spusť(?:te)?", "zkontroluj(?:te)?",
  "ověř(?:te)?", "ne\\w{2,}(?:ej|uj|aj|ěj)(?:te)?", "nesmí(?:š|te)?", "je (?:nutné|třeba|potřeba)",
]
instruction = [
  "by měl[aoiy]? (?:vždy|vždycky|nikdy)",
  "(?:musí|musíš|musíte|je třeba|je nutné) (?:vždy|vždycky)",
  "(?:vždy|vždycky) (?:musí|musíš|musíte|je třeba|je nutné)",
  "nesmí(?:š|te)? nikdy",
  "nikdy nesmí(?:š|te)?",
  "za žádných okolností",
]
# Past events: a dated reference or a completed action. Past participles by gender and number.
event = [
  "včera",
  "předevčírem",
  "loni",
  "vloni",
  "(?:minul|loňsk|předchoz)\\w{1,3} (?:týden|týdnu|týdne|měsíc|měsíci|měsíce|rok|roce|roku|noc|noci|víkend|víkendu|pondělí|úterý|středu|čtvrtek|pátek|sobotu|neděli|jaro|jaře|léto|létě|podzim|zimu|zimě)",
