# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# "5-krat", "3-ega"
number_suffixes = ["-?(?:krat|ega|emu|im|ih|i|a)"]
# Nominative, accusative ("v soboto") and genitive ("do sobote").
weekdays = [
  ["ponedelj(?:ek|ka|ku)"], ["tor(?:ek|ka|ku)"], ["sred[aoe]"], ["četrt(?:ek|ka|ku)"],
  ["pet(?:ek|ka|ku)"], ["sobot[aoe]"], ["nedelj[aoe]"],
]
# Nominative, genitive ("3. junija", and alone as "in June": "junija"), locative ("v juniju").
# "maja" and "julija" are also the names Maja and Julija: they are months only after a day or a
# preposition, or before a year.
months = [
  ["januar(?:ja|ju|jem)?"], ["februar(?:ja|ju|jem)?"], ["marec", "marc(?:a|u|em)"],
  ["april(?:a|u|om)?"],
  ["maj(?:u|em)?", "(?:\\d{1,2}\\.|od|do|meseca|konec|koncu|začetek|začetku|sredi|lani|letos)\\s*maja", "maja\\s+(?:19|20)\\d{2}"],
  ["junij(?:a|u|em)?"],
  ["julij(?:u|em)?", "(?:\\d{1,2}\\.|od|do|meseca|konec|koncu|začetek|začetku|sredi|lani|letos)\\s*julija", "julija\\s+(?:19|20)\\d{2}"],
  ["avgust(?:a|u|om)?"], ["september", "septembr(?:a|u|om)"], ["oktober", "oktobr(?:a|u|om)"],
  ["november", "novembr(?:a|u|om)"], ["december", "decembr(?:a|u|om)"],
]
month_names = [
  "januar", "januarja", "januarju", "februar", "februarja", "februarju", "marec", "marca", "marcu",
  "april", "aprila", "aprilu", "maj", "maja", "maju", "junij", "junija", "juniju", "julij",
  "julija", "juliju", "avgust", "avgusta", "avgustu", "september", "septembra", "septembru",
  "oktober", "oktobra", "oktobru", "november", "novembra", "novembru", "december", "decembra",
  "decembru",
]
# "pred dvema tednoma", "pred tremi meseci"
ago = ["pred\\s+{num}\\s+{unit}"]
# "v zadnjem mesecu", "prejšnji teden", "v zadnjih treh mesecih"; "pred tednom"
past = [
  "(?:zadnj(?:i|e|o|a|ega|em|ih|im|imi)|prejšnj(?:i|e|o|a|ega|em|ih)|pretekl(?:i|e|o|a|ega|em|ih)|minul(?:i|e|o|a|ega|em|ih)|lansk(?:i|o|ega|em))\\s+(?:{num}\\s+)?{unit}",
  "pred\\s+{unit}",
]
# "prejšnji mesec" and "prejšnje leto" are the previous calendar month and year; "zadnji mesec"
# is the last thirty days.
calendar = ["^(?:prejšnj|pretekl|minul|lansk)"]
last_weekday = ["(?:prejšnj(?:i|o|e|ega)|pretekl(?:i|o|e|ega)|zadnj(?:i|o|e|ega)|minul(?:i|o|e|ega)|ta|to|v)\\s+{weekday}"]
strictly_before = ["^(?:prejšnj|pretekl|zadnj|minul)"]
last_weekend = ["(?:prejšnj(?:i|em|ega)|pretekl(?:i|em|ega)|zadnj(?:i|em|ega)|minul(?:i|em|ega))\\s+(?:vikend(?:u|a)?|konec\\s+tedna|koncu\\s+tedna)"]
yesterday = ["včeraj"]
this = ["(?:ta|to|tem|tega)\\s+{unit}"]
# "februarja", "v juniju", "3. junija"
in_month = ["(?:{day}\\.\\s*)?{month}"]

