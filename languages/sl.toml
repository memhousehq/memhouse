  "pojutrišnjem",
  "kmalu",
  "v kratkem",
  "čez (?:\\d+|dva|dve|tri|štiri|pet|nekaj|par) (?:dni|dneva|tedna|tedne|tednov|meseca|mesece|mesecev|leti|leta|let)",
  "čez (?:en )?(?:teden|mesec)",
  "čez (?:eno )?leto",
  "ne pozabi(?:te)?",
  "(?:mora|moram|moramo|morajo|treba je) še",
  "cilj je",
]
preference = [
  "raje",
  "rajši",
  "najraje",
  "najrajši",
  "daj(?:e|em|emo|ejo) prednost",
  "preferenc(?:a|e|o|i)",
