  "ne more(?:m|mo|jo)? (?:prenašati|trpeti)",
  "najljubš(?:i|a|e|o|ega|em|ih|im)",
  "priljubljen(?:a|o|i|e|ega|em)?",
  "všeč",
  "uživa(?:m|mo|jo)? v",
  "alergič(?:en|na|no|ni) na",
  "alergij(?:a|o|e|i) na",
