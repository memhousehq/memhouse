# Only at the start of the statement.
instruction_start = [
  "vedno", "zmeraj", "vselej", "nikoli", "nikdar", "prosim", "prepričaj(?:te)? se",
  "poskrbi(?:te)?", "pazi(?:te)?", "izogibaj(?:te)? se", "uporabljaj(?:te)?", "uporabi(?:te)?",
  "zaženi(?:te)?", "preveri(?:te)?", "ne \\w{3,}(?:aj|uj|ej)(?:te)?", "ne sme(?:š|te)?",
  "treba je",
]
instruction = [
  "(?:mora|morajo|moraš|morate|naj|je treba|treba je) (?:vedno|zmeraj|vselej)",
  "(?:vedno|zmeraj|vselej) (?:mora|morajo|moraš|morate|je treba)",
  "nikoli ne sme(?:jo|š|te)?",
  "ne sme(?:jo|š|te)? nikoli",
  "pod nobenim pogojem",
]
# Past events: a dated reference or a completed action. Participles by gender and number
# (singular, dual, plural); the future, with the same participle, is read as a plan first.
event = [
  "včeraj",
  "predvčerajšnjim",
  "lani",
  "(?:prejšnj|pretekl|minul|lansk|zadnj)(?:i|e|o|a|ega|em) (?:teden|tednu|tedna|mesec|mesecu|meseca|leto|letu|leta|noč|vikend|vikendu|ponedeljek|torek|sredo|četrtek|petek|soboto|nedeljo|pomlad|poletje|jesen|zimo)",
  "pred (?:\\d+|enim|eno|dvema|tremi|štirimi|petimi|šestimi|nekaj|par) (?:dnem|dnevoma|dnevi|dnevom|tednom|tednoma|tedni|mesecem|mesecema|meseci|letom|letoma|leti)",
  "pred (?:tednom|mesecem|letom)",
  "(?:kupi|proda|obiska|posvoji|zače|konča|zaključi|dokonča|diplomira|podpisa|pridruži|zapusti|sreča|udeleži|preje|dobi|izda|objavi|posla|podaljša|obnovi|preklica|odpoveda|plača|rezervira|vrni|potova|odpotova|zmaga|izgubi|naredi|rodi|umr|praznova|zaposli|odpusti|upokoji|nadgradi|namesti|ustanovi|prispe)l[aoie]?",
  # "poročila" and "naročila" are also the nouns "reports" and "orders".
  "poročil[ai]? se",
  "se (?:je |sta )?poročil[ai]?",
  "(?:je|sem|so|smo|sta|sva) (?:\\w+ ){0,2}naročil[aie]?",
  "šel",
  "šl[aoie]",
  "(?:od|pri)šel",
  "(?:od|pri)šl[aoie]",
]

[relations]
relationship = [
