]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
# "si" is both "you are" and a reflexive ("zdaj si oglej"), so "zdaj si" alone is not a phrase:
# it needs what follows ("… brez omejitev", "… in nimaš …").
[injection]
override = [
  "\\b(?:prezri(?:te)?|ignoriraj(?:te)?|ignorirati|ne upoštevaj(?:te)?|ne oziraj(?:te)? se|pozabi(?:te)?|zanemari(?:te)?|preglasi(?:te)?|zavrzi(?:te)?)\\b[^.\\n]{0,40}\\b(?:prejšnj\\w+|predhodn\\w+|dosedanj\\w+|zgornj\\w+|vs(?:a|e|eh|em|emi)|svoj\\w*|tvoj\\w*|vaš\\w+)\\b[^.\\n]{0,25}\\b(?:navodil\\w*|ukaz\\w*|pravil\\w*|smernic\\w*|usmeritv\\w+|poziv\\w*|prompt\\w*)",
]
role_hijack = [
  "\\b(?:(?:od zdaj|od sedaj|odslej|od tega trenutka)(?: naprej| dalje)?,? (?:si|ste|boš|boste|moraš|morate|imaš|odgovarjaj|odgovarjajte|odgovarjaš)|(?:zdaj|sedaj|odslej) (?:si|ste) (?:neomejen\\w*|necenzuriran\\w*|(?:\\w+ ){1,4}(?:brez|nimaš|nimate))|(?:obnašaj(?:te)? se|se obnašaj(?:te)?|vedi se|deluj(?:te)?) kot (?:\\w+ ){0,2}(?:neomejen\\w*|necenzuriran\\w*|brez (?:\\w+ )?(?:omejitev|pravil|zadržkov))|pretvarjaj(?:te)? se,? da nimaš (?:nobenih |nikakršnih )?(?:pravil|omejitev))",
