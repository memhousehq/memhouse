# The Slovenian language pack. Draft: it passes its test set (languages/tests/sl.yaml) and has
# not yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "sl"
name = "Slovenian"
status = "draft"
# Postgres has no Slovenian stemmer.
text_search = "simple"

[detect]
words = [
  "in", "je", "v", "na", "se", "za", "da", "so", "ki", "s", "z", "pa", "ne", "po", "to", "kot",
  "tudi", "iz", "ali", "bi", "od", "do", "pri", "ob", "med", "pred", "sem", "si", "smo", "ste",
  "bil", "bila", "bilo", "ni", "bo", "kaj", "kdo", "kje", "kdaj", "kako", "zakaj", "ker", "če",
  "ko", "še", "že", "ta", "ti", "jaz", "on", "ona", "mi", "oni", "moj", "moja", "njegov", "njen",
  "naš", "zdaj", "samo", "zelo", "ima", "imam", "lahko", "ter", "kateri", "uporabnik",
]
letters = "čšž"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# Bare "mogoče" is left out: "ni mogoče" and "je mogoče …" state what can or cannot be done.
speculation = [
  "morda",
  "mogoče,? da",
  "lahko,? da",
  "nemara",
  "najbrž",
  "bržkone",
  "verjetno",
  "najverjetneje",
  "domnevno",
  "menda",
  "baje",
  "kot kaže",
  "videti je",
  "zdi se",
  "mislim",
  "domnevam",
  "sumim",
  "ugibam",
  "predvidevam",
  "sprašujem se",
  "nisem prepričan[a]?",
  "ne vem,? (?:ali|če)",
  "ni gotovo",
  "lahko bi",
  "bi lahko",
  "uteg(?:ne|nem|nemo|nejo|nil|nila|nili)",
  "če bi",
  "govoric(?:a|e|ah|ami)",
  "govori se",
  "hipotetično",
  "teoretično",
  "razmišlja(?:m|mo|jo|ta)? o",
  "premišljuj(?:e|em|emo|ejo)",
  "razmišlja(?:m|mo|jo|ta)?,? (?:da|ali)",
]
# A change to something stored before. The future is formed with the same participle as the
# past ("bo prešel"), so a participle counts as a correction only with the past auxiliary.
correction = [
  "pravzaprav",
  "v resnici",
  "dejansko",
  "popravek",
  "popravljam",
  "zmotil[ai]? (?:sem|sva|smo) se",
  "motil[ai]? (?:sem|sva|smo) se",
  "ne \\w+ več",
  "ni več",
  "nima(?:m|mo|jo)? več",
  "ne več",
  "nič več",
  "namesto",
  "(?:je|sem|si|so|smo|ste|sta|sva) (?:\\w+ ){0,2}(?:preselil|odselil|izselil|spremenil|zamenjal)[aoie]?",
  "(?:preselil|odselil|izselil|spremenil|zamenjal)[aoie]? (?:se )?(?:je|sem|so|smo|sta|sva)",
  "(?:je|sem|si|so|smo|ste|sta|sva) (?:\\w+ ){0,2}preš(?:el|l[aoie]) (?:na|v|k)",
  "zdaj",
  "sedaj",
  "medtem",
  "posodobljen[aoi]?",
  "nadomeščen[aoi]?",
  "nekoč",
  "svojčas",
  "(?:je|sem|so|smo|sta|sva) prej",
  "prej (?:je|sem|so|smo|sta|sva)",
]
# An intention not yet carried out.
plan = [
  "načrtuj(?:e|em|emo|ejo|eta|eš)",
  "načrtoval[aoie]?",
  "v načrtu",
  "namerava(?:m|mo|jo|ta|š)?",
  "ima(?:m|mo|jo|ta)? namen",
  "žel(?:i|im|imo|ijo|ita|iš)",
  "hoč(?:e|em|emo|ejo|eta|eš)",
  "bi rad[aie]?",
  "rad[aie]? bi",
  "upa(?:m|mo|jo|ta)?",
  # The future: "bo začel", "bomo prešli".
  "(?:bo|bom|boš|bova|bosta|bomo|boste|bodo) (?:\\w+ ){0,3}\\w+l[aoie]?",
  "(?:naslednj|prihodnj)(?:i|e|o|a|ega|em) (?:teden|tednu|tedna|mesec|mesecu|meseca|leto|letu|leta|četrtletje|četrtletju|ponedeljek|torek|sredo|četrtek|petek|soboto|nedeljo|vikend|vikendu|pomlad|poletje|jesen|zimo)",
