# The words that split a question about several things into sub-queries.
[query]
or = ["ar", "arba"]
or_not = ["ar ne"]
between = ["tarp\\s+(.+?)\\s+ir\\s+(.+?)"]
clause = ["kai", "kol", "kada", "prieš tai,? kai", "po to,? kai", "nuo tada,? kai", "iki tol,? kol"]
lead = [
  "su\\s+kuo", "kur\\w*", "kok\\w+", "kas", "ką", "ko", "kam", "kuo", "kieno", "kada", "kaip",
  "kiek\\s+(?:kartų|laiko)?", "kodėl", "ar",
]
article = ["mano", "mūsų", "savo", "tas", "ta", "tą", "tie", "tos", "tuos", "šis", "ši", "šį", "šią"]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  "\\b(?:ignoruok(?:ite)?|ignoruoti|nepaisyk(?:ite)?|nepaisyti|pamiršk(?:ite)?|pamiršti|nekreipk(?:ite)? dėmesio|nesilaikyk(?:ite)?|nebesilaikyk(?:ite)?|atmesk(?:ite)?)\\b[^.\\n]{0,40}\\b(?:ankstesn\\w+|pirmesn\\w+|ligšiolin\\w+|aukščiau|vis(?:as|ų|us|ais|omis)|savo|tavo|jūsų|bet koki\\w+)\\b[^.\\n]{0,25}\\b(?:instrukcij\\w+|nurodym\\w+|taisykl\\w+|gair\\w+|nuostat\\w+|raginim\\w+|prompt\\w*)",
]
