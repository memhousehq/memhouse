# The Lithuanian language pack. Draft: it passes its test set (languages/tests/lt.yaml) and has
# not yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "lt"
name = "Lithuanian"
status = "draft"
text_search = "lithuanian"

[detect]
words = [
  "ir", "yra", "kad", "su", "į", "iš", "tai", "bet", "ar", "kaip", "o", "ne", "aš", "tu", "jis",
  "ji", "mes", "jūs", "jie", "jos", "mano", "tavo", "jo", "jų", "mūsų", "savo", "šis", "ši", "tas",
  "ta", "kas", "ką", "kur", "kada", "kodėl", "buvo", "bus", "būti", "per", "po", "prie", "nuo",
  "iki", "dėl", "už", "ant", "apie", "prieš", "tik", "dar", "jau", "labai", "taip", "arba", "nes",
  "kai", "jei", "čia", "ten", "turi", "gali", "nėra", "tą", "šį", "naudotojas", "naudotojo",
]
letters = "ąčęėįšųūž"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# "gali" alone (can) is not a hedge; "gali būti" (may be) is.
speculation = [
  "galbūt",
  "gal",
  "galimai",
  "turbūt",
  "tikriausiai",
  "greičiausiai",
  "veikiausiai",
  "ko gero",
  "matyt",
  "regis",
  "rodos",
  "atrodo",
  "panašu",
  "gali būti",
  "galėjo būti",
  "galėtų",
  "manau",
  "manyčiau",
  "spėju",
  "įtariu",
  "nesu tikr(?:as|a)",
  "neaišku,? ar",
  "nežinia,? ar",
  "gand(?:as|ai|ų|us)",
  "kalbama",
  "esą",
  "neva",
  "tariamai",
  "teoriškai",
  "hipotetiškai",
  "svarst(?:o|au|ome|ė)",
  "galvoj(?:a|u|ame) (?:apie|ar)",
  "jei(?:gu)? (?:\\w+ ){0,4}(?:būtų|galėtų|turėtų|norėtų|būčiau|galėčiau|turėčiau|norėčiau)",
]
# A change to something stored before. Past forms only for "moved" and "switched": the
# infinitive appears in plans ("planuoja persikraustyti").
correction = [
  "tiesą sakant",
  "iš tikrųjų",
  "iš tiesų",
  "pataisymas",
  "patikslinimas",
  "pataisau",
  "suklydau",
  "klydau",
