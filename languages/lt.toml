  "jau ne\\w*",
  "vietoj",
  "vietoje",
  "užuot",
  "pasikeitė",
  "pakeitė",
  "pakeist(?:as|a|i|os)",
  "perėj(?:o|au|ome) (?:į|prie)",
  "persikraust(?:ė|ėme)",
  "persikrausčiau",
  "persikėl(?:ė|iau|ėme)",
  "išsikraust(?:ė|ėme)",
  "išsikėl(?:ė|iau|ėme)",
  "dabar",
  "atnaujint(?:as|a|i|os)",
  "anksčiau",
]
# An intention not yet carried out. The future tense is one word in Lithuanian ("pradės"), so
# the common verbs are listed with their future endings.
