  "vili(?:asi|uosi|amės)",
  "siek(?:ia|iu|iame)",
  "(?:aplanky|pradė|persikrausty|persikel|keliau|vyk|važiuo|skri|ei|pirk|nusipirk|pasirašy|išlei|prisijung|išei|paskambin|išsių|nusių|susitik|dalyvau|bandy|pabandy|užsaky|pratę|atšauk|perei|atnaujin|peržiūrė|nusprę|baig|pabaig|užbaig|parduo|grįš)s(?:iu|ime|ite)?",
  "kit(?:ą|ais|ų) (?:savaitę|mėnesį|ketvirtį|metais|metų|pirmadienį|antradienį|trečiadienį|ketvirtadienį|penktadienį|šeštadienį|sekmadienį|savaitgalį|pavasarį|vasarą|rudenį|žiemą)",
  "ateinan\\w+ (?:savaitę|mėnesį|ketvirtį|metais|pirmadienį|antradienį|trečiadienį|ketvirtadienį|penktadienį|šeštadienį|sekmadienį|savaitgalį|pavasarį|vasarą|rudenį|žiemą)",
  "kitąmet",
  "rytoj",
  "poryt",
  "netrukus",
  "vėliau (?:šią savaitę|šį mėnesį|šiais metais|šiemet)",
  "nepamiršk(?:ite)?",
  "tikslas yra",
