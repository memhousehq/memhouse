# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# "3 d.", "14 val.", "3-ią", "1-oji"
number_suffixes = ["d", "val", "-?(?:asis|oji|osios|ąjį|ąją|ojo|as|ą|a|is|ioji|iąją|ią|ias)"]
weekdays = [
  ["pirmadien(?:is|į|io)"], ["antradien(?:is|į|io)"], ["trečiadien(?:is|į|io)"],
  ["ketvirtadien(?:is|į|io)"], ["penktadien(?:is|į|io)"], ["šeštadien(?:is|į|io)"],
  ["sekmadien(?:is|į|io)"],
]
# The genitive and the accusative, the forms dates and "in <month>" use. The nominatives
# "kovas" (rook), "balandis" (pigeon) and "liepa" (linden) are left out: they are also other words.
months = [
  ["saus(?:is|į|io)"], ["vasar(?:is|į|io)"], ["kov(?:o|ą)"], ["baland(?:į|žio)"],
  ["geguž(?:ė|ę|ės)"], ["biržel(?:is|į|io)"], ["liep(?:ą|os)"], ["rugpjū(?:tis|tį|čio)"],
  ["rugsėj(?:is|į|o)"], ["spal(?:is|į|io)"], ["lapkri(?:tis|tį|čio)"], ["gruod(?:is|į|žio)"],
]
month_names = [
  "sausis", "sausį", "sausio", "vasaris", "vasarį", "vasario", "kovas", "kovą", "kovo", "balandis",
  "balandį", "balandžio", "gegužė", "gegužę", "gegužės", "birželis", "birželį", "birželio", "liepa",
  "liepą", "liepos", "rugpjūtis", "rugpjūtį", "rugpjūčio", "rugsėjis", "rugsėjį", "rugsėjo",
  "spalis", "spalį", "spalio", "lapkritis", "lapkritį", "lapkričio", "gruodis", "gruodį",
  "gruodžio",
]
# "prieš dvi savaites"
ago = ["prieš\\s+{num}\\s+{unit}"]
# "per pastarąjį mėnesį", "per pastaruosius tris mėnesius", "praėjusią savaitę"; and
# "prieš savaitę" (a week ago, no number), read as the time since then.
past = [
  "(?:pastar\\w+|praėjus\\w+|praeit\\w+|pereit\\w+|paskutin\\w+)\\s+(?:{num}\\s+)?{unit}",
  "prieš\\s+{unit}",
]
# "praėjusį mėnesį" and "praėjusiais metais" are the previous calendar month and year.
calendar = ["^(?:praėjus|praeit|pereit)"]
# "praėjusį šeštadienį", "šį šeštadienį", and the bare accusative "šeštadienį" (on Saturday).
last_weekday = ["(?:(?:praėjus\\w+|praeit\\w+|pereit\\w+|šį)\\s+)?{weekday}"]
strictly_before = ["^(?:praėjus|praeit|pereit)"]
last_weekend = ["(?:praėjus\\w+|praeit\\w+|pereit\\w+)\\s+savaitgal(?:į|io)"]
yesterday = ["vakar"]
# "šią savaitę", "šį mėnesį", "šiais metais"
this = ["(?:šią|šį|šiais|šio|šios|šių)\\s+{unit}"]
# "vasarį", "vasario mėnesį", "birželio 3 dieną"
in_month = ["{month}(?:\\s+{day})?"]

