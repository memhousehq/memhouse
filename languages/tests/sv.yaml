          - {q: "Vad lagade jag i går?", covers: ["2026-06-30"]}
          - {q: "Vad har jag gjort klart den här veckan?", covers: ["2026-06-29"]}
          - {q: "Vart åkte jag förra helgen?", covers: ["2026-06-27"]}
          - {q: "Vad hände den 3 juni?", covers: ["2026-06-03"]}
          - {q: "Vad är status för order A-1001?", ids: ["a-1001"]}
          - {q: "Vad hände med ärende #4521 och faktura INV2024-77?", ids: ["4521", "inv2024-77"]}
