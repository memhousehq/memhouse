          - {q: "¿Qué he terminado esta semana?", covers: ["2026-06-29"]}
          - {q: "¿Adónde fui el fin de semana pasado?", covers: ["2026-06-27"]}
          - {q: "¿Qué pasó el 3 de junio?", covers: ["2026-06-03"]}
          - {q: "¿Cuál es el estado del pedido A-1001?", ids: ["a-1001"]}
          - {q: "¿Qué pasó con el ticket #4521 y la factura INV2024-77?", ids: ["4521", "inv2024-77"]}
