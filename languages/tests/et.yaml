# The labelled test set of the Estonian language pack (languages/et.toml).
# Check it with: memhouse lang check languages/et.toml --tests languages/tests/et.yaml
format: 1
name: lang-et
language: et
description: Labelled statements, injection attempts, time questions and identifier questions for the Estonian pack.
