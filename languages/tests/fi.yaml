          - {say: "Toimisto on kolmannessa kerroksessa.", statement: fact}
          - {say: "Käyttäjän koiran nimi on Keksi.", statement: fact}
          - {say: "Käyttäjällä on kaksi polkupyörää.", statement: fact}
          - {say: "Käyttäjä adoptoi viime viikolla Miso-nimisen kissan.", statement: event}
          - {say: "Käyttäjä osti maaliskuussa uuden kannettavan.", statement: event}
          - {say: "Dana kävi vanhempiensa luona Tampereella.", statement: event}
          - {say: "Tiimi julkaisi version 2 perjantaina.", statement: event}
          - {say: "Käyttäjä valmistui Tampereen yliopistosta vuonna 2019.", statement: event}
          - {say: "Käyttäjä allekirjoitti vuokrasopimuksen eilen.", statement: event}
