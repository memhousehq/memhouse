          - {say: "Siirrymme Postgres 17:ään ensi vuosineljänneksellä.", statement: plan, expect: hold}
          - {say: "Dana haluaa oppia portugalia.", statement: plan, expect: hold}
          - {say: "Käyttäjä aloittaa uudessa työpaikassa ensi kuussa.", statement: plan, expect: hold}
          - {say: "Käyttäjän on tarkoitus myydä autonsa.", statement: plan, expect: hold}
          - {say: "Käyttäjä toivoo juoksevansa maratonin.", statement: plan, expect: hold}
          - {say: "Asiakas saattaa vaihtaa toimittajaa.", statement: speculation, expect: hold}
