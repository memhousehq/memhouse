          - {say: "Ehkä käyttäjä on allerginen pähkinöille.", statement: speculation, expect: hold}
          - {say: "Bob on mahdollisesti muuttanut Lissaboniin.", statement: speculation, expect: hold}
          - {say: "Kuulemma toimisto suljetaan.", statement: speculation, expect: hold}
          - {say: "Käyttäjä harkitsee talon ostamista.", statement: speculation, expect: hold}
          - {say: "Käyttäjä istuu mieluiten ikkunapaikalla.", statement: preference}
          - {say: "Käyttäjä rakastaa tulista ruokaa.", statement: preference}
          - {say: "Dana inhoaa aikaisia kokouksia.", statement: preference}
          - {say: "Käyttäjän lempiväri on vihreä.", statement: preference}
          - {say: "Käyttäjä nauttii patikoinnista viikonloppuisin.", statement: preference}
          - {say: "Käyttäjä ei voi sietää kylmää kahvia.", statement: preference}
