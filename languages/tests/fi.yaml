          - {q: "Mitä tapahtui 3. kesäkuuta?", covers: ["2026-06-03"]}
          - {q: "Mikä on tilauksen A-1001 tila?", ids: ["a-1001"]}
          - {q: "Mitä tapahtui tiketille #4521 ja laskulle INV2024-77?", ids: ["4521", "inv2024-77"]}
