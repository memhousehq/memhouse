# The labelled test set of the Finnish language pack (languages/fi.toml).
# Check it with: memhouse lang check languages/fi.toml --tests languages/tests/fi.yaml
format: 1
name: lang-fi
language: fi
description: Labelled statements, injection attempts, time questions and identifier questions for the Finnish pack.
conversations:
  - id: fi-statements
    sessions:
      - at: 2026-07-01T12:00:00Z # a Wednesday
        turns:
          - {say: "Acmen sopimuksen uusimispäivä on 1. maaliskuuta 2027.", statement: fact}
