# The labelled test set of the Croatian language pack (languages/hr.toml).
# Check it with: memhouse lang check languages/hr.toml --tests languages/tests/hr.yaml
format: 1
name: lang-hr
language: hr
description: Labelled statements, injection attempts, time questions and identifier questions for the Croatian pack.
conversations:
  - id: hr-statements
    sessions:
      - at: 2026-07-01T12:00:00Z # a Wednesday
        turns:
          - {say: "Datum obnove ugovora za Acme je 1. ožujka 2027.", statement: fact}
          - {say: "Korisnikova sestra živi u Splitu.", statement: fact}
          - {say: "Dana je medicinska sestra u gradskoj bolnici.", statement: fact}
          - {say: "Ured se nalazi na trećem katu.", statement: fact}
          - {say: "Korisnikov pas zove se Keks.", statement: fact}
          - {say: "Korisnik ima dva bicikla.", statement: fact}
          - {say: "Korisnik je prošli tjedan udomio mačku po imenu Miso.", statement: event}
          - {say: "Korisnik je u ožujku kupio novi laptop.", statement: event}
          - {say: "Dana je posjetila roditelje u Splitu.", statement: event}
          - {say: "Tim je u petak isporučio verziju 2.", statement: event}
          - {say: "Korisnik je 2019. diplomirao na Sveučilištu u Zagrebu.", statement: event}
          - {say: "Korisnik je jučer potpisao ugovor o najmu.", statement: event}
          - {say: "Zapravo se korisnik preselio u Porto.", statement: correction}
