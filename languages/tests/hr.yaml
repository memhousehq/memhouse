          - {q: "S kim sam prošle subote bio na koncertu?", covers: ["2026-06-27"]}
          - {q: "Koje sam vozilo servisirao u veljači?", covers: ["2026-02-14"]}
          - {q: "Koje sam cipele očistio prošli mjesec?", covers: ["2026-06-15"]}
          - {q: "Što sam jučer kuhao?", covers: ["2026-06-30"]}
          - {q: "Što sam završio ovaj tjedan?", covers: ["2026-06-29"]}
          - {q: "Kamo sam išao prošli vikend?", covers: ["2026-06-27"]}
          - {q: "Što se dogodilo 3. lipnja?", covers: ["2026-06-03"]}
          - {q: "Kakav je status narudžbe A-1001?", ids: ["a-1001"]}
          - {q: "Što se dogodilo s tiketom #4521 i računom INV2024-77?", ids: ["4521", "inv2024-77"]}
