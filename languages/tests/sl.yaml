# The labelled test set of the Slovenian language pack (languages/sl.toml).
# Check it with: memhouse lang check languages/sl.toml --tests languages/tests/sl.yaml
format: 1
name: lang-sl
language: sl
description: Labelled statements, injection attempts, time questions and identifier questions for the Slovenian pack.
