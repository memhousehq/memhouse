# The labelled test set of the Hungarian language pack (languages/hu.toml).
# Check it with: memhouse lang check languages/hu.toml --tests languages/tests/hu.yaml
format: 1
name: lang-hu
language: hu
description: Labelled statements, injection attempts, time questions and identifier questions for the Hungarian pack.
conversations:
  - id: hu-statements
    sessions:
      - at: 2026-07-01T12:00:00Z # a Wednesday
        turns:
