          - {say: "A felhasználó azt tervezi, hogy májusban Japánba látogat.", statement: plan, expect: hold}
          - {say: "A következő negyedévben átállunk a Postgres 17-re.", statement: plan, expect: hold}
          - {say: "Dana portugálul szeretne tanulni.", statement: plan, expect: hold}
