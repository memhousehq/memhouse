          - {q: "Hvad lavede jeg af mad i går?", covers: ["2026-06-30"]}
          - {q: "Hvad har jeg gjort færdig i denne uge?", covers: ["2026-06-29"]}
          - {q: "Hvor tog jeg hen i sidste weekend?", covers: ["2026-06-27"]}
          - {q: "Hvad skete der den 3. juni?", covers: ["2026-06-03"]}
          - {q: "Hvad er status på ordre A-1001?", ids: ["a-1001"]}
          - {q: "Hvad skete der med sag #4521 og faktura INV2024-77?", ids: ["4521", "inv2024-77"]}
