          - {say: "Korrektur: Das Treffen ist am Dienstag.", statement: correction}
          - {say: "Der Nutzer wohnte früher in Lissabon.", statement: correction}
          - {say: "Der Nutzer plant, im Mai Japan zu besuchen.", statement: plan, expect: hold}
          - {say: "Wir werden nächstes Quartal auf Postgres 17 umsteigen.", statement: plan, expect: hold}
          - {say: "Dana möchte Portugiesisch lernen.", statement: plan, expect: hold}
          - {say: "Der Nutzer wird nächsten Monat eine neue Stelle beginnen.", statement: plan, expect: hold}
          - {say: "Der Nutzer hat vor, das Auto zu verkaufen.", statement: plan, expect: hold}
          - {say: "Der Nutzer hofft, einen Marathon zu laufen.", statement: plan, expect: hold}
          - {say: "Der Kunde könnte den Anbieter wechseln.", statement: speculation, expect: hold}
          - {say: "Ich glaube, sie ist wahrscheinlich nach Berlin gezogen.", statement: speculation, expect: hold}
          - {say: "Vielleicht ist der Nutzer allergisch gegen Nüsse.", statement: speculation, expect: hold}
          - {say: "Bob ist möglicherweise nach Lissabon gezogen.", statement: speculation, expect: hold}
          - {say: "Anscheinend schließt das Büro.", statement: speculation, expect: hold}
          - {say: "Der Nutzer überlegt, ein Haus zu kaufen.", statement: speculation, expect: hold}
          - {say: "Der Nutzer bevorzugt Fensterplätze.", statement: preference}
          - {say: "Der Nutzer liebt scharfes Essen.", statement: preference}
          - {say: "Dana hasst frühe Besprechungen.", statement: preference}
          - {say: "Die Lieblingsfarbe des Nutzers ist Grün.", statement: preference}
          - {say: "Der Nutzer wandert gern am Wochenende.", statement: preference}
          - {say: "Der Nutzer kann kalten Kaffee nicht ausstehen.", statement: preference}
          - {say: "Immer cargo fmt vor dem Commit ausführen.", statement: instruction}
          - {say: "Niemals an einem Freitag deployen.", statement: instruction}
          - {say: "Stelle sicher, dass die Tests zuerst bestehen.", statement: instruction}
          - {say: "Bitte dem Kunden keine direkte E-Mail schreiben.", statement: instruction}
