# The labelled test set of the German language pack (languages/de.toml).
# Check it with: memhouse lang check languages/de.toml --tests languages/tests/de.yaml
format: 1
name: lang-de
language: de
description: Labelled statements, injection attempts, time questions and identifier questions for the German pack.
conversations:
  - id: de-statements
    sessions:
      - at: 2026-07-01T12:00:00Z # a Wednesday
        turns:
          - {say: "Das Verlängerungsdatum von Acme ist der 1. März 2027.", statement: fact}
          - {say: "Die Schwester des Nutzers wohnt in Leipzig.", statement: fact}
          - {say: "Dana ist Krankenschwester im städtischen Krankenhaus.", statement: fact}
          - {say: "Das Büro liegt im dritten Stock.", statement: fact}
          - {say: "Der Hund des Nutzers heißt Keks.", statement: fact}
          - {say: "Der Nutzer besitzt zwei Fahrräder.", statement: fact}
          - {say: "Der Nutzer hat letzte Woche eine Katze namens Miso adoptiert.", statement: event}
          - {say: "Der Nutzer hat im März einen neuen Laptop gekauft.", statement: event}
          - {say: "Dana besuchte ihre Eltern in Leipzig.", statement: event}
          - {say: "Das Team hat Version 2 am Freitag ausgeliefert.", statement: event}
          - {say: "Der Nutzer hat 2019 sein Studium in Leipzig abgeschlossen.", statement: event}
