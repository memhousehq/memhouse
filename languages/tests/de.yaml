          - {q: "Was habe ich diese Woche erledigt?", covers: ["2026-06-29"]}
          - {q: "Wo war ich letztes Wochenende?", covers: ["2026-06-27"]}
          - {q: "Was ist am 3. Juni passiert?", covers: ["2026-06-03"]}
