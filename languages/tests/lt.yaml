          - {say: "Naudotojas planuoja gegužę aplankyti Japoniją.", statement: plan, expect: hold}
          - {say: "Kitą ketvirtį ketiname pereiti prie „Postgres 17“.", statement: plan, expect: hold}
          - {say: "Dana nori išmokti portugalų kalbą.", statement: plan, expect: hold}
          - {say: "Kitą mėnesį naudotojas pradės naują darbą.", statement: plan, expect: hold}
          - {say: "Naudotojas ruošiasi parduoti automobilį.", statement: plan, expect: hold}
