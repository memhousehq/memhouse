          - {say: "Dana dirba slaugytoja miesto ligoninėje.", statement: fact}
          - {say: "Biuras yra trečiame aukšte.", statement: fact}
          - {say: "Naudotojo šuns vardas – Sausainis.", statement: fact}
          - {say: "Naudotojas turi du dviračius.", statement: fact}
          - {say: "Praėjusią savaitę naudotojas priglaudė katę, vardu Miso.", statement: event}
          - {say: "Kovo mėnesį naudotojas nusipirko naują nešiojamąjį kompiuterį.", statement: event}
          - {say: "Dana aplankė savo tėvus Kaune.", statement: event}
          - {say: "Komanda penktadienį išleido 2 versiją.", statement: event}
          - {say: "Naudotojas 2019 metais baigė Vilniaus universitetą.", statement: event}
          - {say: "Vakar naudotojas pasirašė nuomos sutartį.", statement: event}
          - {say: "Tiesą sakant, naudotojas persikraustė į Portą.", statement: correction}
          - {say: "Naudotojas nebedirba įmonėje „Initech“.", statement: correction}
          - {say: "Dabar naudotojas turi keturis dviračius.", statement: correction}
          - {say: "Dana perėjo į naktinę pamainą.", statement: correction}
          - {say: "Pataisymas: susitikimas vyks antradienį.", statement: correction}
