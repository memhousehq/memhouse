          - {say: "Galbūt naudotojas alergiškas riešutams.", statement: speculation, expect: hold}
          - {say: "Bobas, ko gero, persikėlė į Lisaboną.", statement: speculation, expect: hold}
          - {say: "Panašu, kad biuras uždaromas.", statement: speculation, expect: hold}
          - {say: "Naudotojas svarsto, ar pirkti namą.", statement: speculation, expect: hold}
          - {say: "Naudotojui labiau patinka vietos prie lango.", statement: preference}
          - {say: "Naudotojas dievina aštrų maistą.", statement: preference}
          - {say: "Dana nekenčia ankstyvų susirinkimų.", statement: preference}
          - {say: "Mėgstamiausia naudotojo spalva – žalia.", statement: preference}
