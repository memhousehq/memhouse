# The labelled test set of the Lithuanian language pack (languages/lt.toml).
# Check it with: memhouse lang check languages/lt.toml --tests languages/tests/lt.yaml
format: 1
name: lang-lt
language: lt
description: Labelled statements, injection attempts, time questions and identifier questions for the Lithuanian pack.
conversations:
  - id: lt-statements
    sessions:
      - at: 2026-07-01T12:00:00Z # a Wednesday
        turns:
          - {say: "„Acme“ sutarties pratęsimo data – 2027 m. kovo 1 d.", statement: fact}
