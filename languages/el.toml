# The words that split a question about several things into sub-queries. The Greek question
# mark is ";".
[query]
or = ["ή"]
or_not = ["ή όχι"]
between = ["(?:αν[αά]μεσα|μεταξ[υύ])\\s+(?:σ(?:ε|το|τη|την|τον|τους|τις|τα)\\s+)?(.+?)\\s+και\\s+(.+?);?"]
