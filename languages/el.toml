  "μ[ιί]α", "αυτ[οόηή]ς?", "εκε[ιί]ν(?:ος|η|ο|ον|ην)",
]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
# The imperative of several of these verbs is also their 3rd-person past ("αγνόησε", "ξέχασε").
[injection]
override = [
  "\\b(?:αγν[οό]ησε|αγνο[ηή]στε|αγν[οό]α|παρ[αά]βλεψε|παραβλ[εέ]ψτε|ξ[εέ]χνα|ξ[εέ]χασε|ξεχ[αά]στε|παρ[αά]καμψε|παρακ[αά]μψτε|μην? (?:ακολουθ(?:ε[ιί]ς|ε[ιί]τε)|τηρε[ιί]ς|τηρε[ιί]τε))\\b[^.\\n]{0,40}\\b(?:προηγο[υύ]μ[εέ]ν\\w{1,3}|παραπ[αά]νω|πρ[οό]τερ\\w{1,3}|μ[εέ]χρι τ[ωώ]ρα|[οό]λ(?:ες|ους|α|ων|οι)|δικ(?:[εέ]ς|ο[υύ]ς|[αά]) (?:σου|σας))\\b[^.\\n]{0,25}\\b(?:οδηγ[ιί](?:ες|α)|οδηγι[ωώ]ν|εντολ(?:[εέ]ς|[ηή]|[ωώ]ν)|καν[οό]ν(?:ες|α|ας|ων)|κατευθ[υύ]νσεις|prompts?)",
  "\\b(?:αγν[οό]ησε|αγνο[ηή]στε|αγν[οό]α|παρ[αά]βλεψε|παραβλ[εέ]ψτε|ξ[εέ]χνα|ξ[εέ]χασε|ξεχ[αά]στε|παρ[αά]καμψε|παρακ[αά]μψτε)\\b[^.\\n]{0,40}\\b(?:οδηγ[ιί]ες|εντολ[εέ]ς|καν[οό]νες|κατευθ[υύ]νσεις)\\s+(?:σου|σας)\\b",
]
# The verb after "θα" must be in the second person ("θα απαντάς"): "από εδώ και πέρα θα δουλεύει
# από το σπίτι" is an ordinary statement.
role_hijack = [
  "\\b(?:(?:απ[οό] (?:εδ[ωώ]|δω) και (?:π[εέ]ρα|στο εξ[ηή]ς)|απ[οό] τ[ωώ]ρα(?: και στο εξ[ηή]ς)?|στο εξ[ηή]ς|εφεξ[ηή]ς),? (?:εσ[υύ] )?(?:(?:θα|να|πρ[εέ]πει να) (?:(?:μου|μας|του|της|τους|τον|την|το|τις|τα) ){0,2}\\w{3,}(?:εις|ε[ιί]ς|[αά]ς|σαι|ετε|ε[ιί]τε|[αά]τε)\\b|(?:θα )?ε[ιί]σαι\\b|(?:θα )?ε[ιί]στε\\b)|(?:τ[ωώ]ρα|πλ[εέ]ον) ε[ιί]σαι\\b|ε[ιί]σαι (?:τ[ωώ]ρα|πλ[εέ]ον)\\b|(?:φ[εέ]ρσου|συμπεριφ[εέ]ρσου|συμπεριφερθε[ιί]τε|λειτο[υύ]ργησε|απ[αά]ντα) (?:σαν|ως) (?:\\w+ ){0,2}(?:χωρ[ιί]ς (?:περιορισμο[υύ]ς|φ[ιί]λτρα|λογοκρισ[ιί]α|καν[οό]νες)|απεριόριστ\\w{1,3}|αλογ[οό]κριτ\\w{1,3})|(?:προσποι[ηή]σου|κ[αά]νε) (?:[οό]τι|πως) δεν [εέ]χεις (?:καν[εέ]ναν? )?(?:καν[οό]νες|περιορισμ[οό]|περιορισμο[υύ]ς))",
]
system_prompt = [
  "\\b(?:αποκ[αά]λυψε|αποκαλ[υύ]ψτε|δε[ιί]ξε|δε[ιί]ξτε|εμφ[αά]νισε|εμφαν[ιί]στε|τ[υύ]πωσε|τυπ[ωώ]στε|γρ[αά]ψε|γρ[αά]ψτε|πες|πε[ιί]τε|δ[ωώ]σε|δ[ωώ]στε|μοιρ[αά]σου)\\b[^.\\n]{0,40}(?:\\bsystem prompt|\\bπροτροπ[ηή]ς? (?:του )?συστ[ηή]ματος|\\bμ[ηή]νυμα (?:του )?συστ[ηή]ματος|\\bοδηγ[ιί]ες (?:του )?συστ[ηή]ματος|\\bκρυφ[εέ]ς (?:σου )?οδηγ[ιί]ες|\\bμ[ηή]νυμα (?:του )?προγραμματιστ[ηή])",
