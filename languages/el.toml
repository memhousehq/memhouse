# The Greek language pack. Draft: it passes its test set (languages/tests/el.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
#
# Accents: casual and upper-case Greek is often written without the stress accent, so a pattern
# names the stressed vowel as a class ("[ιί]σως" reads "ίσως", "ισως" and "ΙΣΩΣ"). Matching
# without regard to case already treats σ and the final ς as one letter.
format = 1
language = "el"
name = "Greek"
status = "draft"
text_search = "greek"

[detect]
words = [
  "ο", "η", "το", "οι", "τα", "του", "της", "των", "τον", "την", "τους", "τις", "και", "κι", "να",
  "θα", "δεν", "με", "σε", "για", "από", "που", "είναι", "ήταν", "έχει", "έχω", "ένα", "μια", "ένας",
  "στο", "στη", "στην", "στον", "στα", "στις", "αυτό", "αυτή", "αυτός", "εγώ", "εσύ", "εμείς", "μου",
  "σου", "μας", "σας", "τι", "πώς", "πού", "πότε", "ποιος", "ποια", "ποιο", "γιατί", "αλλά", "ή",
  "αν", "όταν", "ως", "πιο", "πολύ", "μόνο", "ότι", "πως", "μετά", "πριν", "χρήστης",
]
letters = "αβγδεζηθικλμνξοπρσςτυφχψωάέήίόύώϊϋΐΰ"

