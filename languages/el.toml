# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# "1η", "3ης", "2ος", "5μμ"
number_suffixes = ["ης?", "ος", "ου", "ο", "ων", "μμ", "πμ"]
# "τρίτη", "τετάρτη" and "πέμπτη" are also the ordinals third, fourth and fifth (feminine).
weekdays = [
  ["δευτ[εέ]ρας?"], ["τρ[ιί]της?"], ["τετ[αά]ρτης?"], ["π[εέ]μπτης?"], ["παρασκευ[ηή]ς?"],
  ["σ[αά]ββατο", "σαββ[αά]του"], ["κυριακ[ηή]ς?"],
]
# Nominative, accusative ("τον Φεβρουάριο"), genitive ("3 Ιουνίου") and the short everyday
# forms ("Φλεβάρης", "τον Ιούνη").
months = [
  ["ιανου[αά]ρι(?:ος|ο)", "ιανουαρ[ιί]ου", "γεν[αά]ρης?"],
  ["φεβρου[αά]ρι(?:ος|ο)", "φεβρουαρ[ιί]ου", "φλεβ[αά]ρης?"],
  ["μ[αά]ρτι(?:ος|ο)", "μαρτ[ιί]ου", "μ[αά]ρτης?"],
  ["απρ[ιί]λι(?:ος|ο)", "απριλ[ιί]ου", "απρ[ιί]λης?"],
  ["μ[αά]ι(?:ος|ο)", "μα[ιϊΐί]ου", "μ[αά]ης?"],
  ["ιο[υύ]νι(?:ος|ο)", "ιουν[ιί]ου", "ιο[υύ]νης?"],
  ["ιο[υύ]λι(?:ος|ο)", "ιουλ[ιί]ου", "ιο[υύ]λης?"],
  ["α[υύ]γουστ(?:ος|ο)", "αυγο[υύ]στου"],
  ["σεπτ[εέ]μβρι(?:ος|ο)", "σεπτεμβρ[ιί]ου", "σεπτ[εέ]μβρης?"],
  ["οκτ[ωώ]βρι(?:ος|ο)", "οκτωβρ[ιί]ου", "οκτ[ωώ]βρης?"],
  ["νο[εέ]μβρι(?:ος|ο)", "νοεμβρ[ιί]ου", "νο[εέ]μβρης?"],
  ["δεκ[εέ]μβρι(?:ος|ο)", "δεκεμβρ[ιί]ου", "δεκ[εέ]μβρης?"],
]
month_names = [
  "ιανουάριος", "ιανουάριο", "ιανουαρίου", "γενάρης", "γενάρη", "φεβρουάριος", "φεβρουάριο",
  "φεβρουαρίου", "φλεβάρης", "φλεβάρη", "μάρτιος", "μάρτιο", "μαρτίου", "μάρτης", "μάρτη",
  "απρίλιος", "απρίλιο", "απριλίου", "απρίλης", "απρίλη", "μάιος", "μάιο", "μαΐου", "μάης", "μάη",
  "ιούνιος", "ιούνιο", "ιουνίου", "ιούνης", "ιούνη", "ιούλιος", "ιούλιο", "ιουλίου", "ιούλης",
  "ιούλη", "αύγουστος", "αύγουστο", "αυγούστου", "σεπτέμβριος", "σεπτέμβριο", "σεπτεμβρίου",
  "σεπτέμβρης", "σεπτέμβρη", "οκτώβριος", "οκτώβριο", "οκτωβρίου", "οκτώβρης", "οκτώβρη",
  "νοέμβριος", "νοέμβριο", "νοεμβρίου", "νοέμβρης", "νοέμβρη", "δεκέμβριος", "δεκέμβριο",
  "δεκεμβρίου", "δεκέμβρης", "δεκέμβρη",
]
# "πριν από δύο εβδομάδες", "πριν δύο εβδομάδες", "δύο εβδομάδες πριν"
ago = ["πριν\\s+(?:απ[οό]\\s+)?{num}\\s+{unit}", "{num}\\s+{unit}\\s+πριν"]
# "τον τελευταίο μήνα", "τις τελευταίες τρεις εβδομάδες", "την περασμένη εβδομάδα", "τον μήνα
# που πέρασε"
past = [
  "(?:τελευτα[ιί]|περασμ[εέ]ν|προηγο[υύ]μ[εέ]ν)\\w{1,3}\\s+(?:{num}\\s+)?{unit}",
  "{unit}\\s+που\\s+(?:μας\\s+)?π[εέ]ρασε",
]
# "τον περασμένο μήνα" and "την περασμένη χρονιά" are the previous calendar month and year.
calendar = ["^(?:περασμ|προηγο)", "που\\s+(?:μας\\s+)?π[εέ]ρασε$"]
# "το περασμένο Σάββατο", "αυτή την Τρίτη", "το Σάββατο", "την Παρασκευή"
last_weekday = [
  "(?:περασμ[εέ]ν\\w{1,3}|προηγο[υύ]μ[εέ]ν\\w{1,3}|αυτ[οόηή]ν?\\s+τ(?:ο|ην?))\\s+{weekday}",
  "(?:το|την?)\\s+{weekday}",
]
strictly_before = ["^(?:περασμ|προηγο)"]
last_weekend = ["(?:περασμ[εέ]νο|προηγο[υύ]μενο)\\s+σαββατοκ[υύ]ριακο", "σαββατοκ[υύ]ριακο\\s+που\\s+(?:μας\\s+)?π[εέ]ρασε"]
yesterday = ["ε?χθ[εέ]ς", "χτ[εέ]ς"]
this = ["αυτ[οόηή]ν?\\s+τ(?:ον|ην|ο|η)\\s+{unit}"]
# "τον Φεβρουάριο", "στις 3 Ιουνίου", "την 1η Μαρτίου"
in_month = ["(?:{day}(?:ης?)?\\s+)?{month}"]

