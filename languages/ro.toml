# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
number_suffixes = ["-a", "-lea", "-ea"]
weekdays = [
  ["lun(?:i|ea)"],
  ["mar[țţt](?:i|ea)"],
  ["miercur(?:i|ea)"],
  ["jo(?:i|ia)"],
  ["viner(?:i|ea)"],
  ["s[âa]mb[ăa]t(?:[ăa]|a)"],
  ["duminic(?:[ăa]|a)"],
]
# "mai" is also "more" and "still" ("nu mai"): the in_month templates ask for a preposition or a day.
months = [
  ["ianuarie"],
  ["februarie"],
  ["martie"],
  ["aprilie"],
  ["mai"],
  ["iunie"],
  ["iulie"],
  ["august"],
  ["septembrie"],
  ["octombrie"],
  ["noiembrie"],
  ["decembrie"],
]
month_names = [
  "ianuarie", "februarie", "martie", "aprilie", "mai", "iunie", "iulie", "august", "septembrie",
  "octombrie", "noiembrie", "decembrie",
]
ago = ["acum\\s+{num}\\s+(?:de\\s+)?{unit}", "(?:cu\\s+)?{num}\\s+(?:de\\s+)?{unit}\\s+[îi]n\\s+urm[ăa]"]
past = ["ultim(?:a|ul|ele|ii)\\s+(?:{num}\\s+(?:de\\s+)?)?{unit}", "{unit}\\s+trecut(?:[ăa])?"]
# "luna trecută" and "anul trecut" are the previous calendar month and year; "ultima lună" is the
# last thirty days.
calendar = ["trecut"]
last_weekday = ["{weekday}\\s+trecut[ăa]", "ultima\\s+{weekday}"]
strictly_before = ["trecut", "^ultima"]
last_weekend = ["weekend(?:-?ul)?\\s+trecut", "sf[âa]r[șşs]itul\\s+de\\s+s[ăa]pt[ăa]m[âa]n[ăa]\\s+trecut", "ultimul\\s+weekend"]
yesterday = ["ieri"]
this = ["{unit}\\s+(?:aceasta|asta|acesta|[ăa]sta)", "(?:aceast[ăa]|acest)\\s+{unit}"]
in_month = ["(?:[îi]n|din|pe|lui|luna|lunii|data\\s+de)\\s+(?:{day}\\s+)?{month}", "{day}\\s+{month}"]

