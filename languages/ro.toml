# The words that split a question about several things into sub-queries.
[query]
or = ["sau", "ori"]
or_not = ["sau nu"]
between = ["[îi]ntre\\s+(.+?)\\s+[șşs]i\\s+(.+?)"]
clause = [
  "c[âa]nd", "[îi]nainte", "dup[ăa]", "de c[âa]nd", "[îi]n timp ce", "p[âa]n[ăa]",
]
lead = [
  "care", "ce", "cine", "cui", "c[âa]nd", "unde", "cum", "cu\\s+cine", "la\\s+ce", "pe\\s+cine",
  "c[âa][țţt]i", "c[âa]te", "c[âa]t(?:[ăa])?(?:\\s+de\\s+\\w+)?", "am", "ai", "au", "a[țţt]i", "a",
  "este", "era", "e", "sunt", "s-a",
]
article = [
  "un", "o", "ni[șşs]te", "al", "a", "acel", "acea", "acei", "acele", "acest", "aceast[ăa]",
]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
