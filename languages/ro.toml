  "[îi]ncheiat",
  "semnat",
  "al[ăa]turat",
  "p[ăa]r[ăa]sit",
  "[îi]nt[âa]lnit",
  "participat",
  "absolvit",
  "c[ăa]s[ăa]torit",
  "primit",
  "lansat",
  "livrat",
  "re[îi]nnoit",
  "anulat",
  "pl[ăa]tit",
  "rezervat",
  "comandat",
  "returnat",
  "c[ăa]l[ăa]torit",
  "c[âa][șşs]tigat",
  "pierdut",
  "dat",
  "luat",
  "f[ăa]cut",
  "n[ăa]scut",
  "murit",
  "decedat",
  "s[ăa]rb[ăa]torit",
  "(?:a|au|am|a[țţt]i) angajat",
  "a fost angajat(?:[ăa])?",
  "concediat",
  "demisionat",
  "pensionat",
  "achizi[țţt]ionat",
]

[relations]
relationship = [
  "\\b(?:este|e|era|sunt|erau|a devenit|a fost) (?:acum )?(?:noul |noua )?(?:managerul|manager|[șşs]eful|[șşs]efa|[șşs]ef|colegul|colega|coleg|so[țţt]ia|so[țţt]ul|partenerul|partenera|prietenul|prietena|fratele|sora|mama|tat[ăa]l|fiul|fiica|v[ăa]rul|veri[șşs]oara|unchiul|m[ăa]tu[șşs]a|vecinul|vecina|mentorul|clientul|client|furnizorul|furnizor|proprietarul|fondatorul|directorul|sponsorul|persoana de contact) (?:lui|al|a|de la|pentru|la)\\b",
  "\\b(?:raporteaz[ăa] c[ăa]tre|lucreaz[ăa] pentru|lucreaz[ăa] cu|c[ăa]s[ăa]torit(?:[ăa])? cu|logodit(?:[ăa])? cu|este rud[ăa] cu|este condus(?:[ăa])? de)\\b",
]
people = [
  "soră", "sora", "frate", "fratele", "mamă", "mama", "tată", "tata", "tatăl", "tatal", "părinte",
