# SPDX-License-Identifier: Apache-2.0
# The Romanian language pack. Draft: it passes its test set (languages/tests/ro.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
# Romanian is written with ș/ț (comma below), with the legacy ş/ţ (cedilla), and often with no
# diacritics at all. Patterns accept all three ("s[ăa]pt[ăa]m[âa]na"); plain word lists carry each
# spelling.
format = 1
language = "ro"
name = "Romanian"
status = "draft"
text_search = "romanian"

[detect]
words = [
  "și", "şi", "si", "în", "in", "de", "la", "cu", "pe", "un", "o", "a", "este", "e", "sunt", "nu",
  "că", "ca", "să", "sa", "se", "din", "pentru", "care", "mai", "dar", "sau", "ce", "cine", "când",
  "cand", "unde", "cum", "am", "ai", "au", "are", "era", "fost", "lui", "ei", "lor", "el", "ea",
  "eu", "al", "ale", "își", "îşi", "isi", "îi", "ii", "le", "acest", "această", "aceasta", "acum",
  "după", "dupa", "până", "pana", "prin", "despre", "foarte", "doar", "fără", "fara", "între",
  "intre", "dacă", "daca", "utilizatorul",
]
letters = "ăâîșțşţ"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# "poate" alone is left out: it is also the verb "can" ("poate veni"). "posibil" alone is left out:
# it is also the adjective in "cât mai repede posibil".
speculation = [
  "poate c[ăa]",
  "probabil",
  "posibil (?:ca|s[ăa])",
  "(?:e|este|era) posibil",
  "eventual",
  "s-ar putea",
  "ar putea",
  "ar fi putut",
  "se poate (?:ca|s[ăa])",
  "cred c[ăa]",
  "credem c[ăa]",
  "b[ăa]nuiesc",
  "presupun",
  "m[ăa] [îi]ntreb",
  "nu (?:sunt|e|este) sigur(?:[ăa])?",
  "nesigur(?:[ăa])?",
  "zvon(?:ul|uri|urile)?",
  "se zvone[șşs]te",
  "cic[ăa]",
  "chipurile",
  "se pare",
  "pare-se",
  "aparent",
  "ipotetic",
  "[îi]n teorie",
  "teoretic",
  "(?:se g[âa]nde[șşs]te|se g[âa]ndesc|m[ăa] g[âa]ndesc|ne g[âa]ndim) s[ăa]",
  "(?:ia|iau|lu[ăa]m) [îi]n (?:considerare|calcul)",
  "dac[ăa] (?:am|a[șşs]|ar|ai|a[țţt]i) (?:fi|avea|putea)",
]
# A change to something stored before.
# "acum" (now) needs a verb next to it: "acum două săptămâni" is "two weeks ago". "înainte" is left
# out: it is mostly the preposition "înainte de" (before).
correction = [
  "de fapt",
  "corec[țţt]ie",
  "corectare",
  "corectur[ăa]",
  "rectificare",
  "m-am [îi]n[șşs]elat",
  "am gre[șşs]it",
  "nu mai",
  "[îi]n loc de",
  "[îi]n loc s[ăa]",
  "[îi]n schimb",
  "schimbat(?:[ăa])?",
  "mutat(?:[ăa])?",
  "(?:a|au|am|a[țţt]i) trecut (?:la|pe|[îi]n)",
  "acum (?:are|au|este|e|sunt|lucreaz[ăa]|locuie[șşs]te|st[ăa]|folose[șşs]te|prefer[ăa]|de[țţt]ine|se afl[ăa])",
  "(?:are|au|este|e|sunt|lucreaz[ăa]|locuie[șşs]te|st[ăa]|folose[șşs]te|prefer[ăa]|de[țţt]ine) acum",
  "[îi]n prezent",
  "actualmente",
  "actualizat(?:[ăa])?",
  "[îi]nlocuit(?:[ăa])? (?:cu|de)",
  "pe vremuri",
  "odinioar[ăa]",
  "anterior",
  "c[âa]ndva",
  "obi[șşs]nui(?:a|au|am) s[ăa]",
]
# An intention not yet carried out.
# "va" needs a verb of action: without diacritics it is also the pronoun "vă". "trebuie să" is left
# out: with "întotdeauna" it marks an instruction.
plan = [
  "pl[ăa]nuie[șşs]te",
  "pl[ăa]nuiesc",
  "pl[ăa]nuim",
  "planific[ăa]",
  "(?:are|au|am|avem) de g[âa]nd",
  "inten[țţt]ioneaz[ăa]",
  "inten[țţt]ionez",
  "inten[țţt]ion[ăa]m",
  "inten[țţt]ia",
  "vrea",
  "vreau",
  "vrem",
  "vor",
  "(?:ar|a[șşs]|am) vrea",
  "(?:dore[șşs]te|doresc|dorim) s[ăa]",
  "sper[ăa]",
  "sper",
  "sper[ăa]m",
  "vom",
  "urmeaz[ăa] s[ăa]",
  "o s[ăa]",
  "va (?:\\w+ ){0,3}(?:fi|avea|face|merge|pleca|[îi]ncepe|vizita|cump[ăa]ra|vinde|semna|lansa|livra|p[ăa]r[ăa]si|suna|trimite|[îi]nt[âa]lni|participa|[îi]ncerca|lua|rezerva|re[îi]nnoi|anula|trece|migra|actualiza|decide|termina|c[ăa]l[ăa]tori|veni|ajunge|primi|deveni)",
  "(?:s[ăa]pt[ăa]m[âa]na|luna|vara|iarna|toamna|prim[ăa]vara|lunea|mar[țţt]ea|miercurea|joia|vinerea|s[âa]mb[ăa]ta|duminica) viitoare",
  "(?:anul|trimestrul|weekendul) viitor",
  "(?:s[ăa]pt[ăa]m[âa]na|luna) care vine",
  "m[âa]ine",
  "poim[âa]ine",
  "[îi]n cur[âa]nd",
  "mai t[âa]rziu (?:s[ăa]pt[ăa]m[âa]na aceasta|luna aceasta|anul acesta)",
  "nu uita s[ăa]",
  "[țţt]ine minte s[ăa]",
  "mai trebuie s[ăa]",
  "(?:scopul|obiectivul) este",
]
preference = [
  "prefer[ăa]",
  "prefer",
  "prefer[ăa]m",
  "preferat(?:[ăa]|e|ul|a)?",
  "preferin[țţt](?:[ăa]|a|e|ele)",
  "(?:[îi]i|le|[îi]mi|ne|[îi][țţt]i) plac(?:e)?",
  "(?:[îi]i|le|[îi]mi|ne|[îi][țţt]i) pl[ăa]cea",
  "ador[ăa]",
  "ador",
  "iube[șşs]te",
  "iubesc",
  "savureaz[ăa]",
  "se bucur[ăa] de",
  "ur[ăa][șşs]te",
  "ur[ăa]sc",
  "detest[ăa]",
  "detest",
  "favorit(?:[ăa]|ul|a|e)?",
  "mai degrab[ăa]",
  "nu suport[ăa]",
  "nu suport",
  "nu (?:poate|pot) suferi",
  "alergic(?:[ăa])? la",
  "pasionat(?:[ăa])? de",
  "(?:[îi]i|le|[îi]mi) displace",
]
# Only at the start of the statement.
# "nu" starts a negative imperative ("Nu trimite …").
instruction_start = [
  "[îi]ntotdeauna",
  "totdeauna",
  "mereu",
  "niciodat[ăa]",
  "nu",
  "asigur[ăa]-te",
  "asigura[țţt]i-v[ăa]",
  "ai grij[ăa]",
  "ave[țţt]i grij[ăa]",
  "evit[ăa]",
  "evita[țţt]i",
  "folose[șşs]te",
  "folosi[țţt]i",
  "utilizeaz[ăa]",
  "utiliza[țţt]i",
  "ruleaz[ăa]",
  "rula[țţt]i",
  "verific[ăa]",
  "verifica[țţt]i",
  "te rog",
]
instruction = [
  "trebuie(?: \\w+){0,3} (?:[îi]ntotdeauna|mereu|niciodat[ăa])",
  "(?:[îi]ntotdeauna|mereu|niciodat[ăa]) trebuie",
]
# Past events: a dated reference or a completed action.
# Participles of the compound past ("a cumpărat"). "început" and "angajat" alone are also nouns.
event = [
  "ieri",
  "alalt[ăa]ieri",
  "(?:s[ăa]pt[ăa]m[âa]na|luna|vara|iarna|toamna|prim[ăa]vara|noaptea|lunea|mar[țţt]ea|miercurea|joia|vinerea|s[âa]mb[ăa]ta|duminica) trecut[ăa]",
  "(?:anul|weekendul|trimestrul) trecut",
  "acum (?:\\d+|o|un|dou[ăa]|doi|trei|patru|cinci|[șşs]ase|c[âa]teva|c[âa][țţt]iva) (?:de )?(?:zi|zile|s[ăa]pt[ăa]m[âa]n[ăa]|s[ăa]pt[ăa]m[âa]ni|lun[ăa]|luni|an|ani)",
  "[îi]n urm[ăa]",
  "cump[ăa]rat",
  "v[âa]ndut",
  "vizitat",
  "mers",
  "plecat",
  "adoptat",
  "(?:a|au|am|a[țţt]i) [îi]nceput",
  "terminat",
