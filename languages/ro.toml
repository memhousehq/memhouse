  "aceste", "acești", "aceşti", "acesti", "este", "sunt", "avea", "avut", "acum", "acolo", "erau",
  "fost", "despre", "decât", "decat", "atunci", "când", "cand", "care", "ceea", "pentru", "dintre",
  "între", "intre", "după", "dupa", "înainte", "inainte", "până", "pana", "prin", "către", "catre",
