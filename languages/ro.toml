  "sotie", "soția", "soţia", "sotia", "soț", "soţ", "sot", "soțul", "soţul", "sotul", "partener",
  "parteneră", "partenera", "fiu", "fiul", "fiică", "fiica", "copil", "copii", "copiii", "prieten",
  "prietenă", "prietena", "prieteni", "coleg", "colegă", "colega", "șef", "şef", "sef", "șefă",
  "şefă", "sefa", "manager", "echipă", "echipa", "vecin", "vecină", "vecina", "văr", "var",
  "verișoară", "verişoară", "verisoara", "unchi", "mătușă", "mătuşă", "matusa", "bunică", "bunica",
  "bunic", "bunicul", "iubit", "iubită", "iubita", "câine", "caine", "câinele", "cainele", "pisică",
  "pisica", "animal",
]

[values]
