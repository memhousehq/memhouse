]
# "nouă" is left out of the number words: it is nine, but also "new" (feminine) and "to us".
quantity = [
  "zero", "unu", "una", "doi", "două", "doua", "trei", "patru", "cinci", "șase", "şase", "sase",
  "șapte", "şapte", "sapte", "opt", "zece", "unsprezece", "doisprezece", "douăsprezece",
