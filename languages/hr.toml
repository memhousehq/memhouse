# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# "15h", "90-ih", "3-eg"
number_suffixes = ["h", "-?ih", "-?og", "-?eg", "-?om", "-?oj", "-?im"]
# The case forms a question uses: "u subotu", "prošle subote". The instrumental ("subotom", on
# Saturdays) is habitual, not a date, and is left out.
weekdays = [
  ["ponedjelj(?:ak|ka|ku)"], ["utor(?:ak|ka|ku)"], ["srijed(?:a|e|u|i)"], ["četvrt(?:ak|ka|ku)"],
  ["pet(?:ak|ka|ku)"], ["subot(?:a|e|u|i)"], ["nedjelj(?:a|e|u|i)"],
]
# The Croatian month names, in the nominative, genitive ("3. lipnja") and locative ("u lipnju").
months = [
  ["siječ(?:anj|nja|nju|njem)"], ["veljač(?:a|e|i|u|om)"], ["ožuj(?:ak|ka|ku|kom)"],
  ["trav(?:anj|nja|nju|njem)"], ["svib(?:anj|nja|nju|njem)"], ["lip(?:anj|nja|nju|njem)"],
  ["srp(?:anj|nja|nju|njem)"], ["kolovoz(?:a|u|om)?"], ["ruj(?:an|na|nu|nom)"],
  ["listopad(?:a|u|om)?"], ["studen(?:i|og|oga|om|ome|im)"], ["prosin(?:ac|ca|cu|cem)"],
]
month_names = [
  "siječanj", "siječnja", "siječnju", "veljača", "veljače", "veljači", "veljaču", "ožujak", "ožujka",
