  "rujnu", "listopad", "listopada", "listopadu", "studeni", "studenog", "studenoga", "studenom",
  "prosinac", "prosinca", "prosincu",
]
# "prije dva tjedna"
ago = ["prije\\s+{num}\\s+{unit}"]
# "u posljednja tri mjeseca", "u posljednjih mjesec dana", "prošli tjedan"; "prije tjedan dana"
# (no number) is read as the week up to now.
past = [
  "(?:prošl|protekl|posljednj|zadnj)\\w{1,3}\\s+(?:{num}\\s+)?{unit}",
  "prije\\s+{unit}\\s+dana",
]
# "prošli mjesec" and "prošle godine" are the previous calendar month and year.
calendar = ["^prošl"]
last_weekday = ["(?:prošl\\w{1,3}|protekl\\w{1,3}|ov(?:aj|og|oga|e|u|a)|u|na)\\s+{weekday}"]
strictly_before = ["^(?:prošl|protekl)"]
last_weekend = ["(?:prošl|protekl)\\w{1,3}\\s+vikend(?:a|u)?"]
yesterday = ["jučer"]
this = ["ov(?:aj|og|oga|e|u|om|oj|a)\\s+{unit}"]
