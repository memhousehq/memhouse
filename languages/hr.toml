# The Croatian language pack. Draft: it passes its test set (languages/tests/hr.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "hr"
name = "Croatian"
status = "draft"
text_search = "simple"

[detect]
words = [
  "i", "u", "je", "se", "na", "da", "su", "za", "od", "s", "sa", "a", "o", "koji", "koja", "koje",
  "što", "to", "ne", "nije", "kao", "ali", "ili", "iz", "do", "po", "će", "bi", "sam", "smo", "ste",
  "bio", "bila", "bilo", "biti", "ima", "još", "već", "samo", "kako", "kada", "gdje", "tko", "zašto",
  "on", "ona", "oni", "mi", "vi", "ja", "ti", "moj", "moja", "njegov", "njezin", "naš", "ovaj", "ova",
  "ovo", "taj", "li", "pri", "kod", "nakon", "prije", "između", "jer", "ako", "nego", "korisnik",
]
letters = "čćžšđ"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
