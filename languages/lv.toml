# The words that split a question about several things into sub-queries.
[query]
or = ["vai"]
or_not = ["vai ne", "vai nē"]
between = ["starp\\s+(.+?)\\s+un\\s+(.+?)"]
clause = ["kad", "pēc tam,? kad", "pirms tam,? kad", "kopš", "kamēr", "līdz"]
lead = [
