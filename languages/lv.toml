# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# Ordinals are written with a full stop ("3."); "3-ajā".
number_suffixes = ["\\.", "-?(?:ais|ajā|ajam|ā|o|os)"]
# "sestdien" (on Saturday) is the adverb; the other forms are the noun's cases.
weekdays = [
  ["pirmdien(?:a|ā|u|as)?"], ["otrdien(?:a|ā|u|as)?"], ["trešdien(?:a|ā|u|as)?"],
  ["ceturtdien(?:a|ā|u|as)?"], ["piektdien(?:a|ā|u|as)?"], ["sestdien(?:a|ā|u|as)?"],
  ["svētdien(?:a|ā|u|as)?"],
]
# The genitives "marta" and "maija" are left out: Marta and Maija are also women's names.
months = [
  ["janvār(?:is|ī|a|i)"], ["februār(?:is|ī|a|i)"], ["mart(?:s|ā|u)"], ["aprīl(?:is|ī|i)", "aprīļa"],
  ["maij(?:s|ā|u)"], ["jūnij(?:s|ā|a|u)"], ["jūlij(?:s|ā|a|u)"], ["august(?:s|ā|a|u)"],
  ["septembr(?:is|ī|a|i)"], ["oktobr(?:is|ī|a|i)"], ["novembr(?:is|ī|a|i)"], ["decembr(?:is|ī|a|i)"],
]
month_names = [
  "janvāris", "janvārī", "janvāra", "februāris", "februārī", "februāra", "marts", "martā", "marta",
  "aprīlis", "aprīlī", "aprīļa", "maijs", "maijā", "maija", "jūnijs", "jūnijā", "jūnija", "jūlijs",
  "jūlijā", "jūlija", "augusts", "augustā", "augusta", "septembris", "septembrī", "septembra",
  "oktobris", "oktobrī", "oktobra", "novembris", "novembrī", "novembra", "decembris", "decembrī",
  "decembra",
]
# "pirms divām nedēļām"
ago = ["pirms\\s+{num}\\s+{unit}"]
# "pēdējā mēneša laikā", "pēdējo trīs mēnešu laikā", "pagājušajā nedēļā", "pagājušogad"; and
# "pirms nedēļas" (a week ago, no number), read as the time since then. The first entry has no
# {unit}: it keeps "pagājušajā nedēļas nogalē" (last weekend) from being read as "last week".
past = [
  "(?:(?:pagājuš|aizvadīt|iepriekšēj|pēdēj)\\w+|pirms)\\s+nedēļas\\s+nogal\\w+",
  "(?:pēdēj\\w+|pagājuš\\w+|aizvadīt\\w+|iepriekšēj\\w+)\\s+(?:{num}\\s+)?{unit}",
  "pagājušo{unit}",
  "pirms\\s+{unit}",
]
# "pagājušajā mēnesī" and "pagājušajā gadā" are the previous calendar month and year.
calendar = ["^(?:pagājuš|iepriekšēj)"]
# "pagājušajā sestdienā", "šo sestdien", and the bare "sestdien" (on Saturday).
last_weekday = ["(?:(?:pagājuš\\w+|aizvadīt\\w+|šo|šajā)\\s+)?{weekday}"]
strictly_before = ["^(?:pagājuš|aizvadīt)"]
last_weekend = ["(?:pagājuš\\w+|aizvadīt\\w+)\\s+(?:nedēļas\\s+nogal\\w+|brīvdien\\w+)"]
yesterday = ["vakar"]
# "šajā nedēļā", and the one-word adverbs "šonedēļ", "šomēnes", "šogad".
this = ["(?:šajā|šī|šo|šai|šīs)\\s+{unit}", "šo{unit}"]
# "februārī", "3. jūnijā"
in_month = ["(?:{day}\\.\\s*)?{month}"]

