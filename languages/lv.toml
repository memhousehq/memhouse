# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  "\\b(?:ignorē(?:jiet|t)?|neņem(?:iet)? vērā|aizmirsti(?:et)?|neievēro(?:jiet)?|atmet(?:iet)?|pārraksti(?:et)?)\\b[^.\\n]{0,40}\\b(?:iepriekšēj\\w+|agrāk\\w+|līdzšinēj\\w+|augstāk\\w*|vis(?:us|as|u|iem|ām)|sav(?:us|as|u|iem|ām)|tav(?:us|as|u|iem|ām)|jūsu|jebkur\\w+)\\b[^.\\n]{0,25}\\b(?:norādījum\\w+|instrukcij\\w+|noteikum\\w+|vadlīnij\\w+|uzvedn\\w+|rīkojum\\w+|prompt\\w*)",
]
role_hijack = [
  "\\b(?:tu tagad esi|tagad tu esi|jūs tagad esat|tagad jūs esat|(?:turpmāk|no š[īā] brīža|no šī mirkļa|no šodienas),? (?:tu|jūs|atbildi(?:et)?|runā(?:jiet)?|raksti(?:et)?|uzvedies|rīkojies)\\b|(?:uzvedies|uzvedieties|rīkojies|rīkojieties|izliecies|izliecieties) kā (?:\\w+ )?(?:neierobežot\\w+|necenzēt\\w+|bez ierobežojumiem)|izliecies,? ka tev nav (?:nekādu )?(?:noteikumu|ierobežojumu))",
]
system_prompt = [
  "\\b(?:parādi(?:et)?|atklāj(?:iet)?|izdrukā(?:jiet)?|izvadi(?:et)?|pasaki(?:et)?|nosauc(?:iet)?|uzraksti(?:et)?|nopludini(?:et)?)\\b[^.\\n]{0,40}\\b(?:sistēmas (?:uzvedn\\w+|instrukcij\\w+|norādījum\\w+|ziņojum\\w+|prompt\\w*)|system prompt\\w*|slēpt\\w+ (?:instrukcij\\w+|norādījum\\w+)|izstrādātāja ziņojum\\w+)",
