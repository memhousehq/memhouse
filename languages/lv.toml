# The Latvian language pack. Draft: it passes its test set (languages/tests/lv.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "lv"
name = "Latvian"
status = "draft"
text_search = "simple"

[detect]
words = [
  "un", "ir", "ka", "ar", "no", "uz", "par", "tas", "tā", "to", "es", "tu", "viņš", "viņa", "mēs",
  "jūs", "viņi", "kas", "ko", "kur", "kad", "kā", "vai", "bet", "nav", "bija", "būs", "arī", "vēl",
  "jau", "tikai", "ļoti", "pie", "pēc", "pirms", "līdz", "bez", "caur", "starp", "mans", "mana",
  "tavs", "savs", "savu", "mūsu", "viņu", "šis", "šī", "šo", "tie", "tās", "lai", "ja", "tad",
  "tāpēc", "kāpēc", "nē", "jā", "var", "gan", "pa", "tagad", "esmu", "lietotājs", "lietotāja",
]
letters = "āčēģīķļņšūž"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
speculation = [
  "varbūt",
  "iespējams",
  "laikam",
  "droši vien",
  "visticamāk",
  "šķiet",
  "izskatās",
  "liekas",
  "varētu",
  "var būt",
  "varēja būt",
  "domāju",
  "pieļauju",
  "nojaušu",
  "nezinu,? vai",
  "neesmu pārliecināt[sa]",
  "nav skaidrs,? vai",
  "baum(?:as|o|u|ām)",
  "runā,? ka",
  "it kā",
  "esot",
  "acīmredzot",
  "teorētiski",
  "hipotētiski",
  "apsver(?:u|am)?",
  "prāto(?:ju|jam)?",
  "domā(?:ju|jam)? par",
  "ja (?:\\w+ ){0,5}(?:būtu|gribētu)",
]
# A change to something stored before. Past forms only for "moved" and "switched": the
# infinitive appears in plans ("plāno pārcelties").
correction = [
  "patiesībā",
  "īstenībā",
  "labojums",
  "precizējums",
  "kļūdījos",
  "vairs",
  "tā vietā",
  "nevis",
  "mainīj(?:ās|ies|usies|ušies)",
  "nomainīj(?:a|u|ām)",
  "pārgāj(?:a|u|ām) (?:uz|pie)",
  "pārcēl(?:ās|os|āmies)",
  "pārcēl(?:ies|usies|ušies)",
  "pārvāc(?:ās|os|āmies)",
  "pārvāc(?:ies|ušies)",
  "pārvākusies",
  "izvāc(?:ās|os|āmies)",
  "tagad",
  "atjaunināt[sa] uz",
  "aizstāt[sa] ar",
  "agrāk",
]
# An intention not yet carried out. The future tense is one word in Latvian ("sāks"), so the
# common verbs are listed with their future endings. The debitive ("jānopērk") is left out: it
# also states standing rules ("vienmēr jābūt").
plan = [
  "plāno(?:ju|jam|jat)?",
  "plānots",
  "ieplānoj(?:a|u|is|usi|uši)",
  "ieplānot[sa]",
  "grib(?:u|i|am|at)?",
  "gribētu",
  "vēl(?:as|os|amies)",
  "vēlētos",
  "iecerēj(?:a|u|is|usi|uši)",
  "nodom(?:s|u|ā)",
  "gras(?:ās|os|āmies)",
  "tais(?:ās|os|āmies)",
  "gatavoj(?:as|os|amies)",
  "cer(?:u|am)?",
  "mērķis ir",
  "(?:sāk|apmeklē|pārcel|brauk|aizbrauk|lido|ie|aizie|pārie|do|pirk|nopirk|parakstī|izlaidī|pievieno|piezvanī|nosūtī|tik|satik|piedalī|mēģinā|pamēģinā|rezervē|pagarinā|atcel|atjauninā|pārskatī|izlem|pabeig|beig|pārdo|atgriezī)(?:s|šu|si|sim|siet|sies|šos|simies)",
  "(?:nākam|nākoš)\\w+ (?:nedēļ\\w+|mēne\\w+|gad\\w+|ceturksn\\w+|(?:pirm|otr|treš|ceturt|piekt|sest|svēt)dien\\w*|nedēļas nogal\\w+|pavasar\\w+|vasar\\w+|ruden\\w+|ziem\\w+)",
  "nākamnedēļ",
  "nākammēnes",
  "nākamgad",
  "nākošgad",
  "rīt",
  "parīt",
  "drīzumā",
  "vēlāk (?:šonedēļ|šomēnes|šogad|šajā nedēļā|šajā mēnesī|šajā gadā)",
  "neaizmirsti(?:et)?",
  "atceries",
]
preference = [
  "priekšrok\\w+",
  "patīk",
  "nepatīk",
  "patika",
  "garšo",
  "negaršo",
  "mīl(?:u|am)?",
  "dievin(?:a|u|ām)",
  "ienīst(?:u|am)?",
  "necieš(?:u|am)?",
  "nevar(?:u|am)? ciest",
  "mīļāk\\w+",
  "iecienīt\\w+",
  "labprāt(?:āk)?",
  "alerģisk\\w+",
  "alerģija pret",
  "aizraujas ar",
]
# Only at the start of the statement. "ne…i" / "ne…iet" is the negative imperative ("nesūti").
instruction_start = [
  "vienmēr", "nekad", "nekādā gadījumā", "pārliecinies", "pārliecinieties", "lūdzu", "noteikti",
  "obligāti", "izvairies", "izvairieties", "izmanto(?:jiet)?", "lieto(?:jiet)?", "nedrīkst",
  "ne\\w{2,}(?:i|iet)",
]
instruction = [
  "vienmēr (?:ir )?jā\\w+",
  "jā\\w+ vienmēr",
  "vienmēr (?:vajag|vajadzētu)",
  "nekad (?:nedrīkst|nevajag|nevajadzētu)",
  "(?:nedrīkst|nevajag|nevajadzētu) nekad",
]
# Past events: a dated reference or a completed action (third person, first person, plural).
event = [
  "vakar",
  "aizvakar",
  "pērn",
  "pagājuš\\w+ (?:nedēļ\\w+|mēne\\w+|gad\\w+|nakt\\w+|(?:pirm|otr|treš|ceturt|piekt|sest|svēt)dien\\w*|pavasar\\w+|vasar\\w+|ruden\\w+|ziem\\w+)",
  "pagājušonedēļ",
  "pagājušogad",
  "pirms \\d+ (?:dien\\w+|nedēļ\\w+|mēneš\\w+|gad\\w+)",
  "pirms (?:\\w+ )?(?:dienas|dienām|nedēļas|nedēļām|mēneša|mēnešiem|gada|gadiem)",
  "(?:nopirk|pirk|pārdev|apciemoj|apmeklēj|aizgāj|aizbrauc|adoptēj|sāk|uzsāk|pabeidz|beidz|absolvēj|parakstīj|pamet|satik|saņēm|izlaid|piegādāj|pagarināj|atcēl|samaksāj|rezervēj|pasūtīj|atgriez|ceļoj|uzvarēj|zaudēj|pazaudēj|iedev|paņēm|izdarīj|piedzim|nomir|svinēj|nosvinēj|atlaid|publicēj|nosūtīj|atjaunināj)(?:a|u|ām)",
  "(?:dev|pievienoj|satik|tik|piedalīj|apprecēj|atgriez|iegādāj|ierad)(?:ās|os|āmies)",
]

[relations]
# The person related to comes first, in the genitive: "Dana ir Jāņa vadītāja".
relationship = [
  "\\b(?:ir|bija|kļuva par) (?:tagad )?(?:\\w+ ){1,2}(?:vadītāj[sa]|priekšnie(?:ks|ce)|kolēģ(?:is|e)|sieva|vīrs|partner(?:is|e)|draugs|draudzene|brālis|māsa|māte|mamma|tēvs|tētis|dēls|meita|brālēns|māsīca|onkulis|tante|kaimiņ(?:š|iene)|mentor[se]|klient[se]|piegādātāj[sa]|īpašnie(?:ks|ce)|dibinātāj[sa]|direktor[se])\\b",
  "\\b(?:atskaitās|ir pakļaut[sa]|strādā pie|strādā ar|strādā kopā ar|ir precēj\\w+ ar|ir saderināj\\w+ ar)\\b",
]
