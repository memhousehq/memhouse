]
# "június 3-án", "2026. június 3."
dates = [
  "\\b(?:jan|feb|márc|ápr|máj|jún|júl|aug|szept|okt|nov|dec)\\w*\\.?\\s+\\d{1,2}(?:-?(?:án|én|jén|ján|ai|ei|a|e|i))?",
  "\\b\\d{4}\\.\\s?\\d{1,2}\\.\\s?\\d{1,2}\\.?",
]

