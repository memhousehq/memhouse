nyolc = 8
kilenc = 9
"tíz" = 10
tizenegy = 11
"tizenkét" = 12
"tizenkettő" = 12

[time.units]
day = ["nap(?:pal|ot|on|ig|ban|ok|okban)?"]
week = ["hét(?:tel|en|ben|et|ig)?", "het(?:ek|ekben|ekkel)?"]
month = ["hónap(?:pal|ban|ot|ig|ok|okban)?"]
year = ["év(?:vel|ben|et|ig|ek|ekben)?"]

# The words that split a question about several things into sub-queries.
[query]
or = ["vagy"]
or_not = ["vagy nem", "vagy sem"]
# "A és B között": the postposition follows, so each side is one word.
between = ["(\\S+)\\s+és\\s+(\\S+)\\s+között"]
clause = ["amikor", "mielőtt", "miután", "mióta", "amíg", "miközben"]
lead = [
  "mi", "mit", "milyen", "melyik", "mely", "melyek", "ki", "kit", "kivel", "kinek", "kik", "mikor",
  "hol", "hová", "hova", "honnan",
  "hány\\s+\\w+", "mennyi(?:\\s+(?:ideig|idős))?", "milyen\\s+(?:gyakran|régen|sokáig)",
  "hogyan", "miért",
]
article = ["a", "az", "egy", "az én", "a mi", "ez", "ezek", "azok"]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
# The verb can come first or last: "hagyd figyelmen kívül az összes korábbi utasítást", "az összes
# korábbi utasítást hagyd figyelmen kívül".
override = [
