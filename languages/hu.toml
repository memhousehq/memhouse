# SPDX-License-Identifier: Apache-2.0
# The Hungarian language pack. Draft: it passes its test set (languages/tests/hu.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
# Hungarian inflects by suffix and verbs take prefixes: markers are stems with a bounded class of
# endings (both conjugations), and the time templates take the unit, weekday and month in the case
# the phrase needs ("két héttel ezelőtt", "múlt hónapban", "szombaton", "februárban").
format = 1
language = "hu"
name = "Hungarian"
status = "draft"
text_search = "hungarian"

[detect]
words = [
  "a", "az", "és", "hogy", "nem", "is", "egy", "van", "volt", "de", "meg", "már", "még", "csak",
  "ez", "azt", "ezt", "mint", "ha", "vagy", "én", "te", "ő", "mi", "ti", "ők", "mit", "ki", "hol",
  "mikor", "miért", "hogyan", "melyik", "aki", "ami", "amely", "volna", "lesz", "lehet", "kell",
  "majd", "pedig", "mert", "így", "úgy", "ott", "itt", "akkor", "most", "után", "előtt", "alatt",
  "között", "szerint", "minden", "nagyon", "nincs", "sem", "el", "be", "fel", "le", "felhasználó",
]
letters = "áéíóöőúüű"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# The potential suffix ("költözhetett", might have moved) is not a marker: "-hat/-het" is too
# common an ending to read as a hedge.
speculation = [
  "talán",
  "esetleg",
  "lehet,? hogy",
  "lehetséges,? hogy",
  "elképzelhető",
  "valószínűleg",
  "valószínű,? hogy",
  "feltehetően",
  "feltehetőleg",
  "vélhetően",
  "alighanem",
  "bizonyára",
  "szerintem",
  "azt hiszem",
  "úgy hiszem",
  "úgy gondolom",
  "úgy vélem",
  "gyanítom",
  "sejtem",
  "tippem szerint",
  "nem (?:vagyok )?biztos",
  "nem tudom,? hogy",
  "kíváncsi vagyok,? hogy",
  "pletyk\\w+",
  "híresztelés\\w*",
  "úgy hírlik",
  "állítólag",
  "úgy tűnik",
  "úgy látszik",
  "látszólag",
  "hipotetikusan",
  "elméletileg",
  "elvileg",
  "fontolgat\\w*",
  "mérlegel(?:i|ik|em|jük)",
  "gondolkod(?:ik|nak|om|unk)",
  "gondolkoz(?:ik|nak|om|unk)",
  "ha (?:\\w+ ){0,5}(?:lenn[eé]\\w{0,3}|voln[aá]\\w{0,3}|tudn[aá]\\w{0,3}|akarn[aá]\\w{0,3}|lehetne|kellene)",
]
# A change to something stored before.
correction = [
  "valójában",
  "igazából",
  "helyesbít\\w*",
  "kiigazítás",
  "pontosítás",
  "tévedtem",
  "rosszul tudtam",
  "már nem",
  "már nincs(?:en|enek)?",
  "többé",
  "helyett",
  "ehelyett",
  "megváltoz(?:ott|tak)",
  "megváltoztat(?:ta|ták)",
  "(?:át)?vált(?:ott|ottak|ottam|ottunk)",
  "(?:el|át|be|ki|vissza|össze|oda|haza)?költöz(?:ött|tek|tem|tünk)",
  "áttért(?:ek|em|ünk)?",
  "átállt(?:ak|am|unk)?",
  "most",
  "mostanra",
  "mostanában",
  "immár",
  "időközben",
  "frissítve",
  "frissült",
  "lecserél(?:te|ték|tem|tük)",
  "felváltotta",
  "korábban",
  "régebben",
  "azelőtt",
  "régen",
]
# An intention not yet carried out.
plan = [
  "tervez(?:i|ik|em|ek|nek|ünk|zük|te|ték|tem|tük)?",
  "terv(?:e|ei|ük|em|ünk)? (?:az,? hogy|szerint)",
  "tervben van",
  "szándék\\w*",
  "akar(?:ja|ják|om|ok|unk|juk|nak|sz)?",
  "szeretn(?:e|é|ék|ének|énk)",
  "remél(?:i|ik|em|ek|jük|nek|ünk)?",
  # The future: "fog" with an infinitive in "-ni", in either order.
  "fog(?:ja|ják|ok|om|unk|juk|nak)? (?:\\w+ ){0,3}\\w+ni",
  "\\w+ni fog(?:ja|ják|ok|om|unk|juk|nak)?",
  "készül (?:\\w+ ){0,3}\\w+ni",
  "(?:a )?jövő (?:héten|hónapban|évben|negyedévben|hétvégén|hétfőn|kedden|szerdán|csütörtökön|pénteken|szombaton|vasárnap|tavasszal|nyáron|ősszel|télen)",
  "jövőre",
  "(?:a )?következő (?:héten|hónapban|évben|negyedévben|hétvégén|hétfőn|kedden|szerdán|csütörtökön|pénteken|szombaton|vasárnap|tavasszal|nyáron|ősszel|télen)",
  "holnap",
  "holnapután",
  "hamarosan",
  "később (?:a héten|ebben a hónapban|idén|az idén)",
  "ne felejts\\w*",
  "kell még",
  "még (?:\\w+ ){0,2}kell",
  "a cél(?:ja|unk)? az",
]
preference = [
  "előnyben részesít\\w*",
  "részesít\\w* (?:\\w+ ){0,3}előnyben",
  "preferál\\w*",
  "preferenci\\w*",
  "szeret(?:i|ik|em|ek|jük|ünk|nek)?",
  "imád(?:ja|ják|om|ok|unk|juk|nak)?",
  "kedvel(?:i|ik|em|ek|jük|nek)?",
  "élvez(?:i|ik|em|ek|zük|nek)?",
  "utál(?:ja|ják|om|ok|juk|nak)?",
  "gyűlöl(?:i|ik|öm|ök|jük|nek)?",
  "rajong(?:ok|unk|anak)?",
  "kedvenc\\w*",
  "inkább",
  "szívesen",
  "szívesebben",
  "legszívesebben",
  "ki nem állhat\\w*",
  "nem bírja",
  "allergiás(?:ak)?",
]
# Only at the start of the statement.
instruction_start = [
  "mindig", "soha", "sose", "sohase", "ne", "kérlek", "kérem", "győződj(?:ön)? meg", "ügyelj(?:en)?",
  "figyelj(?:en)?", "kerüld", "kerülje", "használd", "használja", "használj(?:on)?", "futtasd",
  "futtassa", "futtass(?:on)?", "tilos", "kötelező",
]
instruction = [
  "mindig (?:\\w+ ){0,3}kell",
  "kell mindig",
  "soha(?:sem)? ne",
  "soha(?:sem)? (?:\\w+ ){0,2}(?:szabad|lehet)",
  "mindig kötelező",
]
# Past events: a dated reference or a completed action. Verbs: optional prefix, the past stem and
# the endings of both conjugations.
event = [
  "tegnap",
  "tegnapelőtt",
  "(?:a )?múlt (?:héten|hónapban|évben|éjjel|hétvégén|hétfőn|kedden|szerdán|csütörtökön|pénteken|szombaton|vasárnap|tavasszal|nyáron|ősszel|télen)",
  "tavaly",
  "ezelőtt",
  "\\d+ (?:nappal|héttel|hónappal|évvel) korábban",
