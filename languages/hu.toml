# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# The case endings written onto a day number: "3-án", "5-én", "12-i", "3-ig".
number_suffixes = ["-?(?:án|én|jén|ján|ai|ei|a|e|i|ig|től|tól|kor|ra|re|as|es|os|ös)"]
# Stems: the templates add the ending ("szombaton", "szerdán").
weekdays = [["hétfő"], ["kedd"], ["szerd[aá]"], ["csütörtök"], ["péntek"], ["szombat"], ["vasárnap"]]
months = [
  ["január(?:ban|i|tól|ig|ra)?"], ["február(?:ban|i|tól|ig|ra)?"], ["március(?:ban|i|tól|ig|ra)?"],
  ["április(?:ban|i|tól|ig|ra)?"], ["május(?:ban|i|tól|ig|ra)?"], ["június(?:ban|i|tól|ig|ra)?"],
  ["július(?:ban|i|tól|ig|ra)?"], ["augusztus(?:ban|i|tól|ig|ra)?"],
  ["szeptember(?:ben|i|től|ig|re)?"], ["október(?:ben|i|től|ig|re)?"],
  ["november(?:ben|i|től|ig|re)?"], ["december(?:ben|i|től|ig|re)?"],
]
month_names = [
  "január", "januárban", "januári", "február", "februárban", "februári", "március", "márciusban",
  "márciusi", "április", "áprilisban", "áprilisi", "május", "májusban", "májusi", "június",
  "júniusban", "júniusi", "július", "júliusban", "júliusi", "augusztus", "augusztusban",
  "augusztusi", "szeptember", "szeptemberben", "szeptemberi", "október", "októberben", "októberi",
  "november", "novemberben", "novemberi", "december", "decemberben", "decemberi",
]
# "két héttel ezelőtt": the postposition follows. "két hete", "három napja", "egy éve": the unit
# with a possessive ending says the same (the unit stems "het", "nap", "hónap", "év" plus e/ja).
ago = ["{num}\\s+{unit}\\s+(?:ezelőtt|korábban)", "{num}\\s+{unit}(?:e|ja)"]
# "az elmúlt három hónapban", "múlt héten"
past = ["(?:elmúlt|utóbbi|utolsó|legutóbbi|múlt|előző)\\s+(?:{num}\\s+)?{unit}"]
# "múlt hónapban" and "múlt évben" are the previous calendar month and year; "az elmúlt hónapban"
# is the last thirty days.
calendar = ["^(?:múlt|előző)"]
# "múlt szombaton", "szombaton". A bare "vasárnap" (it takes no ending) is not read.
last_weekday = ["(?:múlt|előző|elmúlt|most)\\s+(?:hét\\s+)?{weekday}(?:n|en|on|ön)?", "{weekday}(?:n|en|on|ön)"]
strictly_before = ["^(?:múlt|előző|elmúlt)"]
last_weekend = ["(?:múlt|előző|elmúlt)\\s+hétvég(?:én|e|i)"]
yesterday = ["tegnap", "tegnapi"]
# "ezen a héten", "ebben a hónapban", "ebben az évben"; "a héten" alone also means this week.
this = ["(?:ezen\\s+a|ezen\\s+az|ebben\\s+a|ebben\\s+az|e|a\\s+mostani|a\\s+jelenlegi)\\s+{unit}", "a\\s+{unit}en"]
# "februárban", "június 3-án"
in_month = ["{month}(?:\\s+{day}\\b)?"]

