  "visszaad(?:ott|ta|ták|tam|tuk)",
  "(?:el)?utaz(?:ott|tak|tam|tunk)",
  "(?:meg)?nyer(?:t|te|tek|ték|tem|tük)",
  "(?:el)?veszít(?:ett|ette|ették|ettem|ettük)",
  "elveszt(?:ette|ették|ettem|ettük)",
  "ad(?:ta|tak|ták|tam|tuk)",
  "(?:meg)?csinál(?:t|ta|tak|ták|tam|tuk)",
  "szület(?:ett|tek|tem)",
  "meghalt",
  "elhunyt",
  "(?:meg)?ünnepel(?:t|te|tek|ték|tem|tük)",
