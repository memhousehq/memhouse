  "járt(?:ak|am|unk)?",
  "örökbe fogad(?:ott|ta|tak|ták|tam|tuk)",
  "(?:el|meg)?kezd(?:ett|te|tek|ték|tem|tük)",
  "befejez(?:ett|te|tek|ték|tem|tük)",
  "elvégez(?:te|ték|tem|tük)",
  "végzett",
  "aláír(?:t|ta|tak|ták|tam|tuk)",
  "csatlakoz(?:ott|tak|tam|tunk)",
  "(?:be|ki)lép(?:ett|tek|tem|tünk)",
  "távoz(?:ott|tak)",
  "elhagy(?:ta|ták|tam|tuk)",
  "találkoz(?:ott|tak|tam|tunk)",
  "diplomáz(?:ott|tak|tam|tunk)",
