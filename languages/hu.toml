[relations]
# The possessed noun carries the suffix and there is no copula: "Dana Bob főnöke." A statement
# that ends on such a noun, or gives the possessor in the dative, states a relationship.
relationship = [
  "\\b(?:főnöke|vezetője|menedzsere|kollégája|munkatársa|felesége|férje|párja|házastársa|barátnője|barátja|testvére|bátyja|öccse|nővére|húga|anyja|édesanyja|apja|édesapja|fia|lánya|unokatestvére|nagybátyja|nagynénje|szomszédja|mentora|ügyfele|beszállítója|tulajdonosa|alapítója|vezérigazgatója|kapcsolattartója|szponzora)(?:\\s+(?:volt|lett))?\\s*(?:[.!]|$)",
  "\\b\\p{L}+(?:nak|nek) (?:a |az )?(?:új )?(?:főnöke|vezetője|menedzsere|kollégája|munkatársa|felesége|férje|párja|barátnője|barátja|testvére|bátyja|öccse|nővére|húga|anyja|apja|fia|lánya|szomszédja|mentora|ügyfele|beszállítója|tulajdonosa|alapítója|kapcsolattartója)\\b",
  "\\b(?:\\p{L}+(?:nak|nek) jelent|\\p{L}+(?:nál|nél) dolgozik|együtt dolgozik|házasok|házasságban él|jegyben jár|rokona)\\b",
]
people = [
  "nővér", "nővére", "húg", "húga", "testvér", "testvére", "báty", "bátyja", "öccs", "öccse",
  "anya", "anyja", "édesanya", "édesanyja", "anyu", "apa", "apja", "édesapa", "édesapja", "apu",
  "szülő", "szülei", "szülők", "feleség", "felesége", "férj", "férje", "párja", "házastárs", "fia",
  "lánya", "gyerek", "gyereke", "gyerekei", "gyerekek", "barát", "barátja", "barátnő", "barátnője",
  "barátai", "kolléga", "kollégája", "munkatárs", "főnök", "főnöke", "csapat", "szomszéd",
  "szomszédja", "unokatestvér", "nagybácsi", "nagynéni", "nagymama", "nagypapa", "kutya",
  "kutyája", "macska", "macskája", "háziállat",
]

[values]
stop = [
  "felhasználó", "felhasználónak", "felhasználót", "hogy", "ezek", "azok", "ennek", "annak",
  "volt", "voltak", "lesz", "vannak", "ahol", "akkor", "amikor", "mikor", "melyik", "amely",
  "amelyik", "szintén", "csak", "nagyon", "néhány", "több", "legtöbb", "másik", "többi",
  "valójában", "igazából", "helyett", "többé", "költözött", "váltott", "frissítve", "korábban",
  "régebben", "jelenleg", "most", "mostanra", "helyesbítés", "vagy", "pedig", "mert", "mint",
  "nincs", "egyik", "minden",
]
value_stop = [
  "a", "az", "egy", "felhasználó", "felhasználónak", "ő", "ők", "ez", "azt", "ezt", "és", "van",
  "volt", "vannak", "voltak", "lett", "kapott", "most", "jelenleg", "nemrég", "nemrégiben",
