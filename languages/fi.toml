# The words that split a question about several things into sub-queries.
[query]
or = ["tai", "vai"]
or_not = ["vai ei", "tai ei"]
# "A:n ja B:n välillä": the postposition follows, so each side is one word.
between = ["(\\S+)\\s+ja\\s+(\\S+)\\s+väli(?:llä|ltä|ssä)"]
clause = ["kun", "ennen kuin", "sen jälkeen kun", "jälkeen", "siitä lähtien kun", "kunnes", "samalla kun"]
lead = [
  "mikä", "mitä", "mitkä", "minkä", "mistä", "mihin", "missä", "minne", "kuka", "ketkä", "kenen",
  "kenet", "milloin", "koska",
  "kuinka\\s+(?:mon\\w+\\s+\\w+|paljon|kauan|vanha|usein)?",
  "montako\\s+\\w+", "miten", "onko", "oliko", "ovatko", "olinko", "olenko",
]
article = ["minun", "meidän", "se", "tuo", "ne", "nuo", "tämä", "nämä"]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  "\\b(?:ohit(?:a|takaa)|unohda|unohtakaa|sivuut(?:a|takaa)|hylkää|hylätkää|kumoa|kumotkaa|älä välitä|älkää välittäkö|älä huomioi|älä noudata)\\b[^.\\n]{0,40}\\b(?:aiem\\w+|aikaisem\\w+|edelli\\w+|kaik\\w+|yllä olev\\w+|omat|sinun|nykyi\\w+)\\b[^.\\n]{0,25}\\b(?:ohje\\w+|sään\\w+|määräy\\w+|kehot\\w+|prompt\\w*)",
  "\\bjät(?:ä|täkää)\\b[^.\\n]{0,60}\\b(?:ohje\\w+|sään\\w+|määräy\\w+|kehot\\w+)\\b[^.\\n]{0,20}\\bhuomio(?:tta|imatta)\\b",
  "\\bjät(?:ä|täkää) huomio(?:tta|imatta)\\b[^.\\n]{0,40}\\b(?:ohje\\w+|sään\\w+|määräy\\w+|kehot\\w+)",
]
role_hijack = [
  "\\b(?:(?:sinä )?olet nyt|tästä (?:lähtien|eteenpäin|hetkestä alkaen),? (?:sinä )?(?:olet|vastaat|toimit|puhut|sinun (?:täytyy|pitää|tulee))|toimi (?:kuin |kuten )?(?:rajoittamat\\w+|sensuroimat\\w+)|esitä (?:rajoittamat\\w+|sensuroimat\\w+)|teeskentele,? (?:että|ettei) sinulla (?:ei )?ole (?:mitään |lainkaan )?(?:sääntöjä|rajoituksia))",
