# SPDX-License-Identifier: Apache-2.0
# The Finnish language pack. Draft: it passes its test set (languages/tests/fi.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
# Finnish inflects by suffix: markers are stems with a bounded class of endings, and the time
# templates take the unit, weekday and month in the case the phrase needs ("kaksi viikkoa sitten",
# "viime kuussa", "lauantaina", "helmikuussa").
format = 1
language = "fi"
name = "Finnish"
status = "draft"
text_search = "finnish"

[detect]
words = [
  "ja", "on", "ei", "että", "se", "oli", "hän", "mutta", "kun", "niin", "myös", "tai", "jos",
  "kuin", "ovat", "ole", "olla", "minä", "sinä", "me", "he", "tämä", "tuo", "ne", "nämä", "mikä",
  "mitä", "kuka", "missä", "milloin", "miksi", "miten", "joka", "jotka", "vain", "vielä", "jo",
  "nyt", "sitten", "kanssa", "mukaan", "ennen", "jälkeen", "koska", "sekä", "eli", "vaan", "en",
  "emme", "eivät", "olen", "olet", "olin", "sen", "hänen", "minun", "sinun", "meidän", "heidän",
  "tässä", "siitä", "sitä", "kaikki", "hyvin", "noin", "käyttäjä", "käyttäjän",
]
letters = "äöå"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
speculation = [
  "ehkä",
  "kenties",
  "mahdollisesti",
  "luultavasti",
  "todennäköisesti",
  "oletettavasti",
  "varmaan(?:kin)?",
  "kai",
  "saatta(?:a|vat|isi|isivat|nee|nevat)",
  "saattanut",
  "voi(?:si)? olla",
  "taita(?:a|vat)",
  "luulen",
  "luulisin",
  "luullakseni",
  "uskoakseni",
  "uskon,? että",
  "arvelen",
  "epäilen",
  "veikkaan",
  "mietin,? (?:onko|pitäisikö|kannattaako)",
  "en ole varma",
  "ei ole varmaa",
  "epävarma[at]?",
  "huhu(?:n|a|t|ja|jen|taan)?",
  "kuulemma",
  "ilmeisesti",
  "nähtävästi",
  "tiettävästi",
  "väitetysti",
  "hypoteettisesti",
  "teoriassa",
  "harkitse(?:e|vat|n|mme)",
  "harkin(?:nut|neet)",
  "mietti(?:i|vät) (?:\\w+ ){0,3}\\w+mist[aä]",
  "jos (?:\\w+ ){0,4}\\w+isi(?:n|t|mme|tte|vat|vät)?",
]
# A change to something stored before.
correction = [
  "itse asiassa",
  "oikeastaan",
  "korjaus",
  "oikaisu",
  "olin väärässä",
  "erehdyin",
  "enää",
  "sijaan",
  "sijasta",
  "on muuttunut",
  "ovat muuttuneet",
  "muuttui(?:vat)?",
  "muut(?:ti|tivat|in|imme|tanut|taneet)",
  "vaiht(?:oi|oivat|anut|aneet)",
  "vaihdoin",
  "siirty(?:i|ivät|nyt|neet)",
  "nyt",
  "nykyään",
  "nykyisin",
  "tätä nykyä",
  "päivitetty",
  "korvattu",
  "korvattiin",
  "aiemmin",
  "aikaisemmin",
  "ennen (?:asui|oli|työskenteli|käytti|omisti)",
  "(?:asui|oli|työskenteli|käytti|omisti) ennen",
]
# An intention not yet carried out.
plan = [
  "aiko(?:o|vat|i|ivat)",
  "aion",
  "aiomme",
  "suunnittele(?:e|vat|n|mme)",
  "suunnitel(?:lut|leet)",
  "suunnitelmissa",
  "suunnitelma(?:na)? on",
  "on tarkoitus",
  "tarkoituksena",
  "aikomus",
  "aikomuksena",
  "halua(?:a|vat|n|mme|isi|isivat|isin|isimme)",
  "toivo(?:o|vat|n|mme)",
  "pyrki(?:i|vät)",
  "tavoitteena",
  "ensi (?:viikolla|viikon|kuussa|kuun|vuonna|vuoden|vuosineljänneksellä|kvartaalilla|maanantaina|tiistaina|keskiviikkona|torstaina|perjantaina|lauantaina|sunnuntaina|viikonloppuna|keväänä|kesänä|syksynä|talvena)",
  "tulevana? (?:viikolla|viikkona|kuukautena|vuonna|maanantaina|tiistaina|keskiviikkona|torstaina|perjantaina|lauantaina|sunnuntaina|viikonloppuna)",
