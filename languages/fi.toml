# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# Amounts written onto a number: "2v" (years), "3kk" (months), "5pv" (days), "2vk" (weeks).
number_suffixes = ["v", "kk", "pv", "vk", "kpl", "krs"]
# Stems: the templates add the case ending ("lauantaina", "viime keskiviikon").
weekdays = [
  ["maanantai"], ["tiistai"], ["keskiviikko", "keskiviiko"], ["torstai"], ["perjantai"],
  ["lauantai"], ["sunnuntai"],
]
months = [
  ["tammikuu(?:ssa|n|ta|sta|hun|lla|lta)?"], ["helmikuu(?:ssa|n|ta|sta|hun|lla|lta)?"],
  ["maaliskuu(?:ssa|n|ta|sta|hun|lla|lta)?"], ["huhtikuu(?:ssa|n|ta|sta|hun|lla|lta)?"],
  ["toukokuu(?:ssa|n|ta|sta|hun|lla|lta)?"], ["kesäkuu(?:ssa|n|ta|sta|hun|lla|lta)?"],
  ["heinäkuu(?:ssa|n|ta|sta|hun|lla|lta)?"], ["elokuu(?:ssa|n|ta|sta|hun|lla|lta)?"],
  ["syyskuu(?:ssa|n|ta|sta|hun|lla|lta)?"], ["lokakuu(?:ssa|n|ta|sta|hun|lla|lta)?"],
  ["marraskuu(?:ssa|n|ta|sta|hun|lla|lta)?"], ["joulukuu(?:ssa|n|ta|sta|hun|lla|lta)?"],
]
month_names = [
  "tammikuu", "tammikuussa", "tammikuun", "tammikuuta", "helmikuu", "helmikuussa", "helmikuun",
  "helmikuuta", "maaliskuu", "maaliskuussa", "maaliskuun", "maaliskuuta", "huhtikuu",
  "huhtikuussa", "huhtikuun", "huhtikuuta", "toukokuu", "toukokuussa", "toukokuun", "toukokuuta",
  "kesäkuu", "kesäkuussa", "kesäkuun", "kesäkuuta", "heinäkuu", "heinäkuussa", "heinäkuun",
  "heinäkuuta", "elokuu", "elokuussa", "elokuun", "elokuuta", "syyskuu", "syyskuussa", "syyskuun",
  "syyskuuta", "lokakuu", "lokakuussa", "lokakuun", "lokakuuta", "marraskuu", "marraskuussa",
  "marraskuun", "marraskuuta", "joulukuu", "joulukuussa", "joulukuun", "joulukuuta",
]
# "kaksi viikkoa sitten": the postposition follows.
ago = ["{num}\\s+{unit}\\s+(?:sitten|takaperin)"]
# "viimeisen kolmen kuukauden aikana", "viime viikolla"
past = ["(?:viime|viimeisen|viimeisten|viimeisimmän|kuluneen|kuluneiden|edellisen|edellisellä|edellisenä|menneen)\\s+(?:{num}\\s+)?{unit}"]
# "viime kuussa" and "viime vuonna" are the previous calendar month and year; "viimeisen
# kuukauden aikana" is the last thirty days.
calendar = ["^(?:viime|edellise)"]
# "viime lauantaina", "tänä lauantaina", "lauantaina"
last_weekday = ["(?:viime|tänä|edellisenä)\\s+{weekday}(?:na|n)?", "{weekday}na"]
strictly_before = ["^(?:viime|edellisenä)\\s"]
last_weekend = ["(?:viime|edellisenä|edellisen)\\s+viikonlop(?:puna|un|pu)"]
yesterday = ["eilen", "eilisen", "eilisiltana", "eilisaamuna"]
# "tällä viikolla", "tässä kuussa", "tänä vuonna"
this = ["(?:tällä|tässä|tänä|tämän|kuluvalla|kuluvana|kuluvan)\\s+{unit}"]
# "kesäkuun 3. päivänä", then "3. kesäkuuta" and "helmikuussa"
in_month = ["{month}\\s+{day}", "(?:{day}\\.\\s*)?{month}"]

