  "muista(?:kaa)? \\w+(?:[aeiouyäö][aä]|d[aä])",
  "on pakko",
]
preference = [
  "mieluiten",
  "mieluummin",
  "suosi(?:i|vat|n|mme)",
  "rakasta(?:a|vat|n|mme)",
  "tykkä(?:ä|ävät|än|äämme)",
  "pitä(?:ä|vät|n|mme)(?: (?:kovasti|paljon|todella|erityisesti|eniten))? \\w+st[aä]",
  "ei(?:vät)? pidä \\w+st[aä]",
  "nautti(?:i|vat)",
  "nautin",
  "inhoa(?:a|vat|n)",
  "vihaa(?:vat|n)?",
  "lempi\\w+",
  "suosikki\\w*",
  "ei(?:vät)? voi sietää",
  "ei(?:vät)? siedä",
  "allergi(?:nen|sia|set)",
