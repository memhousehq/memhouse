  "\\b(?:on|oli|ovat|olivat) (?:nyt |nykyään )?\\p{L}+n (?:uusi )?(?:esihenkilö|esimies|pomo|kollega|työkaveri|vaimo|aviomies|mies|puoliso|kumppani|tyttöystävä|poikaystävä|veli|sisko|sisar|äiti|isä|poika|tytär|ystävä|serkku|setä|eno|täti|naapuri|mentori|asiakas|toimittaja|omistaja|perustaja|toimitusjohtaja|yhteyshenkilö|sponsori)\\b",
