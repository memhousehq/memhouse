# Only at the start of the statement.
instruction_start = [
  "aina", "älä", "älkää", "varmista(?:kaa)?", "huolehdi(?:than)?", "vältä", "välttäkää", "käytä",
  "käyttäkää", "aja(?:kaa)?", "suorita", "suorittakaa", "muista(?:kaa)? aina",
