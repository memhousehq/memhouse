  "pred (?:týždňom|mesiacom|rokom)",
  "(?:kúpi|preda|navštívi|adoptova|zača|dokonči|skonči|ukonči|absolvova|doštudova|vyštudova|podpísa|pripoji|opusti|zúčastni|oženi|vyda|dosta|získa|spusti|nasadi|odosla|posla|predĺži|obnovi|zruši|zaplati|zarezervova|objedna|vráti|cestova|odcestova|vyhra|prehra|strati|urobi|narodi|zomre|oslávi|zamestna|prepusti|aktualizova|založi|prija|naja|lete)l[aoi]?",
  "stretol",
  "stretl[aoi]",
  "(?:od|pr)?išiel",
  "(?:od|pr)?išl[aoi]",
]

[relations]
relationship = [
  "\\b(?:je|bol|bola|sú|boli|stal sa|stala sa) (?:teraz )?(?:nov(?:ým|ou) )?(?:manažér(?:om|kou)|vedúc(?:im|ou)|šéf(?:om|kou)|nadriaden(?:ým|ou)|kolegom|kolegyňou|manželkou|ženou|manželom|mužom|partner(?:om|kou)|bratom|sestrou|matkou|otcom|synom|dcérou|priateľ(?:om|kou)|kamarát(?:om|kou)|bratrancom|sesternicou|strýkom|tetou|sused(?:om|kou)|mentor(?:om|kou)|zákazník(?:om)?|zákazníčkou|klient(?:om|kou)|dodávateľom|majiteľ(?:om|kou)|zakladateľ(?:om|kou)|riaditeľ(?:om|kou)|kontaktnou osobou|sponzorom)\\s+\\w+",
