# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
# "5-krát", "3-tí"
number_suffixes = ["-?(?:krát|ho|mu|tí|tý|té|ti)"]
# Nominative, accusative ("v sobotu") and genitive ("do soboty").
weekdays = [
  ["pondel(?:ok|ka|ku)"], ["utor(?:ok|ka|ku)"], ["stred[auy]"], ["štvrt(?:ok|ka|ku)"],
  ["piat(?:ok|ka|ku)"], ["sobot[auy]"], ["nedeľ[aue]"],
]
# Nominative, genitive ("3. júna"), locative ("vo februári") and instrumental.
# "mája" is also the name Mája: it is May only after a day or a preposition, or before a year.
months = [
  ["január(?:a|i|om)?"], ["február(?:a|i|om)?"], ["marec", "marc(?:a|i|om)"], ["apríl(?:a|i|om)?"],
  ["máj(?:i|om)?", "(?:\\d{1,2}\\.|od|do|koniec|konca|koncom|začiatok|začiatku|začiatkom|polovici|polovice)\\s*mája", "mája\\s+(?:19|20)\\d{2}"],
  ["jún(?:a|i|om)?"], ["júl(?:a|i|om)?"], ["august(?:a|e|om)?"], ["september", "septembr(?:a|i|om)"],
  ["október", "októbr(?:a|i|om)"], ["november", "novembr(?:a|i|om)"], ["december", "decembr(?:a|i|om)"],
]
month_names = [
  "január", "januára", "januári", "február", "februára", "februári", "marec", "marca", "marci",
  "apríl", "apríla", "apríli", "máj", "mája", "máji", "jún", "júna", "júni", "júl", "júla", "júli",
  "august", "augusta", "auguste", "september", "septembra", "septembri", "október", "októbra",
  "októbri", "november", "novembra", "novembri", "december", "decembra", "decembri",
]
# "pred dvoma týždňami"
ago = ["pred\\s+{num}\\s+{unit}"]
# "za posledný mesiac", "minulý týždeň", "počas posledných troch mesiacov"; "pred týždňom"
past = [
  "(?:posledn(?:ý|ého|om|ú|á|é|ých|ými)|minul(?:ý|ého|om|ú|á|é|ých)|uplynul(?:ý|ého|om|ú|á|é|ých)|predchádzajúc(?:i|eho|om|u|a|e|ich)|predošl(?:ý|ého|om|ú|á|é|ých)|vlaňajš(?:í|ieho|om))\\s+(?:{num}\\s+)?{unit}",
  "pred\\s+{unit}",
]
# "minulý mesiac" and "minulý rok" are the previous calendar month and year; "posledný mesiac"
# is the last thirty days.
calendar = ["^(?:minul|predchádzajúc|predošl|vlaňajš)"]
last_weekday = ["(?:minul(?:ý|ú|é|ého|ej)|posledn(?:ý|ú|é|ého|ej)|uplynul(?:ý|ú|é)|tento|túto|toto|v|vo)\\s+{weekday}"]
strictly_before = ["^(?:minul|posledn|uplynul)"]
last_weekend = ["(?:minul(?:ý|om|ého)|posledn(?:ý|om|ého)|uplynul(?:ý|om|ého))\\s+víkend(?:e|u)?"]
yesterday = ["včera"]
this = ["(?:tento|tohto|tomto|túto|toto|tejto)\\s+{unit}"]
# "vo februári", "3. júna"
in_month = ["(?:{day}\\.\\s*)?{month}"]

