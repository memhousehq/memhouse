# Singular, the form after 2–4 ("dva týždne"), the form after 5+ ("päť týždňov") and the oblique
# cases ("pred týždňom", "pred dvoma týždňami").
[time.units]
day = ["deň", "dň(?:a|om|ami|och)", "dn(?:i|í)"]
week = ["týždeň", "týždň(?:a|i|u|om|ov|ami|och)", "týždne"]
month = ["mesiac(?:a|i|e|u|om|ov|mi|och)?"]
year = ["rok(?:a|u|y|ov|om|mi|och)?"]

# The words that split a question about several things into sub-queries.
[query]
or = ["alebo", "či"]
or_not = ["alebo nie", "či nie", "alebo ani"]
between = ["medzi\\s+(.+?)\\s+a\\s+(.+?)"]
clause = ["keď", "než", "predtým,? ako", "predtým,? než", "potom,? ako", "odkedy", "zatiaľ čo", "kým"]
lead = [
  "ktor(?:ý|á|é|ého|ú|om|ým|ých|ými|ej)", "ak(?:ý|á|é|ého|ú|om|ým|ých|ej)", "čo", "čoho", "čím",
  "kto", "koho", "komu", "kým", "čí", "kedy", "kde", "kam", "odkiaľ",
  "koľko\\s+(?:\\w+)?", "ako\\s+(?:dlho|často|veľmi|starý|stará)?",
  "bol[ai]?", "je", "sú", "som", "mal[ai]?", "má", "mám",
]
article = [
  "ten", "tá", "to", "tie", "tú", "toho", "tej", "môj", "moja", "moje", "moju", "môjho", "náš",
  "naša", "naše", "nášho", "tamten", "tamtá", "tamto",
]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
# "si" is both "you are" and a reflexive ("teraz si daj kávu"), so "teraz si" alone is not a
# phrase: it needs what follows ("… bez obmedzení", "… a nemáš …").
[injection]
override = [
  "\\b(?:ignoruj(?:te)?|ignorovať|nedbaj(?:te)?|zabudni(?:te)?|prehliadaj(?:te)?|prehliadni(?:te)?|prepíš(?:te)?|neriaď(?:te)? sa|nevšímaj(?:te)? si|zahoď(?:te)?)\\b[^.\\n]{0,40}\\b(?:predchádzajúc\\w+|predošl\\w+|doterajš\\w+|skorš\\w+|vyššie uveden\\w+|všetk\\w+|svoj\\w*|tvoj\\w*|vaš\\w+)\\b[^.\\n]{0,25}\\b(?:pokyn\\w*|inštrukci\\w+|príkaz\\w*|pravid\\w+|zásad\\w*|usmerneni\\w+|prompt\\w*)",
]
role_hijack = [
  "\\b(?:(?:odteraz|od teraz|od tejto chvíle|odo dneška),? (?:si|ste|budeš|budete|musíš|musíte|máš|odpovedaj|odpovedajte|odpovedáš)|(?:teraz|odteraz) (?:si|ste) (?:neobmedzen\\w+|necenzurovan\\w+|(?:\\w+ ){1,4}(?:bez|nemáš|nemáte))|správaj(?:te)? sa ako (?:\\w+ ){0,2}(?:neobmedzen\\w+|necenzurovan\\w+|bez (?:\\w+ )?(?:obmedzení|pravidiel|zábran))|konaj(?:te)? ako (?:\\w+ ){0,2}(?:neobmedzen\\w+|necenzurovan\\w+|bez (?:\\w+ )?(?:obmedzení|pravidiel|zábran))|tvár(?:te)? sa,? že nemáš (?:žiadne )?(?:pravidlá|obmedzenia))",
]
system_prompt = [
  "\\b(?:ukáž(?:te)?|zobraz(?:te)?|vypíš(?:te)?|prezraď(?:te)?|odhaľ(?:te)?|vytlač(?:te)?|napíš(?:te)?|povedz(?:te)?|vyzraď(?:te)?)\\b[^.\\n]{0,40}\\b(?:systémov\\w+ (?:prompt\\w*|pokyn\\w*|inštrukci\\w+|správ\\w+)|skryt\\w+ (?:pokyn\\w*|inštrukci\\w+)|vývojársk\\w+ správ\\w+|správ\\w+ (?:od )?vývojára)",
]
memory_directive = [
  "\\b(?:vždy|zakaždým|kedykoľvek|vždy keď)\\b[^.\\n]{0,60}\\b(?:pošli|posielaj|odošli|odosielaj|prepošli|preposielaj|odovzdaj|odovzdávaj|nahraj|nahrávaj|prenes|preveď)(?:te)?\\b[^.\\n]{0,60}\\b(?:na|do|k)\\b[^.\\n]{0,40}(?:https?://|@|\\bpeňaženk\\w+\\b|\\bwallet\\b)",
]
tool_directive = [
  "\\b(?:spusti(?:te)?|spustiť|vykonaj(?:te)?|zavolaj(?:te)?)\\b[^.\\n]{0,30}\\b(?:príkaz|nástroj|funkciu|funkcia)\\b[^.\\n]{0,40}(?:rm -rf|curl [^ ]+\\s*\\|\\s*(?:ba)?sh|transfer_funds|delete_all)",
]
