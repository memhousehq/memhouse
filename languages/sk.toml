instruction = [
  "by mal[aoi]? (?:vždy|nikdy)",
  "(?:musí|musia|musíš|musíte|treba|je potrebné|je nutné) vždy",
  "vždy (?:musí|musia|musíš|musíte|treba|je potrebné|je nutné)",
  "(?:nesmie|nesmú|nesmieš|nesmiete) nikdy",
  "nikdy (?:nesmie|nesmú|nesmieš|nesmiete)",
  "za žiadnych okolností",
]
# Past events: a dated reference or a completed action. Past participles by gender and number.
event = [
  "včera",
  "predvčerom",
  "vlani",
  "(?:minul|vlaňajš|predchádzajúc|predošl)\\w{1,3} (?:týždeň|týždni|týždňa|mesiac|mesiaci|mesiaca|rok|roku|roka|noc|noci|víkend|víkende|pondelok|utorok|stredu|štvrtok|piatok|sobotu|nedeľu|jar|jari|leto|lete|jeseň|jeseni|zimu|zime)",
