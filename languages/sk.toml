# SPDX-License-Identifier: Apache-2.0
# The Slovak language pack. Draft: it passes its test set (languages/tests/sk.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
format = 1
language = "sk"
name = "Slovak"
status = "draft"
# Postgres has no Slovak stemmer.
text_search = "simple"

# Slovak and Czech share much of their vocabulary. The words that tell Slovak from Czech are
# listed too ("som", "sú", "sa", "alebo", "keď", "ktorý", "pri", "pred", "teraz", "nie", "aj",
# "používateľ"), and so are the letters ä, ľ, ĺ, ŕ and ô, which Czech does not have.
[detect]
words = [
  "a", "aj", "i", "v", "vo", "z", "zo", "s", "so", "sa", "k", "ku", "o", "u", "na", "do", "od",
  "po", "za", "pre", "pri", "pred", "medzi", "podľa", "je", "som", "si", "sme", "ste", "sú", "bol",
  "bola", "bolo", "byť", "nie", "má", "mám", "že", "ale", "alebo", "keď", "ako", "čo", "kto", "kde",
  "kedy", "prečo", "ktorý", "ktorá", "ktoré", "ten", "tá", "to", "tento", "už", "len", "iba",
  "ešte", "tiež", "veľmi", "teraz", "môj", "jej", "ich", "náš", "aby", "by", "bude", "používateľ",
]
letters = "áäčďéíĺľňóôŕšťúýž"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# "asi" is left out: it is also "about" ("asi 5 km").
speculation = [
  "možno",
  "možné,? že",
  "snáď",
  "azda",
  "pravdepodobne",
  "zrejme",
  "údajne",
  "vraj",
  "podľa všetkého",
  "vyzerá to",
  "zdá sa",
  "myslím",
  "domnievam sa",
  "tuším",
  "hádam",
  "predpokladám",
  "tipujem",
  "nie som si ist(?:ý|á)",
  "neviem,? či",
  "nie je isté",
  "mohol by",
  "mohl[aoi] by",
  "keby",
  "fám(?:a|y|u|e|ou)",
  "chýr(?:y|ov)?",
  "hovorí sa",
  "povráva sa",
  "hypoteticky",
  "teoreticky",
  "uvažuj(?:e|em|eme|ú|ete)",
  "zvažuj(?:e|em|eme|ú|ete)",
  "rozmýšľa(?:m|me|jú)?",
  "premýšľa(?:m|me|jú)? o",
]
# A change to something stored before.
correction = [
  "vlastne",
  "v skutočnosti",
  # "oprava" is also a repair: only as a heading.
  "oprava[:,]\\s+",
  "korekcia[:,]\\s+",
  "spresnenie",
  "pomýlil[ai]? (?:som|sme) sa",
  "mýlil[ai]? (?:som|sme) sa",
  # "už nepracuje": the verb is negated by its prefix.
  "už nie",
  "už (?:sa |si )?ne\\w{3,}",
  "namiesto",
  "zmenil[aoi]?",
  "preš(?:iel|la|lo|li) (?:na|do|k|ku)",
  "(?:pre|od|vy)sťahoval[aoi]?",
  "teraz",
  "medzitým",
  "aktualizovan(?:ý|á|é)",
  "nahraden(?:ý|á|é)",
  "kedysi",
  "voľakedy",
  "pôvodne",
]
# An intention not yet carried out.
plan = [
  "plánuj(?:e|em|eme|ú|ete|eš)",
  "plánoval[aoi]?",
  "naplánoval[aoi]?",
  "naplánovan(?:ý|á|é)",
  "v pláne",
  "hodl(?:á|ám|áme|ajú)",
  "(?:má|mám|máme|majú) v úmysle",
  "zamýšľa(?:m|me|jú)?",
  "chyst(?:á|ám|áme|ajú) sa",
  "sa chyst(?:á|ám|áme|ajú)",
  "chc(?:e|em|eme|ete|ú|eš)",
  "chcel[aoi]? by",
  "rád by",
  "rada by",
  "radi by",
  "dúfa(?:m|me|jú)?",
  # The compound future: "bude pracovať" (the infinitive ends in -ť).
  "bud(?:em|e|eme|ete|ú|eš) (?:\\w+ ){0,2}\\w+ť",
  # The simple future of common perfective verbs (as English "will visit, will start …").
  "(?:nastúpi(?:m|me)?|začn(?:e|em|eme|ú)|pôjd(?:e|em|eme|u)|polet(?:í|ím|íme)|kúpi(?:m|me)?|navštívi(?:m|me)?|predá(?:m|me)?|predajú|pošl(?:e|em|eme|ú)|podpíš(?:e|em|eme|u)|(?:pre|od)sťahuj(?:e|em|eme|ú) sa|sa (?:pre|od)sťahuj(?:e|em|eme|ú)|prejd(?:e|em|eme)|vráti(?:m|me)? sa|zavolá(?:m|me)?|zarezervuj(?:e|em|eme|ú)|predĺži(?:m|me)?|rozhodn(?:e|em|eme|ú) sa|nasadí(?:m|me)?)",
  "budúc(?:i|eho|om|u|a|ej|e) (?:týždeň|týždni|týždňa|mesiac|mesiaci|mesiaca|rok|roku|roka|štvrťrok|štvrťroku|pondelok|utorok|stredu|štvrtok|piatok|sobotu|nedeľu|víkend|víkende|jar|leto|jeseň|zimu)",
  "nasledujúc(?:i|eho|om|u|a|ej|e) (?:týždeň|týždni|mesiac|mesiaci|rok|roku|štvrťrok|štvrťroku|víkend)",
  "zajtra",
  "pozajtra",
  "čoskoro",
  "onedlho",
  # Years are left out: "o rok starší" is a comparison.
  "o (?:\\d+|dva|dve|tri|štyri|päť|niekoľko|pár) (?:dni|dní|týždne|týždňov|mesiace|mesiacov)",
  "o (?:týždeň|mesiac)",
  "nezabudni(?:te)?",
  "(?:musí|musím|musíme|musia|treba) ešte",
  "ešte (?:musí|musím|musíme|musia|treba)",
  "cieľom je",
]
# The feminine "rada" is also "advice" and "council": it counts only next to a verb.
preference = [
  "uprednostňuj(?:e|em|eme|ú)",
  "dáva(?:m|me|jú)? prednosť",
  "preferuj(?:e|em|eme|ú)",
  "preferenci(?:a|e|u|í)",
  "miluj(?:e|em|eme|ú)",
  "zbožňuj(?:e|em|eme|ú)",
  "neznáša(?:m|me|jú)?",
  "nenávid(?:í|ím|íme|ia)",
  "(?:naj)?obľúben(?:ý|á|é|ého|ú|om|ým|ých|ými|í|ej|ejší|ejšia|ejšie)",
  "rád",
  "radi",
  "nerád",
  "nerad[aiy]",
  "radšej",
  "najradšej",
  "(?:je|má|mám|som|mala|bola|by) (?:\\w+ ){0,2}rada",
  "rada (?:sa |si )?(?:má|chodí|číta|varí|cestuje|pracuje|počúva|hrá|pije|jedáva|pozerá|behá|pláva)",
  "páči sa",
  "sa páči",
  "chutí",
  "nemôž(?:e|em|eme|u) (?:vystáť|zniesť|ani cítiť)",
  "alergick(?:ý|á|é|ú|ého) na",
  "alergi(?:a|u|e|í) na",
]
# Only at the start of the statement.
instruction_start = [
  "vždy", "nikdy", "prosím", "uisti(?:te)? sa", "dbaj(?:te)?", "daj(?:te)? pozor",
  "dávaj(?:te)? pozor", "vyhni(?:te)? sa", "vyvaruj(?:te)? sa", "používaj(?:te)?", "použi(?:te)?",
  "spúšťaj(?:te)?", "spusti(?:te)?", "skontroluj(?:te)?", "over(?:te)?",
