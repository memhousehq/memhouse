"wieħed" = 1
"waħda" = 1
darba = 1
tnejn = 2
"żewġ" = 2
darbtejn = 2
tlieta = 3
tliet = 3
"erbgħa" = 4
"erba'" = 4
"ħamsa" = 5
"ħames" = 5
sitta = 6
sitt = 6
"sebgħa" = 7
"seba'" = 7
tmienja = 8
tmien = 8
"disgħa" = 9
"disa'" = 9
"għaxra" = 10
"għaxar" = 10
"ħdax" = 11
tnax = 12
"tużżana" = 12
"għoxrin" = 20
tletin = 30
"ħamsin" = 50

# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
number_suffixes = ["am", "pm"]
# Most weekday names are also other words ("tnejn" two, "tlieta" three, "erbgħa" four, "ġimgħa"
# week, "ħadd" nobody), so a weekday is read only after "nhar" or before "li għadda".
weekdays = [
  ["(?:it-)?tnejn"], ["(?:it-)?tlieta"], ["(?:l-)?erbgħa"], ["(?:il-)?ħamis"], ["(?:il-)?ġimgħa"],
  ["(?:is-)?sibt"], ["(?:il-)?ħadd"],
]
months = [
  ["jannar"], ["frar"], ["marzu"], ["april"], ["mejju"], ["ġunju"], ["lulju"], ["awwissu"],
  ["settembru"], ["ottubru"], ["novembru"], ["diċembru"],
]
month_names = [
  "jannar", "frar", "marzu", "april", "mejju", "ġunju", "lulju", "awwissu", "settembru", "ottubru",
  "novembru", "diċembru",
]
# "tliet ġimgħat ilu", and the dual, which is one word: "ġimagħtejn ilu", "xahrejn ilu",
# "sentejn ilu", "jumejn ilu" (the stem is the unit, the ending "-ejn" / "-tejn" is the number 2).
ago = ["{num}\\s+{unit}\\s+ilu", "{unit}{num}\\s+ilu"]
# "f'dan l-aħħar xahar", "fl-aħħar tliet xhur", "fl-aħħar ġimagħtejn", "ix-xahar li għadda"; and
# "ġimgħa ilu" (a week ago, no number), read as the time since then. The first two entries have
# no {unit}: they keep "tmiem il-ġimgħa li għadda" (last weekend) and "tliet ġimgħat ilu" (read
# by `ago`) from also being read here.
past = [
  "tmiem\\s+il-ġimgħa\\s+li\\s+għadd(?:a|iet)",
  "(?:\\d+|żewġt?|tliet|tlett|tlitt|ftit|erba['’]|erbat|ħamest?|sitt|seba['’]|sebat|tmien|tmint|disa['’]|disat|għaxart?)\\s+(?:jum|i?jiem|ġurnata|ġranet|ġimgħa|ġimgħat|xahar|xhur|sena|snin)\\s+ilu",
  "\\w{0,3}l-aħħar\\s+(?:{num}\\s+)?{unit}",
  "\\w{0,3}l-aħħar\\s+{unit}{num}",
  "{unit}\\s+li\\s+għadd(?:a|iet|ew)",
  "{unit}\\s+ilu",
]
# "ix-xahar li għadda" and "is-sena li għaddiet" are the previous calendar month and year.
calendar = ["li\\s+għadd(?:a|iet|ew)$"]
# "is-Sibt li għadda", "nhar is-Sibt", "nhar ta' Sibt". The first entry has no {weekday}: it
# keeps "tmiem il-ġimgħa li għadda" (last weekend) from being read as "last Friday".
last_weekday = [
  "tmiem\\s+il-ġimgħa\\s+li\\s+għadd(?:a|iet)",
  "nhar\\s+(?:ta['’]\\s+)?{weekday}(?:\\s+li\\s+għadda)?",
  "{weekday}\\s+li\\s+għadda",
]
strictly_before = ["li\\s+għadda$"]
last_weekend = ["tmiem\\s+il-ġimgħa\\s+li\\s+għadd(?:a|iet)", "weekend\\s+li\\s+għadda"]
yesterday = ["(?:il-?|l-?)?bieraħ"]
# "din il-ġimgħa", "dan ix-xahar", "din is-sena"
this = ["(?:din|dan)\\s+\\w{1,2}-{unit}"]
# "fi Frar", "fit-3 ta' Ġunju"
in_month = ["(?:{day}\\s+ta['’]\\s+)?{month}"]

[time.numbers]
tejn = 2
ejn = 2
"żewġ" = 2
"żewġt" = 2
tliet = 3
tlett = 3
tlitt = 3
ftit = 3
"erba'" = 4
erbat = 4
"ħames" = 5
"ħamest" = 5
sitt = 6
"seba'" = 7
sebat = 7
tmien = 8
tmint = 8
"disa'" = 9
disat = 9
"għaxar" = 10
"għaxart" = 10

# The last form of each unit is the stem of its dual ("ġimagħ-tejn", "xahr-ejn", "sen-tejn",
# "jum-ejn").
[time.units]
day = ["jum", "i?jiem", "ġurnata", "ġranet"]
week = ["ġimgħa", "ġimgħat", "ġimagħ"]
month = ["xahar", "xhur", "xahr"]
year = ["sena", "snin", "sen"]

# The words that split a question about several things into sub-queries.
[query]
or = ["jew"]
or_not = ["jew le"]
between = ["bejn\\s+(.+?)\\s+u\\s+(.+?)"]
clause = ["meta", "qabel\\s+ma", "qabel", "wara\\s+li", "wara", "minn\\s+meta", "sakemm", "waqt\\s+li"]
lead = [
  "x['’]in(?:hu|hi|huma)", "x['’]", "f['’]liema", "liema", "ma['’]\\s+min", "ta['’]\\s+min", "lil\\s+min",
  "min", "meta", "fejn", "kif", "għaliex", "għalfejn", "kemm(?:-il)?(?:\\s+(?:darba|drabi))?",
]
# The article is joined to its noun ("il-kelb"), so only the demonstratives are dropped.
article = ["dan", "din", "dawn", "dak", "dik", "dawk"]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines
# it). In Maltese the qualifier follows the noun ("l-istruzzjonijiet kollha ta' qabel").
[injection]
override = [
  "\\b(?:injora(?:w)?|tagħtix kas|tagħtux kas|insa|insew|warrab|warrbu|aqbeż|ikser)\\b[^.\\n]{0,40}\\b(?:(?:kull|l-ebda) (?:istruzzjoni|regola|direttiva)|(?:istruzzjoni(?:jiet)?|regol[ia]|linji gwida|direttiv[ia]|ordnijiet)\\b[^.\\n]{0,25}\\b(?:kollha|ta['’] qabel|preċedenti|tiegħek|tagħkom|ta['’] fuq|li ngħatajt|li kellek))",
]
role_hijack = [
  "\\b(?:issa (?:int|inti|intom)\\b|(?:int|inti|intom) issa\\b|minn (?:issa|hawn)(?: ['’]i?l quddiem)?,? (?:(?:int|inti|intom) )?(?:se|ser|trid|tridu|għandek|għandkom|tkun|tkunu)\\b|(?:aġixxi|ġib ruħek) (?:bħala|bħal) [^.\\n]{0,30}\\b(?:bla|mingħajr) (?:restrizzjoni(?:jiet)?|limiti|regoli)|agħmel tabirruħek li m['’]għandekx (?:regoli|restrizzjonijiet))",
]
system_prompt = [
  "\\b(?:uri(?:ni|na|li)?|uru(?:ni|na)?|ikxef|ikxfu|ipprintja|agħti(?:ni|na)?|għid(?:li|ilna)?|żvela|ikteb)\\b[^.\\n]{0,40}\\b(?:system prompt|prompt tas-sistema|istruzzjonijiet tas-sistema|istruzzjonijiet (?:moħbija|sigrieti)|messaġġ tal-iżviluppatur)",
]
memory_directive = [
  "\\b(?:dejjem|kull meta|kull darba|kull xħin)\\b[^.\\n]{0,60}\\b(?:ibgħat(?:u|hom|ha|li)?|ibagħtu|għaddi|għaddu|ifforwardja(?:w)?|ittrasferixxi|ittrasferixxu|tella|tellgħu)\\b[^.\\n]{0,80}(?:https?://|@|\\bkartiera\\b|\\bwallet\\b)",
]
tool_directive = [
  "\\b(?:ħaddem|ħaddmu|esegwixxi|esegwixxu|irrani|sejjaħ|sejħu|uża)\\b[^.\\n]{0,20}\\b(?:kmand|għodda|funzjoni|tool)\\b[^.\\n]{0,40}(?:rm -rf|curl [^ ]+\\s*\\|\\s*(?:ba)?sh|transfer_funds|delete_all)",
]
