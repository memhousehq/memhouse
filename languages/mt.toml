[relations]
relationship = [
  "\\b(?:huwa|hija|kien|kienet|sar|saret) (?:issa )?(?:\\w{1,2}-)?(?:maniġer|kap|kollega|mara|raġel|sieħeb|sieħba|ħabib|ħabiba|ħu|oħt|omm|missier|iben|bint|kuġin|kuġina|ziju|zija|ġar|ġara|klijent|fornitur|sid|fundatur|direttur) (?:ta['’]|ta\\w-|tiegħ|tagħ)",
  "\\b(?:[jt]irrapporta lil|[jt]aħdem għal|[jt]aħdem ma['’]|miżżewweġ lil|miżżewġa lil|għarus ta['’]|għarusa ta['’])",
]
people = [
  "oħt", "ħu", "omm", "mama", "missier", "papà", "ġenituri", "mara", "raġel", "sieħeb", "sieħba",
  "iben", "bint", "tifel", "tifla", "tfal", "ħabib", "ħabiba", "ħbieb", "kollega", "kollegi",
  "kap", "maniġer", "tim", "ġar", "ġara", "kuġin", "kuġina", "ziju", "zija", "nanna", "nannu",
  "għarus", "għarusa", "kelb", "qattus", "pet",
]

[values]
stop = [
  "utent", "l-utent", "tal-utent", "tiegħu", "tagħha", "tiegħi", "tagħna", "tagħhom", "huwa",
  "hija", "huma", "kien", "kienet", "kienu", "għandu", "għandha", "għandhom", "issa", "fatt",
  "fil-fatt", "minflok", "flok", "korrezzjoni", "dari", "ukoll", "ħafna", "aktar", "biss", "minn",
  "mill", "għal", "għall", "dawn", "dawk", "meta", "fejn", "liema", "jekk", "biex", "kull", "mhux",
  "qabel", "wara", "bħal", "dwar", "m'għadux", "m'għadhiex",
]
value_stop = [
  "il", "l", "ta", "ta'", "tal", "u", "li", "fi", "f", "fil", "ma", "ma'", "mal", "bi", "b", "bil",
  "lil", "lill", "minn", "mill", "għal", "għall", "utent", "l-utent", "tal-utent", "dan", "din",
  "dawn", "hu", "hi", "huwa", "hija", "huma", "kien", "kienet", "għandu", "għandha", "għandhom",
  "issa", "bħalissa", "riċentement", "total", "darba", "drabi", "kull", "madwar", "kważi", "aktar",
  "inqas", "ukoll", "biss", "għadu", "diġà", "ġdid", "ġdida", "tiegħu", "tagħha", "tagħna",
  "tagħhom", "fuq", "taħt", "xi",
]
identifier = [
  "fattura", "ordni", "tikit", "biljett", "każ", "kont", "id", "nru", "numru", "ref", "referenza",
  "verżjoni", "kamra", "titjira", "mejda", "siġġu", "gate", "pjattaforma", "rotta", "linja",
  "mudell", "serjali", "oġġett", "sku", "problema", "bug", "appartament", "flat", "bini", "sular",
  "kodiċi", "estensjoni",
]
quantity = [
  "żero", "wieħed", "waħda", "tnejn", "żewġ", "tlieta", "tliet", "erbgħa", "erba'", "ħamsa",
  "ħames", "sitta", "sitt", "sebgħa", "seba'", "tmienja", "tmien", "disgħa", "disa'", "għaxra",
  "għaxar", "ħdax", "tnax", "tlettax", "erbatax", "ħmistax", "sittax", "sbatax", "tmintax",
  "dsatax", "għoxrin", "tletin", "erbgħin", "ħamsin", "sittin", "sebgħin", "tmenin", "disgħin",
  "mija", "elf", "miljun", "darba", "darbtejn", "nofs", "tużżana", "ftit", "diversi", "bosta",
]
# "l-1 ta' Marzu", "fit-3 ta' Ġunju"
dates = [
  "\\b\\d{1,2}\\s+ta['’]\\s+(?:jannar|frar|marzu|april|mejju|ġunju|lulju|awwissu|settembru|ottubru|novembru|diċembru)\\b",
]

[values.numbers]
