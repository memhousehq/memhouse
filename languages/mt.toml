  "ikkanċella(?:t|jt|w)?",
  "ħallas",
  "ħallset",
  "ħallast",
  "ħallsu",
  "ibbukkja(?:t|jt|w)?",
  "ordna(?:t|jt|w)?",
  "irritorna(?:t|jt|w)?",
  "siefer",
  "siefret",
  "sifirt",
  "siefru",
  "rebaħ",
  "rebħet",
  "rbaħt",
  "rebħu",
  "tilef",
  "tilfet",
  "tlift",
  "tilfu",
  "għamel",
  "għamlet",
  "għamilt",
