# SPDX-License-Identifier: Apache-2.0
# The Maltese language pack. Draft: it passes its test set (languages/tests/mt.yaml) and has not
# yet been reviewed by a speaker of the language.
# The format is described in docs/languages.md; its JSON Schema is languages/pack.schema.json.
#
# Maltese joins the article to its noun with a hyphen ("il-kelb", "l-utent", "ix-xahar") and
# marks person on the verb with a prefix or an ending ("jixtieq", "tixtieq", "nixtieq"), so the
# patterns list the forms by person. An apostrophe may be straight or curly ("ta'", "ta’").
format = 1
language = "mt"
name = "Maltese"
status = "draft"
text_search = "simple"

[detect]
words = [
  "il", "li", "ta", "tal", "u", "ma", "mal", "fil", "fi", "hu", "hi", "huwa", "hija", "huma",
  "jien", "int", "aħna", "dan", "din", "dawn", "dak", "dik", "minn", "mill", "għal", "għall",
  "bil", "bi", "lil", "lill", "fuq", "taħt", "bejn", "wara", "qabel", "jew", "imma", "iżda", "jekk",
  "meta", "fejn", "kif", "xi", "kien", "kienet", "kienu", "se", "qed", "mhux", "biex", "ukoll",
  "ħafna", "tiegħu", "tagħha", "tiegħi", "tagħna", "tagħhom", "għandu", "għandha", "kull", "issa",
  "liema", "utent",
]
letters = "ċġħż"

# Statement markers (QUAL-02), read in this order: speculation, correction, plan, preference,
# instruction, event. A statement with no marker is a fact.
[statements]
# "jista'" alone (can) is not a hedge; "jista' jkun" (maybe) and "għandu mnejn" (might) are.
speculation = [
  "forsi",
  "probabbli",
  "probabbilment",
  "x['’]aktarx",
  "aktarx",
  "[jt]ista['’] [jt]kun",
  "għand(?:u|ha|hom|i|na|ek) mnejn",
  "naħseb",
  "naħsbu",
  "[jt]aħseb li",
  "nissoponi",
  "nimmaġina",
  "nissuspetta",
  "jidhirli",
  "jidher li",
  "milli jidher",
  "donn(?:u|ha|hom)",
  "mhux ċert\\w*",
  "m['’]inix ċert\\w*",
  "ma nafx jekk",
  "jingħad",
  "għajdut",
  "suppost",
  "allegatament",
  "teoretikament",
  "ipotetikament",
  "(?:qed|qiegħed|qiegħda|qegħdin) (?:[jtn]aħseb|[jtn]aħsbu|[jtn]ikkunsidra\\w*)",
  "kieku",
]
# A change to something stored before. "m'għadux" is "no longer"; "kien joqgħod" (the past of
# "to be" with an imperfect verb) is "used to live", listed for the common verbs only. "issa"
# (now) counts only next to a verb of state: "minn issa 'l quddiem" (from now on) opens plans.
correction = [
  "fil-fatt",
  "fil-verità",
  "fir-realtà",
  "korrezzjoni",
  "żbaljajt",
  "kont żbaljat\\w*",
  "m['’]għad\\w+x",
  "minflok",
  "flok",
  "inbid(?:el|let|lu)",
  "bidd(?:el|let|lu)",
  "bdilt",
  "(?:qaleb|qalbet|qlibt|qlibna|qalbu) (?:għa\\w*|minn|mill-\\w+)",
  "(?:mar|marret|marru) [jt]oq(?:għod|ogħdu)",
  "mort noqgħod",
  "morna noqogħdu",
  "issa (?:għand\\w+|qed|qiegħed|qiegħda|hu|hi|huwa|hija|huma|[jtn]oqgħod|[jtn]għix|[jtn]aħdem|[jtn]uża|[jtn]ippreferi)",
  "(?:għand\\w+|[jtn]oqgħod|[jtn]għix|[jtn]aħdem|[jtn]uża|[jtn]ippreferi) issa",
  "aġġornat\\w*",
  "dari",
  "qabel kien(?:et|u)?",
  "(?:kien|kienet|kont|konna|kienu) (?:[jtn]oqgħod|[jn]oqogħdu|[jtn]għix|[jn]għixu|[jtn]aħdem|[jn]aħdmu|[ij]kollu|[ij]kollha|[ij]kolli|[ij]kollna|[ij]kollhom|[jtn]uża|[jtn]ippreferi)",
]
# An intention not yet carried out. "se" / "ser" before a verb is the future.
plan = [
  "[jtn]?ippjana\\w*",
  "pjan(?:ijiet)? (?:li|biex)",
  "bi ħsieb\\w+",
  "biħsieb\\w+",
  "[jtn]ixtieq\\w*",
  "irid",
  "jrid",
  "trid",
  "irrid",
  "rrid",
  "nrid",
  "(?:i|j|t|ir|n)ridu",
  "[jtn]ittama\\w*",
  "[jtn]immira\\w*",
  "se",
  "ser",
  "sejjer",
  "sejra",
  "sejrin",
  "d-dieħ(?:el|la)",
  "li ġej(?:ja|jin)?",
  "għada",
  "pitgħada",
  "dalwaqt",
  "aktar tard (?:din il-ġimgħa|dan ix-xahar|din is-sena)",
  "ftakar biex",
  "tinsiex",
  "tinsewx",
  "bżonn li",
  "[jt]eħtieġ\\w*",
]
preference = [
  "(?:[jtn]|in)?ippreferi\\w*",
  "preferenza",
  "preferut\\w*",
  "(?:i|j|t|n|in)ħobb(?:u)?",
  "[jtn]obgħod",
  "[jtn]obogħdu",
  "favorit\\w*",
  "[jtn]ie(?:ħu|ħdu) gost",
  "[jt]ogħġ(?:ob|bu)\\w*",
  "ma [jtn]iflaħx",
  "ma [jtn]ifilħux",
  "allerġi(?:ku|ka|ċi)",
]
# Only at the start of the statement. "t…x" is the negative imperative ("tibgħatx").
instruction_start = [
  "dejjem", "qatt", "kun żgur\\w*", "kunu żguri", "aċċerta ruħek", "jekk jogħġbok", "evita(?:w)?",
  "uża(?:w)?", "t\\w{2,}x",
]
instruction = [
  "għand(?:u|ha|hom|ek|kom|na) dejjem",
  "dejjem għand(?:u|ha|hom|ek|kom|na)",
  "qatt m['’]għand\\w+",
  "m['’]għand\\w+ qatt",
]
# Past events: a dated reference or a completed action (he, she, I, they).
event = [
  "(?:il-?|l-?)?bieraħ",
  "lbieraħtlula",
  "li għadd(?:a|iet|ew)",
  "(?:jum|jumejn|jiem|ġimgħa|ġimagħtejn|ġimgħat|xahar|xahrejn|xhur|sena|sentejn|snin) ilu",
  "xtara",
  "xtrat",
  "xtrajt",
  "xtraw",
  "biegħ(?:et|u)?",
  "begħt",
  "żar(?:et|u)?",
  "żort",
