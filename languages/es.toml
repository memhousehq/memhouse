# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
number_suffixes = ["º", "ª", "°", "er", "ro", "do", "h"]
weekdays = [
  ["lunes"], ["martes"], ["miércoles", "miercoles"], ["jueves"], ["viernes"], ["sábado", "sabado"],
  ["domingo"],
]
months = [
  ["enero"], ["febrero"], ["marzo"], ["abril"], ["mayo"], ["junio"], ["julio"], ["agosto"],
  ["septiembre", "setiembre"], ["octubre"], ["noviembre"], ["diciembre"],
]
month_names = [
  "enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre",
  "setiembre", "octubre", "noviembre", "diciembre",
]
# "hace dos semanas", "dos semanas atrás"
ago = ["hace\\s+{num}\\s+{unit}", "{num}\\s+{unit}\\s+atrás"]
# "el último mes", "los últimos tres meses", "la semana pasada"
past = [
  "(?:últim[oa]s?|pasad[oa]s?)\\s+(?:{num}\\s+)?{unit}",
  "{unit}\\s+(?:pasad[oa]|anterior)",
]
# "el mes pasado" and "el año pasado" are the previous calendar month and year; "el último mes"
# is the last thirty days.
calendar = ["^pasad", "(?:pasad[oa]|anterior)$"]
# "el sábado pasado", "el pasado sábado", "el sábado"
last_weekday = ["(?:el|este)\\s+(?:(?:pasado|último)\\s+)?{weekday}(?:\\s+pasado)?"]
strictly_before = ["pasado|último"]
last_weekend = [
  "(?:pasado|último)\\s+(?:fin de semana|finde)",
  "(?:fin de semana|finde)\\s+(?:pasado|anterior)",
]
yesterday = ["ayer"]
this = ["est[ea]\\s+{unit}"]
# "en febrero", "el 3 de junio"
in_month = ["(?:{day}\\s+de\\s+)?{month}"]

[time.numbers]
un = 1
una = 1
uno = 1
dos = 2
"un par de" = 2
tres = 3
unos = 3
unas = 3
algunos = 3
algunas = 3
