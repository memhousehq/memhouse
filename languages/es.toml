seis = 6
siete = 7
ocho = 8
nueve = 9
diez = 10
once = 11
doce = 12
quince = 15

[time.units]
day = ["días?", "dias?"]
week = ["semanas?"]
month = ["mes(?:es)?"]
year = ["años?"]

# The words that split a question about several things into sub-queries.
[query]
or = ["o", "u"]
or_not = ["o no"]
between = ["entre\\s+(.+?)\\s+[ye]\\s+(.+?)"]
clause = ["cuando", "antes de(?: que)?", "después de(?: que)?", "desde que", "mientras", "hasta que"]
lead = [
  "¿?cuál(?:es)?", "¿?qué", "¿?quién(?:es)?", "¿?cuándo", "¿?dónde", "¿?adónde", "¿?cómo",
  "¿?por qué", "¿?cuánt[oa]s?(?:\\s+\\w+)?", "¿?cuánto tiempo",
  "¿?he", "¿?ha", "¿?has", "¿?han", "¿?fue", "¿?era", "¿?es", "¿?son", "¿?está", "¿?tengo",
]
article = [
  "el", "la", "los", "las", "un", "una", "mi", "mis", "nuestro", "nuestra", "ese", "esa", "esos",
  "esas", "aquel", "aquella",
]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  # A qualifier before the noun: "ignora todas las instrucciones", "olvida tus reglas".
  "\\b(?:ignor(?:a|ad|ar|e|en)|olvid(?:a|ad|ar|e|en)|olvídate|olvídese|descart(?:a|e|ar)|omit(?:e|a|ir)|pasa por alto|haz caso omiso|haga caso omiso|no hagas caso|sáltate)\\b[^.\\n]{0,40}\\b(?:todas?|todos|tus?|vuestr[oa]s?|cualquier|anteriores|previ[oa]s)\\b[^.\\n]{0,25}\\b(?:instrucci(?:ón|ones)|indicaci(?:ón|ones)|reglas?|normas?|directrices|directivas?|pautas?|prompts?|órdenes|restricciones)",
  # A qualifier after the noun: "ignora las instrucciones anteriores".
  "\\b(?:ignor(?:a|ad|ar|e|en)|olvid(?:a|ad|ar|e|en)|olvídate|olvídese|descart(?:a|e|ar)|omit(?:e|a|ir)|pasa por alto|haz caso omiso|haga caso omiso|no hagas caso|sáltate)\\b[^.\\n]{0,40}\\b(?:instrucciones|indicaciones|reglas|normas|directrices|directivas|pautas|órdenes|prompts?)\\s+(?:anteriores|previas|precedentes|de arriba|iniciales|originales|recibidas)",
  # The formal imperative with "sus": "ignore sus instrucciones".
  "\\b(?:ignore|olvide|descarte|omita)n?\\b[^.\\n]{0,40}\\bsus?\\b[^.\\n]{0,25}\\b(?:instrucci(?:ón|ones)|indicaci(?:ón|ones)|reglas?|normas?|directrices|directivas?|pautas?|prompts?|órdenes|restricciones)",
]
role_hijack = [
  "\\b(?:ahora eres|eres ahora|ahora (?:tú )?serás|ahora usted es|usted es ahora|ya no eres)\\b",
  "\\b(?:a partir de ahora|de ahora en adelante|desde ahora|desde este momento),? (?:(?:tú |vos )?(?:eres|serás|vas a|debes|deberás|tienes que|tendrás que|\\w+(?:ar|er|ir)ás)|usted (?:es|será|va a|debe|deberá|tiene que|\\w+(?:ar|er|ir)á)|(?:responde|responda|actúa|actúe|habla|hable|compórtate))\\b",
  "\\b(?:actúa|actúe|actuad|compórtate|compórtese|responde|responda)\\b[^.\\n]{0,10}\\bcomo\\b[^.\\n]{0,40}\\b(?:sin (?:ninguna |ningún tipo de )?(?:restricci(?:ón|ones)|límites?|reglas?|filtros?|censura)|no censurad[oa]|jailbreak\\w*|dan)\\b",
  "\\b(?:finge|finja|haz como si|haga como si|imagina que)\\b[^.\\n]{0,20}\\bno (?:tienes|tiene|tuvieras|tuviera) (?:ninguna |ningún )?(?:reglas?|restricci(?:ón|ones)|límites?)",
]
system_prompt = [
  "\\b(?:revel(?:a|e|ad|en|ar)|muestr(?:a|e|en)|mostrar|mostrad|muéstrame|imprim(?:e|a|ir)|enséñame|enseña|enseñe|dime|dame|deme|dígame|escrib(?:e|a|ir)|repite|repita|repetir|comparte|comparta|filtr(?:a|e|ar))\\b[^.\\n]{0,40}\\b(?:prompt (?:de|del) sistema|mensaje (?:de|del) sistema|instrucciones (?:de|del) sistema|instrucciones (?:ocultas|secretas|iniciales)|indicaciones (?:ocultas|secretas)|mensaje (?:de|del) desarrollador|system prompt)",
