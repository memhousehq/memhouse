# Time phrases in questions (HYB-03). {num}, {unit}, {weekday}, {month} and {day} are placeholders.
[time]
number_suffixes = ["º", "ª", "°"]
weekdays = [
  ["lunedì", "lunedi"], ["martedì", "martedi"], ["mercoledì", "mercoledi"], ["giovedì", "giovedi"],
  ["venerdì", "venerdi"], ["sabato"], ["domenica"],
]
months = [
  ["gennaio"], ["febbraio"], ["marzo"], ["aprile"], ["maggio"], ["giugno"], ["luglio"], ["agosto"],
  ["settembre"], ["ottobre"], ["novembre"], ["dicembre"],
]
month_names = [
  "gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre",
  "ottobre", "novembre", "dicembre",
]
# "due settimane fa"
ago = ["{num}\\s+{unit}\\s+fa"]
# "nell'ultimo mese", "gli ultimi tre mesi", "la settimana scorsa"
past = [
  "(?:ultim[oaie]|scors[oaie]|passat[oaie])\\s+(?:{num}\\s+)?{unit}",
  "{unit}\\s+(?:scors[oaie]|passat[oaie]|precedente)",
]
# "il mese scorso", "lo scorso anno" are the previous calendar month and year; "l'ultimo mese" is
# the last thirty days.
calendar = ["^(?:scors|passat)", "(?:scors[oa]|passat[oa]|precedente)$"]
# "sabato scorso", "lo scorso sabato", "sabato"
last_weekday = ["(?:(?:lo\\s+)?scors[oa]\\s+)?{weekday}(?:\\s+(?:scors[oa]|passat[oa]))?"]
strictly_before = ["scors|passat"]
last_weekend = [
  "(?:scorso|ultimo)\\s+(?:fine settimana|week-?end)",
  "(?:fine settimana|week-?end)\\s+(?:scorso|passato)",
]
yesterday = ["ieri"]
# "questa settimana", "questo mese", "quest'anno"
this = ["quest(?:[oa]\\s+|['’]){unit}"]
# "a febbraio", "il 3 giugno", "il 1º giugno"
in_month = ["(?:{day}[º°]?\\s+)?{month}"]

[time.numbers]
un = 1
una = 1
uno = 1
due = 2
"un paio di" = 2
tre = 3
qualche = 3
alcuni = 3
alcune = 3
diversi = 3
diverse = 3
quattro = 4
cinque = 5
sei = 6
sette = 7
otto = 8
nove = 9
dieci = 10
undici = 11
dodici = 12
quindici = 15

[time.units]
day = ["giorn[oi]"]
week = ["settiman[ae]"]
month = ["mes[ei]"]
year = ["ann[oi]"]

# The words that split a question about several things into sub-queries.
[query]
or = ["o", "oppure"]
or_not = ["o no", "o meno"]
between = ["(?:tra|fra)\\s+(.+?)\\s+ed?\\s+(.+?)"]
clause = ["prima che", "prima di", "dopo che", "dopo", "da quando", "quando", "mentre", "finché"]
lead = [
  "qual è", "quale", "quali", "che cosa", "cos['’]è", "cosa", "che", "chi", "quando", "dove",
  "come", "perché", "da quanto tempo", "quant[oaie](?:\\s+\\w+)?",
  "ho", "ha", "è", "sono", "ero", "avevo",
]
article = [
  "il", "lo", "la", "i", "gli", "le", "un", "uno", "una", "mio", "mia", "miei", "mie", "nostro",
  "nostra", "quel", "quello", "quella", "questo", "questa",
]

# Injection phrases: text that reads as an instruction aimed at the agent (the gate quarantines it).
[injection]
override = [
  # A qualifier before the noun: "ignora tutte le istruzioni", "dimentica le tue regole".
  "\\b(?:ignor(?:a|ate|are|i)|dimentic(?:a|ate|are|hi)|scorda(?:ti|tevi|re)?|trascura(?:re|te)?|tralascia(?:re|te)?|non (?:tenere|tenete|tener) conto|non considerare|scavalca(?:re)?)\\b[^.\\n]{0,40}\\b(?:tutt[eio]|tue|tuoi|tua|tuo|vostr[eio]|qualsiasi|qualunque|precedenti|precedente)\\b[^.\\n]{0,25}\\b(?:istruzion[ei]|indicazion[ei]|regol[ae]|direttiv[ae]|linee guida|prompt|ordini|restrizion[ei]|vincoli)",
  # A qualifier after the noun: "ignora le istruzioni precedenti".
  "\\b(?:ignor(?:a|ate|are|i)|dimentic(?:a|ate|are|hi)|scorda(?:ti|tevi|re)?|trascura(?:re|te)?|tralascia(?:re|te)?|non (?:tenere|tenete|tener) conto|non considerare|scavalca(?:re)?)\\b[^.\\n]{0,40}\\b(?:istruzioni|indicazioni|regole|direttive|linee guida|ordini|prompt)\\s+(?:precedenti|di prima|sopra|iniziali|originali|ricevute)",
]
role_hijack = [
  "\\b(?:(?:ora|adesso) sei|sei (?:ora|adesso)|(?:ora|adesso) (?:tu )?sarai|(?:ora|adesso) siete|(?:ora|adesso) lei è)\\b",
  "\\b(?:d['’]ora in (?:poi|avanti)|da (?:adesso|ora) in (?:poi|avanti)|da questo momento(?: in poi)?),? (?:(?:tu )?(?:sei|sarai|devi|dovrai|\\w+(?:er|ir)ai)|(?:voi )?(?:siete|sarete|dovete|dovrete)|lei (?:è|sarà|deve|dovrà)|(?:rispondi|rispondete|agisci|agite|comportati|parla|parlate))\\b",
  "\\b(?:agisci|agite|agisca|comportati|comportatevi|si comporti|rispondi|rispondete)\\b[^.\\n]{0,10}\\b(?:come|da)\\b[^.\\n]{0,40}\\b(?:senza (?:alcuna |nessuna |alcun |nessun )?(?:restrizion[ei]|limit[ei]|regol[ae]|filtr[oi]|censura|vincol[oi])|non censurat[oa]|jailbreak\\w*|dan)\\b",
  "\\b(?:fingi|finga|fai finta|faccia finta|fate finta)\\b[^.\\n]{0,20}\\bnon (?:avere|hai|ha|abbia) (?:alcuna |nessuna )?(?:regol[ae]|restrizion[ei]|limit[ei])",
]
system_prompt = [
  "\\b(?:rivela(?:mi|re|te)?|riveli|mostra(?:mi|re|te)?|mostri|stampa(?:mi|re|te)?|dimmi|dammi|mi dica|scrivi(?:mi)?|scrivere|ripeti(?:mi)?|ripetere|svela(?:mi|re)?|riporta(?:mi|re)?|condividi|fammi vedere|elenca(?:mi|re)?)\\b[^.\\n]{0,40}\\b(?:prompt di sistema|messaggio di sistema|istruzioni di sistema|istruzioni (?:nascoste|segrete|iniziali)|messaggio dello sviluppatore|system prompt)",
]
memory_directive = [
  "\\b(?:sempre|ogni volta|ogniqualvolta|non appena|sistematicamente)\\b[^.\\n]{0,60}\\b(?:invia(?:re|te)?|invii|inoltra(?:re|te)?|inoltri|manda(?:re|te)?|mandi|spedisci|spedire|spedite|trasferisci|trasferire|trasmetti|trasmettere|carica(?:re)?|copia(?:re)?)\\b[^.\\n]{0,60}\\b(?:a|ad|al|alla|allo|verso|su|presso)\\b[^.\\n]{0,40}(?:https?://|@|\\bwallet\\b|\\bportafoglio\\b)",
]
tool_directive = [
  "\\b(?:esegui(?:re|te)?|esegua|lancia(?:re|te)?|avvia(?:re|te)?|chiama(?:re|te)?|invoca(?:re|te)?|richiama(?:re)?)\\b[^.\\n]{0,30}\\b(?:comando|strumento|tool|funzione|script)\\b[^.\\n]{0,40}(?:rm -rf|curl [^ ]+\\s*\\|\\s*(?:ba)?sh|transfer_funds|delete_all)",
]
