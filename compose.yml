# SPDX-License-Identifier: MemHouse-Sustainable-Use-1.0
#
# Local container deployment with external PostgreSQL and durable database/blob volumes.
# Defaults are development-only: set POSTGRES_PASSWORD and MEMHOUSE_AUTH_SIGNING_SECRET
# before exposing the stack. Add `--profile observability` for local tracing and metrics.

services:
  postgres:
    # The `all` image contains pgvector and pgvectorscale for DiskANN indexes.
    image: timescale/timescaledb-ha:pg18-all-oss@sha256:0aaf407844b3cc9adc4e86b326a16de5dbe26a087f09560837f9343c279a6dd5
    environment:
      POSTGRES_DB: memhouse
      # This bootstrap superuser migrates and provisions the restricted application role;
      # pooled traffic runs as NOSUPERUSER NOBYPASSRLS so RLS remains effective.
      POSTGRES_USER: memhouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memhouse-local-only}
    volumes:
      - memhouse-postgres:/var/lib/postgresql
    # Host port 5433 avoids a typical local PostgreSQL on 5432.
    ports:
      - "${MEMHOUSE_POSTGRES_PORT:-5433}:5432"
    # Allow up to 20 attempts, 5 seconds apart, for first-run cluster initialization.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memhouse -d memhouse"]
      interval: 5s
      timeout: 3s
      retries: 20

  memhouse:
    build: .
    # Migrations require PostgreSQL to accept connections, not merely start.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      DATABASE_URL: ecto://memhouse:${POSTGRES_PASSWORD:-memhouse-local-only}@postgres/memhouse
      MEMHOUSE_DATABASE_MODE: external
      # Safe only for this single application replica.
      MEMHOUSE_AUTO_MIGRATE: "true"
      # Public development placeholder; replace with at least 64 random bytes.
      MEMHOUSE_AUTH_SIGNING_SECRET: ${MEMHOUSE_AUTH_SIGNING_SECRET:-replace-this-compose-secret-with-at-least-64-random-bytes-development-only}
      # Original document blobs are durable and use the local volume.
      MEMHOUSE_BLOB_ADAPTER: local
      MEMHOUSE_BLOB_ROOT: /var/lib/memhouse/blobs
      # Enable only with an OTLP collector.
      MEMHOUSE_OTEL_ENABLED: ${MEMHOUSE_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${MEMHOUSE_PORT:-4000}:4000"
    # Original blobs are durable and required for checksum-verified export.
    volumes:
      - memhouse-blobs:/var/lib/memhouse/blobs

  # Optional, ephemeral tooling. It assumes the application emits content-safe telemetry.

  # Receives OTLP and forwards traces and metrics.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./dev/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      # OTLP/HTTP intake and Prometheus-exported metrics.
      - "4318:4318"
      - "8889:8889"

  # Trace viewer on port 16686.
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    profiles: [observability]
    ports:
      - "16686:16686"

  # Metrics UI on port 9090; scrapes the collector.
  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./dev/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

# Removing these volumes destroys durable records and original document bytes.
volumes:
  memhouse-postgres:
  memhouse-blobs:
