# Dependency policy (packaging plan section 4): permissive licences only, no known
# vulnerabilities, crates only from crates.io. Run by `cargo xtask ci` as `cargo deny check`.
# An exception needs a reason here and a maintainer's review (CODEOWNERS).

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
]
# Our own crates are Apache-2.0 but unpublished; check them like any other.
private = { ignore = false }

# Reviewed exception, build time only: the build script of ort-sys downloads ONNX Runtime while
# compiling, over ureq with Mozilla's CA list (CDLA-Permissive-2.0, a permissive data licence).
# Nothing of it is linked into a MemHouse binary; the bans below keep it that way. At run time TLS
# uses the operating system's certificate store.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
version = 2
# Unmaintained or yanked crates are reported; vulnerabilities fail the build.
unmaintained = "workspace"
yanked = "warn"
# Reviewed exception (12 November 2026): SQLite before 3.54.0 can return stale memory when it
# opens a database with a crafted `-wal` file. `libsqlite3-sys` reaches the graph only through
# `rusqlite`, an optional dependency of memhouse-bench's `spike` feature (the G03 technology
# spike examples), which no shipped binary enables; the examples open only files they create.
# The fixed release (0.39) can't be selected while sqlx 0.9 holds `libsqlite3-sys` below 0.38.
# Remove this entry when sqlx allows 0.39 or the spike examples go.
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite only in the optional `spike` examples, which open their own files; the fix is blocked by sqlx 0.9's libsqlite3-sys bound" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "webpki-roots", wrappers = ["ureq"], reason = "bundled CA list; use the OS store (reqwest rustls-tls-native-roots, sqlx tls-rustls-ring-native-roots)" },
  { crate = "webpki-root-certs", reason = "bundled CA list; use the OS store" },
  { crate = "ureq", wrappers = ["ort-sys"], reason = "only the ONNX Runtime download at build time; models are fetched by memhouse-models::hub" },
  { crate = "hf-hub", reason = "its client bundles the CA list; memhouse-models::hub replaces it" },
  { crate = "option-ext", reason = "MPL-2.0; home and config directories come from memhouse_core::config" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
