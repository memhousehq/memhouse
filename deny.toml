# Dependency policy (packaging plan section 4): permissive licences only, no known
# vulnerabilities, crates only from crates.io. Run by `cargo xtask ci` as `cargo deny check`.
# An exception needs a reason here and a maintainer's review (CODEOWNERS).

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
]
# Our own crates are Apache-2.0 but unpublished; check them like any other.
private = { ignore = false }

# Reviewed exception, build time only: the build script of ort-sys downloads ONNX Runtime while
# compiling, over ureq with Mozilla's CA list (CDLA-Permissive-2.0, a permissive data licence).
# Nothing of it is linked into a MemHouse binary; the bans below keep it that way. At run time TLS
# uses the operating system's certificate store.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
version = 2
# Unmaintained or yanked crates are reported; vulnerabilities fail the build.
unmaintained = "workspace"
yanked = "warn"
# Exception for RUSTSEC-2026-0459, FIRST REVIEWED 12 November 2026 FOR A NARROWER CASE AND
# WIDENED IN G16: THE WIDER CASE NEEDS THE MAINTAINER'S REVIEW (it is called out in that pull
# request). SQLite before 3.54.0 can return stale memory when it opens a database with a
# crafted `-wal` file. Until G16 `libsqlite3-sys` reached the graph only through the optional
# `spike` examples, which no shipped binary enabled. Since G16 the Lite profile's store
# (memhouse-store-sqlite) links the bundled SQLite into the `memhouse` binary.
# What limits the exposure: `SqliteStore::open` refuses, on every open, a database whose
# directory is not owned by the running user or is writable by anyone else, so no other local
# user can place a `-wal` beside the database; and MemHouse creates that directory with mode
# 0700 and the file with 0600. What it does not cover: a database directory copied from an
# untrusted source (a backup or an archive someone else prepared) and then opened; and a
# database directory under a parent that another user can write to, who could swap the
# directory between the check and the open (the check looks at the directory itself only).
# ACCEPTED BY THE MAINTAINER ON 25 November 2026 for the Lite profile, with these limits.
# The fixed release (libsqlite3-sys 0.39) can't be selected while sqlx 0.9 holds
# `libsqlite3-sys` below 0.38. Remove this entry as soon as sqlx allows it.
#
# Reviewed exception (20 November 2026): chrono was declared unmaintained (all versions; there is
# no fixed release to move to). This is a maintenance notice, not a vulnerability: no flaw in
# the code MemHouse uses is reported. chrono is used for every timestamp in the engine, the
# store (through sqlx's `chrono` feature) and the API schema, so replacing it is a change of
# its own, not a version bump. Remove this entry when the dates move to a maintained crate, or
# at once if a vulnerability is reported against chrono (that advisory would fail the build on
# its own id).
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no fixed version; a maintenance notice, not a vulnerability; replacing it touches the engine, the store and the API schema and is planned as its own change" },
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite in the Lite store, which opens a database only in a directory verified to be the user's own and closed to others; not covered: a database directory taken from an untrusted source; the fix is blocked by sqlx 0.9's libsqlite3-sys bound" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "webpki-roots", wrappers = ["ureq"], reason = "bundled CA list; use the OS store (reqwest rustls-tls-native-roots, sqlx tls-rustls-ring-native-roots)" },
  { crate = "webpki-root-certs", reason = "bundled CA list; use the OS store" },
  { crate = "ureq", wrappers = ["ort-sys"], reason = "only the ONNX Runtime download at build time; models are fetched by memhouse-models::hub" },
  { crate = "hf-hub", reason = "its client bundles the CA list; memhouse-models::hub replaces it" },
  { crate = "option-ext", reason = "MPL-2.0; home and config directories come from memhouse_core::config" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
