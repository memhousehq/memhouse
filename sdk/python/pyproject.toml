# SPDX-License-Identifier: Apache-2.0
[project]
name = "memhouse"
version = "2.0.0rc2"
description = "Python SDK for MemHouse, a governed memory service for AI agents: a client generated from the OpenAPI specification, and lifecycle hooks that only call the API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
# No runtime dependencies: HTTP goes through the standard library.
dependencies = []
keywords = ["memory", "agents", "llm", "governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

# Framework adapters (memhouse.adapters.*). The frameworks need Python 3.10 or newer; the
# versions are the lowest the adapters were tested with.
[project.optional-dependencies]
openai-agents = ["openai-agents>=0.26.0; python_version >= '3.10'"]
langgraph = ["langgraph>=1.2.24; python_version >= '3.10'"]

[project.urls]
Repository = "https://github.com/memhousehq/memhouse"
Documentation = "https://github.com/memhousehq/memhouse/blob/main/docs/sdk.md"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
